<style>
:root{
  --green:#1F5F3A; --tint:#e6e8d2; --g2:#8DBE9C; --text:#2b1d10; --muted:#7a6347; --track:#e1d2ae; --line:#d8c69c;
  --bad:#A8392A; --acc:#1F5F3A; --paper:#f1e6c8; --paper2:#ebddb8; --paperhi:#faf3df; --chipbg:#e6d8b4; --tintline:#cfc7a0; --ink:#2b1d10;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;background:#4a2d17;color:var(--text);
  font-family:Alegreya,Georgia,"Times New Roman",serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{height:100dvh;overflow:hidden;position:fixed;inset:0;width:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea{font:inherit;color:inherit}
.num{font-family:Cinzel,Georgia,serif;font-variant-numeric:lining-nums tabular-nums}

#app{height:100%;display:flex;flex-direction:column;padding-top:var(--sat)}
#pagerWrap{flex:1;min-height:0;overflow:hidden;position:relative}
#pager{display:flex;width:200%;height:100%;transition:transform .28s cubic-bezier(.3,.7,.2,1)}
.page{width:50%;height:100%;padding:0 16px;display:flex;flex-direction:column;gap:7px;min-height:0}
.page.scrolly{overflow-y:auto;-webkit-overflow-scrolling:touch}
.dots{display:flex;justify-content:center;gap:8px;height:44px;align-items:center}
.dots button{width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--track);display:block;transition:all .2s}
.dots button.on i{background:var(--green);width:18px;border-radius:4px}

.top{display:flex;align-items:center;justify-content:space-between;height:44px;flex-shrink:0}
.top h1{margin:0;font-size:21px;font-weight:700;letter-spacing:-.4px}
.top h1 span{color:var(--acc)}
.icon-btn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;margin-right:-10px;border-radius:12px;color:var(--acc)}
.icon-btn svg{width:24px;height:24px}

.balance{text-align:center;flex-shrink:0;padding:2px 0 0}
.balance .big{font-size:50px;font-weight:700;letter-spacing:-1.5px;color:var(--acc);line-height:1.05}
.balance .lbl{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-top:1px}
.balance .sub{font-size:12.5px;color:var(--muted);margin-top:3px}

.bars{display:grid;grid-template-columns:1fr 1fr;gap:14px;flex-shrink:0}
.bar .bl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:4px}
.bar .bl b{color:var(--text);font-weight:600}
.track{height:6px;background:var(--track);border-radius:3px;overflow:hidden}
.track i{display:block;height:100%;background:var(--green);border-radius:3px;transition:width .3s}
.bar.bonus .track i{background:var(--g2)}

.cal{flex:1;min-height:0;display:flex;flex-direction:column}

.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;flex:1;min-height:0;grid-auto-rows:minmax(0,1fr);max-height:240px}

.winsrow{flex-shrink:0;display:flex;align-items:center;gap:8px;min-height:30px;font-size:12.5px;color:var(--muted)}

.why-chk{display:block;width:100%;min-height:48px;text-align:left;padding:8px 10px;margin:8px 0 0;border-radius:12px;background:#f6e3b4;font-size:14px}.why-chk b{display:block}.why-chk span{font-size:12.5px;color:var(--muted)}

.it-n{display:flex;flex-direction:column;align-items:flex-end;flex-shrink:0}.it-n b{font-size:18px;font-weight:700;line-height:1.1}.it-n small{font-size:11px;color:var(--muted)}
.g-aisle{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:12px 0 0}
.g-x{color:var(--acc);font-weight:700;font-size:14px}
.g-add{display:flex;gap:8px;margin:12px 0 10px}.g-add .field{flex:1;min-width:0;margin:0}.g-add .btn{margin:0;width:auto;padding:0 18px}
.idea{border:1px solid var(--line);border-radius:16px;padding:12px;margin:10px 0;background:var(--paper2)}

.idea-h{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:8px 0 2px}
.idea-l{margin:0 0 6px;padding-left:20px;font-size:14px;line-height:1.4}

.mc-chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--g2);display:flex;align-items:center;justify-content:center;flex-shrink:0}

.vdot.vn{background:var(--track)}

.dhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;font-size:16px}

.dl{flex:1;min-width:0}.dl b{display:block;font-size:15px;line-height:1.2}.dl span{font-size:12px;color:var(--muted)}

.spin{width:36px;height:36px;border:4px solid var(--track);border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite}

.seg{display:flex;background:var(--chipbg);border-radius:11px;padding:3px;gap:3px}

.over{position:fixed;inset:0;z-index:30;background:var(--paperhi);display:flex;flex-direction:column;padding-top:var(--sat)}

#toast{position:fixed;left:50%;top:calc(var(--sat) + 8px);transform:translate(-50%,-90px);background:#1d1d1f;color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;font-weight:500;z-index:99;max-width:88%;text-align:center;transition:transform .25s}

@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}

<script>
/* ============================================================
   GleefulHabit 3.0 — the lodge. Single file, localStorage only (key: gh3).
   First open copies your 2.0 save (gh2) once; 2.0 and v1 are never modified here.
   ============================================================ */

/* ── Constants ── */
const SCHEMA = 3;
const STORE_KEY = 'gh3';
const V2_KEY = 'gh2';
const V1_KEY = 'habitflow';
const LAUNCH = '2026-11-30';       // 3.0 day one (a Monday): the training plan and the packs start here
const LEGACY_END = '2026-11-29';   // the old spending money stops here; it stays in History, read-only
const APP_VERSION = '2026-11-28.0330';
const HABITS = ['workout','protein','wind','sleep'];                 // the four on the main page. Less sugar is switched off (its data is kept) until January 2027.
const LEGACY_HABITS = ['workout','protein','wind','sugar'];          // what 2.0 counted, for days before LAUNCH
const SUGAR_CUTOFF_HOUR = 22;   // (2.0) Less sugar settled at 10pm
const HABIT_META = {
  workout:{name:'Workout',icon:'🏋️'},
  protein:{name:'Protein',icon:'🍗'},
  wind:{name:'Wind down',icon:'🌙'},
  sleep:{name:'Sleep',icon:'🛏️'},
  sugar:{name:'Less sugar',icon:'🍬'},
};
const PAUSABLE = ['workout','wind','sleep'];   // Protein only pauses via Sick day

/* ── Dates (all keys are local YYYY-MM-DD) ── */
const pad = n => String(n).padStart(2,'0');
const dkOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseDk = dk => { const [y,m,d] = dk.split('-').map(Number); return new Date(y, m-1, d); };
const todayKey = () => dkOf(new Date());
const addDays = (dk, n) => { const d = parseDk(dk); d.setDate(d.getDate()+n); return dkOf(d); };
const diffDays = (a, b) => Math.round((parseDk(b) - parseDk(a)) / 86400000);
const ymOf = dk => dk.slice(0,7);
const dim = ym => { const [y,m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); };
const addMonths = (ym, n) => { const [y,m] = ym.split('-').map(Number); const d = new Date(y, m-1+n, 1); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; };
const weekStart = dk => { const d = parseDk(dk); const dow = d.getDay(); d.setDate(d.getDate() + (dow === 0 ? -6 : 1 - dow)); return dkOf(d); };
const weekDays = dk => { const s = weekStart(dk); return Array.from({length:7}, (_, i) => addDays(s, i)); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

/* Logging window: today any time; yesterday until noon, then it locks. */
function canLog(dk) {
  const t = todayKey();
  if (dk === t) return true;
  if (dk === addDays(t, -1)) return new Date().getHours() < 12;
  return false;
}

/* ── State ── */
/* Grocery aisles (store order). Defined up here because migrateState runs before the rest of the script. */
const AISLES = ['Produce', 'Protein', 'Dairy', 'Grains & bread', 'Canned & dry', 'Frozen', 'Other'];
const GROCERY_MAX = 150;
let _groceryDirty = false;   // the list changed inside a sheet: redraw the Weight page card when the sheet closes
/* My pantry: foods I actually eat, with the numbers off the label. Seeded once; a deliberately emptied pantry stays empty.
   Defined up here (hoisted) because migrateState runs before the rest of the script. */
const PANTRY_MAX = 150;
function seedPantry() {
  const P = (id, name, brand, servingLabel, protein, addedSugar, fiber, satFat, aliases) => ({ id, name, brand, servingLabel, servingGrams:null, protein, addedSugar, fiber, satFat, aliases });
  return [
    P('p-tuna', 'Wild Planet Skipjack Tuna, no salt added', 'Wild Planet', '1 can (5 oz)', 32, 0, 0, 0.5, ['tuna', 'skipjack', 'skipjack tuna', 'canned tuna', 'wild planet']),
    P('p-gyogurt', 'Kirkland Nonfat Greek Yogurt', 'Kirkland', '2/3 cup', 18, 0, 0, 0, ['greek yogurt', 'yogurt', 'kirkland yogurt', 'nonfat greek yogurt']),
    P('p-mayo', '365 Organic Light Mayo', '365', '1 tbsp', 0, 0, 0, 0, ['mayo', 'light mayo', 'mayonnaise']),
    P('p-sausage', 'Jones Golden Brown Turkey Sausage', 'Jones', '4 links', 10, 0, 0, 1.5, ['jones sausage', 'turkey sausage', 'sausage', 'sausages', 'jones farm sausages']),
    P('p-eggwhites', 'Liquid egg whites', '', '1 cup', 26, 0, 0, 0, ['egg whites', 'egg white', 'liquid egg white']),
    P('p-egg', 'Whole egg', '', '1 large', 6, 0, 0, 1.5, ['egg', 'eggs', 'whole eggs']),
    P('p-cottage', 'Low-fat cottage cheese', '', '1/4 cup', 7, 0, 0, 0.5, ['cottage cheese', 'low fat cottage cheese']),
    P('p-blackberries', 'Blackberries', '', '1 cup', 2, 0, 8, 0, ['blackberry', 'blackberries']),
    P('p-chili', "Annie's Low-Sodium Chili", "Annie's", '1 can', 29, 0, 14, 2, ['chili', "annie's chili", 'annies chili']),
    P('p-skyr', 'Icelandic Provisions Vanilla Skyr', 'Icelandic Provisions', '1 cup', 15, 6, 0, 1, ['skyr', 'icelandic skyr', 'vanilla skyr']),
    P('p-nuttzo', 'NuttZo Mixed Nut & Seed Butter', 'NuttZo', '2 tbsp', 6, 0, 3, 2, ['nuttzo', 'nut butter', 'seed butter', '7 nut butter']),
    P('p-edamame', 'The Only Bean Roasted Edamame', 'The Only Bean', '1 pack', 12, 0, 5, 1, ['edamame', 'only bean', 'roasted edamame']),
    P('p-fairlife', 'Fairlife 2% Ultra-Filtered Milk', 'Fairlife', '1 cup', 13, 0, 0, 3, ['fairlife', 'fairlife milk', 'milk']),
  ];
}
function cleanPantry(raw) {
  const num = v => { const n = +v; return v !== '' && v != null && typeof v !== 'boolean' && isFinite(n) && n >= 0 ? Math.round(Math.min(n, 5000) * 10) / 10 : 0; };
  const seen = new Set(), out = [];
  for (const p of Array.isArray(raw) ? raw : []) {
    if (!p || typeof p !== 'object' || !p.id || typeof p.name !== 'string' || !p.name.trim() || seen.has(String(p.id))) continue;
    seen.add(String(p.id));
    out.push({ id:String(p.id).slice(0, 40), name:p.name.trim().slice(0, 60), brand:typeof p.brand === 'string' ? p.brand.trim().slice(0, 40) : '',
      servingLabel:typeof p.servingLabel === 'string' && p.servingLabel.trim() ? p.servingLabel.trim().slice(0, 40) : '1 serving',
      servingGrams:+p.servingGrams > 0 && isFinite(+p.servingGrams) ? Math.round(+p.servingGrams * 10) / 10 : null,
      protein:num(p.protein), addedSugar:num(p.addedSugar), fiber:num(p.fiber), satFat:num(p.satFat),
      aliases:(Array.isArray(p.aliases) ? p.aliases : []).map(a => String(a == null ? '' : a).trim().toLowerCase().slice(0, 30)).filter(Boolean).slice(0, 8) });
  }
  return out.slice(0, PANTRY_MAX);
}
/* Cached "Why rough?" fixes: only valid dates from the last 14 days, text trimmed, at most 2 fixes a day. */
function cleanInsights(raw) {
  const out = {}; if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return out;
  const cut = addDays(todayKey(), -14);
  for (const dk of Object.keys(raw)) {
    const e = raw[dk];
    if (!/^\d{4}-\d{2}-\d{2}$/.test(dk) || dk < cut || !e || typeof e !== 'object' || !Array.isArray(e.fixes)) continue;
    const fixes = e.fixes.map(f => f && typeof f === 'object' && typeof f.text === 'string' && f.text.trim() ? { text:f.text.trim().slice(0, 160), savedMealId:typeof f.savedMealId === 'string' && f.savedMealId ? f.savedMealId.slice(0, 40) : null } : null).filter(Boolean).slice(0, 2);
    if (fixes.length) out[dk] = { fixes, generatedAt:+e.generatedAt || 0 };
  }
  return out;
}
function cleanAisle(a) { const x = String(a == null ? '' : a).trim().toLowerCase(); return AISLES.find(n => n.toLowerCase() === x) || null; }
/* The seeded saved meal starts unscored (result:null); the first tap scores it once and caches it. */
function seedMeals() {
  return [{ id:'seed-breakfast', name:'Usual breakfast', desc:'2 eggs, ½ cup egg whites, 2 tbsp cottage cheese, scrambled with olive oil spray', result:null, uses:0, lastUsed:null }];
}
/* Training plan state (hoisted: migrateState runs before the rest of the script). Targets are per set; hang and carry are seconds. */
function blankTraining() {
  return { planStart:LAUNCH, restSec:90, cur:null, log:[],
    lifts:{ goblet:{ reps:10, lb:26 }, deadlift:{ reps:10, lb:26 }, bench:{ reps:8, lb:20 }, row:{ reps:10, lb:20 }, hang:{ secs:15 }, carry:{ secs:30, lb:26 } } };
}
function cleanTraining(raw) {
  const b = blankTraining(), t = raw && typeof raw === 'object' ? raw : {};
  const n = (v, lo, hi, d) => { const x = Math.round(+v); return isFinite(x) && x >= lo && x <= hi ? x : d; };
  const out = { planStart:/^\d{4}-\d{2}-\d{2}$/.test(t.planStart || '') ? t.planStart : b.planStart, restSec:n(t.restSec, 30, 300, 90), cur:null, log:[], lifts:{} };
  for (const k of Object.keys(b.lifts)) {
    const d = b.lifts[k], r = t.lifts && t.lifts[k] && typeof t.lifts[k] === 'object' ? t.lifts[k] : {}, o = {};
    for (const f of Object.keys(d)) o[f] = n(r[f], f === 'lb' ? 0 : 1, f === 'lb' ? 500 : 600, d[f]);
    out.lifts[k] = o;
  }
  const c = t.cur;
  if (c && typeof c === 'object' && /^\d{4}-\d{2}-\d{2}$/.test(c.dk || '') && (c.kind === 'strength' || c.kind === 'bike')) {
    out.cur = { dk:c.dk, kind:c.kind, at:+c.at || 0, warm:Array.isArray(c.warm) ? c.warm.slice(0, 8).map(x => !!x) : [], mins:n(c.mins, 0, 300, 0), sets:{} };
    for (const k of Object.keys(b.lifts)) { const a = c.sets && c.sets[k]; out.cur.sets[k] = Array.isArray(a) ? a.slice(0, 3).map(x => !!x) : [false, false, false]; while (out.cur.sets[k].length < 3) out.cur.sets[k].push(false); }
  }
  out.log = (Array.isArray(t.log) ? t.log : []).filter(x => x && typeof x === 'object' && /^\d{4}-\d{2}-\d{2}$/.test(x.dk || '')).slice(-200)
    .map(x => ({ dk:x.dk, kind:x.kind === 'bike' ? 'bike' : 'strength', week:n(x.week, 1, 999, 1), mins:n(x.mins, 0, 300, 0), sets:n(x.sets, 0, 30, 0), hit:Array.isArray(x.hit) ? x.hit.filter(k => b.lifts[k]) : [] }));
  return out;
}
function cleanSleep(raw) {
  const out = {}; if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return out;
  for (const dk of Object.keys(raw)) { const m = Math.round(+raw[dk]); if (/^\d{4}-\d{2}-\d{2}$/.test(dk) && isFinite(m) && m >= 0 && m <= 1000) out[dk] = m; }
  return out;
}
function cleanPacks(raw) {
  const r = raw && typeof raw === 'object' ? raw : {};
  const log = (Array.isArray(r.log) ? r.log : []).map(x => +x).filter(x => isFinite(x) && x > 0).slice(-500);
  return { opened:Math.max(0, Math.round(+r.opened) || 0), log };
}
function blankState() {
  return {
    schema: SCHEMA,
    startDate: null,
    settings: { monthly:200, drip:100, pool:50, proteinGoal:150, sugarBudget:25, workoutWeek:3, freeDaysPerYear:10, fiberGoal:30, satFatGoal:18, satFatV:1 },
    days: {},        // dk -> { workout, windDown, foods:[] }
    pauses: [],      // { id, habit, from, to|null, why, expect, planned, back, sick, sickId }
    freeDays: [],    // ['YYYY-MM-DD', ...] set in advance only
    spends: [],      // { id, dk, cents, cat }
    wins: [],        // { id, dk, label, other }
    savedMeals: seedMeals(),   // Meal Check: { id, name, desc?, result|null, uses, lastUsed }
    groceryList: [],  // { id, item, amount, aisle, count, checked, addedTs } (Weight page + Meal Check + Meal ideas)
    recentSuggestions: [],   // Meal ideas shown in the last 7 days: { name, ts }
    pantry: seedPantry(),    // My pantry: { id, name, brand, servingLabel, servingGrams|null, protein, addedSugar, fiber, satFat, aliases[] } per serving shown
    dayInsights: {},         // 'Why was my day rough?' fixes cached per day (last 14 days): { 'YYYY-MM-DD': { fixes:[{text, savedMealId|null}], generatedAt } }
    mealChecks: [],  // Meal Check history (last 365 days): { id, date, ts, mealName, verdict, protein_g, added_sugar_g, fiber_g, sat_fat_g, logged }
    weight: { unit:'lbs', goal:null, logs:{} },
    months: {},      // 'YYYY-MM' -> frozen month-close snapshot
    comeback: null,  // { from, gapDays, firstLog }
    imported: null,  // { at, from:'v1', counts }
    sleep: {},       // wake-up date -> minutes slept the night before
    training: blankTraining(),   // the plan: current lift targets, the session in progress, finished sessions
    packs: { opened:0, log:[] }, // packs opened so far (earned ones are derived from the workouts)
    ui: { lastVersion:null, v1Offer:'none', theme:'auto', from2:null },
  };
}

/* Every new field gets a default here. Shared by normal load and backup import. */
function migrateState(raw) {
  const b = blankState();
  if (!raw || typeof raw !== 'object') return b;
  const s = Object.assign(b, raw);
  s.schema = SCHEMA;
  s.settings = Object.assign(blankState().settings, raw.settings || {});
  for (const k of ['days','months']) if (!s[k] || typeof s[k] !== 'object') s[k] = {};
  for (const k of ['pauses','freeDays','spends','wins']) if (!Array.isArray(s[k])) s[k] = [];
  if (!s.weight || typeof s.weight !== 'object') s.weight = { unit:'lbs', goal:null, logs:{} };
  if (!s.weight.logs) s.weight.logs = {};
  if (!s.weight.unit) s.weight.unit = 'lbs';
  if (s.weight.goal === undefined) s.weight.goal = null;
  s.ui = Object.assign({ lastVersion:null, v1Offer:'none', theme:'auto', from2:null }, raw.ui || {});
  if (['auto', 'day', 'night'].indexOf(s.ui.theme) < 0) s.ui.theme = 'auto';
  s.sleep = cleanSleep(raw.sleep); s.training = cleanTraining(raw.training); s.packs = cleanPacks(raw.packs);
  if (s.comeback === undefined) s.comeback = null;
  if (s.imported === undefined) s.imported = null;
  for (const k of ['fiberGoal', 'satFatGoal']) if (!(+s.settings[k] > 0)) s.settings[k] = blankState().settings[k];
  if (!(raw.settings && raw.settings.satFatV)) { if (+s.settings.satFatGoal === 13) s.settings.satFatGoal = 18; s.settings.satFatV = 1; }   // the old 13 g default became 18 g, once; a limit you set yourself is kept
  s.savedMeals = Array.isArray(raw.savedMeals) ? raw.savedMeals.filter(m => m && typeof m === 'object' && m.id && typeof m.name === 'string')
    : seedMeals();                                   // an old save gets the seeded meal; a deliberately emptied list stays empty
  s.savedMeals.forEach(m => { m.uses = +m.uses || 0; if (m.result === undefined) m.result = null; });
  if (!Array.isArray(s.mealChecks)) s.mealChecks = [];
  if (!Array.isArray(raw.groceryList) && Array.isArray(raw.shoppingList)) s.groceryList = raw.shoppingList.map(x => x && typeof x === 'object' && x.id && typeof x.text === 'string' ? { id:x.id, item:x.text, amount:'', aisle:'Other', count:1, checked:!!x.done, addedTs:+x.added || 0 } : null);   // the first flat list becomes the aisle list
  delete s.shoppingList;
  s.groceryList = (Array.isArray(s.groceryList) ? s.groceryList : []).filter(x => x && typeof x === 'object' && x.id && typeof x.item === 'string' && x.item.trim())
    .map(x => ({ id:String(x.id), item:x.item.trim().slice(0, 60), amount:typeof x.amount === 'string' ? x.amount.slice(0, 30) : '', aisle:cleanAisle(x.aisle) || 'Other', count:Math.min(99, Math.max(1, Math.round(+x.count) || 1)), checked:!!x.checked, addedTs:+x.addedTs || 0 })).slice(-GROCERY_MAX);
  { const cut = Date.now() - 7 * 864e5; s.recentSuggestions = (Array.isArray(s.recentSuggestions) ? s.recentSuggestions : []).filter(x => x && typeof x.name === 'string' && x.name && +x.ts >= cut).map(x => ({ name:x.name.slice(0, 60), ts:+x.ts })).slice(-60); }
  s.dayInsights = cleanInsights(s.dayInsights);

/* ── Money engine ──

   $100 daily drip: pot ÷ days in month ÷ 4 habits per day, full share when done, half when small.
   $50 bonus pool: +$2 fully-logged week, +$3 per workout past 3, welcome-back after a 3+ day pause. Capped per month.
   The other $50 of the $200 stays outside the app. */
const BONUS = { week:200, extraWorkout:300, wbMin:3, wbCap:500, win:50, winsPerDay:3 };   // cents; a little win pays 50¢ from the bonus pool, the first 3 each day
const KIND_ORDER = { week:0, extra:1, back:2, win:3 };

  return from > last ? 0 : diffDays(from, last) + 1;
}
function dripFor(ym) {                       // dollars, unrounded

  for (let d = 1; d <= dim(ym); d++) {
    const dk = `${ym}-${pad(d)}`;
    if ((S.startDate && dk < S.startDate) || dk > today) continue;
    for (const h of LEGACY_HABITS) earn += share * habitState(h, dk).share;

}
/* The log that counts as "the habit resumed": a real session/entry (a rest day doesn't). */
function payingLog(h, dk) {

  if (h === 'workout') return !!(d.workout && d.workout.kind === 'workout');
  if (h === 'protein' || h === 'sugar') return d.foods.length > 0;

/* Welcome-back amount for a pause that ended: day N = pause day number on the day you come back.

  const ev = [], today = legacyNow(), start = S.startDate || today;

    const days = weekDays(w), sun = days[6];
    const wk = days.filter(dk => dk >= start && dk <= today && S.days[dk] && S.days[dk].workout && S.days[dk].workout.kind === 'workout');
    wk.forEach((dk, i) => { if (i >= S.settings.workoutWeek) ev.push({ dk, kind:'extra', cents:BONUS.extraWorkout }); });
    if (sun <= today && days[0] >= start) {          // a fully logged week: every habit, every day, Mon-Sun
      let all = true, real = 0;
      for (const dk of days) { for (const h of LEGACY_HABITS) { const s = habitState(h, dk); if (!s.logged) { all = false; break; } if (s.st !== 'paused' && s.st !== 'free') real++; } if (!all) break; }

  for (const w of S.wins.slice().sort((a, b) => (a.at || 0) - (b.at || 0))) {
    if (w.dk < start || w.dk > today) continue;
    perDay[w.dk] = (perDay[w.dk] || 0) + 1;

function moneyFor(ym) {

  const logs = [];

  const early = w => LIGHTS_RANK[w.lights] <= 1;           // lights out by 10:00

function onSayIt() { aiMode = 'say'; renderProteinOver(); setTimeout(() => { const t = $('aiText'); if (t) t.focus(); }, 60); }
function fileToJpeg(file, max, quality) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = reject;
    fr.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const sc = Math.min(1, (max || 1280) / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        const url = c.toDataURL('image/jpeg', quality || .82);
        resolve({ b64:url.split(',')[1], type:'image/jpeg', url });
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
async function onSnap(ev) {

async function analyzeMeal() {
  const st = $('aiStatus'), btn = $('aiBtn');
  if (!localStorage.getItem('gh_ai_key')) { st.textContent = 'Add your Anthropic API key below first.'; return; }
  const desc = ($('aiText').value || '').trim();
  if (!desc && !aiPhoto) { st.textContent = 'Say or type what you ate, or snap a photo first.'; return; }
  btn.disabled = true; st.textContent = 'Estimating…';
  const content = [];
  if (aiPhoto) content.push({ type:'image', source:{ type:'base64', media_type:aiPhoto.type, data:aiPhoto.b64 } });
  content.push({ type:'text', text:desc ? `Food description: ${desc}` : 'Estimate the protein, added sugar, fiber and saturated fat of the food in this photo.' });
  const r = await callClaude({ system:estimateSystem(), content, max_tokens:900 });
  btn.disabled = false;
  if (r.err) { st.textContent = aiErrText(r); return; }
  const raw = r.text.replace(/```json|```/g, '').trim();
  let parsed = null; try { parsed = JSON.parse(raw); } catch (e) { const a = raw.indexOf('{'), b = raw.lastIndexOf('}'); if (a >= 0 && b > a) { try { parsed = JSON.parse(raw.slice(a, b + 1)); } catch (e2) { parsed = null; } } }
  if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) { st.textContent = "Couldn't read that estimate — try rephrasing."; return; }
  if (parsed.is_food === false) { st.textContent = "That doesn't look like food — try again."; return; }
  if (Array.isArray(parsed.items) || parsed.totals) {                              // itemized: the totals are the sum of the rows, pantry foods use your own numbers
    const m = parseMealJSON(r.text);
    if (!m) { st.textContent = "Couldn't read that estimate — try rephrasing."; return; }
    if (m.is_food === false) { st.textContent = "That doesn't look like food — try again."; return; }
    if (!(m.protein_g > 0)) { st.textContent = "Couldn't estimate protein for that — add more detail."; return; }
    $('fLabel').value = m.meal_name; $('fProt').value = m.protein_g; $('fSugar').value = m.added_sugar_g; $('fFiber').value = m.fiber_g; $('fSat').value = m.sat_fat_g;
    const fromPantry = m.lines.filter(l => l.source === 'pantry').length;
    st.textContent = `Estimate (${m.confidence} confidence)${m.lines.length ? ` · ${fromPantry} of ${m.lines.length} from your pantry: ${m.lines.map(l => `${l.name} ${l.protein} g`).join(', ')}` : ''}. Check the numbers below, then tap Add.`;
    return;
  }
  const prot = round1(+parsed.grams_protein || 0);
  if (!(prot > 0)) { st.textContent = "Couldn't estimate protein for that — add more detail."; return; }
  $('fLabel').value = String(parsed.food || '').slice(0, 60);
  $('fProt').value = prot;
  $('fSugar').value = round1(Math.max(0, +parsed.added_sugar_g || 0));
  const fb = optNum(parsed.fiber_g), sf = optNum(parsed.sat_fat_g);   // null / missing stays blank = unknown, never 0
  $('fFiber').value = fb === undefined ? '' : fb; $('fSat').value = sf === undefined ? '' : sf;
  st.textContent = `Estimate (${parsed.confidence || 'medium'} confidence). Check the numbers below, then tap Add.`;
}

      <div class="small muted" style="margin-top:8px"><span class="lg"><i style="background:#1F5F3A"></i>full</span><span class="lg"><i style="background:#8DBE9C"></i>partial</span><span class="lg"><i style="background:#E8E8ED"></i>missed</span><span class="lg"><i style="background:#EEF3EF;box-shadow:inset 0 0 0 1px #d9e6dd"></i>paused</span></div>
      ${S.comeback && S.imported ? `<div class="small muted" style="margin-top:6px">Gap from ${fmtShort(S.comeback.from)}: ${S.comeback.gapDays} days. ${S.comeback.firstLog ? `You came back on ${fmtShort(S.comeback.firstLog)}.` : 'Your first log here counts as a comeback.'}</div>` : ''}
      ${histSel ? dayDetailHTML(histSel) : '<div class="small muted" style="margin-top:8px">Tap a day for details.</div>'}</div>

    <div class="card"><h3>Spending money (retired ${fmtShort(addDays(LEGACY_END, 1))})</h3>
      ${monthsList.map(m => { const x = moneyFor(m); return `<div style="padding:6px 0;border-top:1px solid var(--line)" class="small"><div style="display:flex;justify-content:space-between"><b>${monthName(m)}${x.closed ? '' : ' · so far'}</b><span class="num">${money(x.unlockedC)} of ${money(x.potC)}</span></div>
        <div class="muted">daily ${money(x.dripC)} · bonus ${money(x.poolC)} · spent ${money(x.spentC)}${x.closed ? ` · saved ${money(x.savingsC)}` : ''}</div></div>`; }).join('')}
      <div class="small muted" style="margin-top:8px">Final balance when it stopped: <b class="num">${money(moneyNow().balanceC)}</b>. Savings from closed months: <b class="num">${money(savingsTotalC())}</b>. Packs replace money in 3.0; this is just the record.</div></div>

    <div class="card"><h3>What was spent</h3>${spends.length ? spends.slice(0, 30).map(sp => `<div style="display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line)"><span><b>${esc(sp.cat)}</b> <span class="muted small">· ${fmtShort(sp.dk)}</span></span><span class="num">${money(sp.cents)}</span></div>`).join('') : '<p class="muted small">Nothing was spent.</p>'}</div>

    <div class="card"><h3>Pause trends</h3>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center"><div><div class="num" style="font-size:26px;font-weight:700;color:var(--acc)">${st.count}</div><div class="small muted">pauses</div></div><div><div class="num" style="font-size:26px;font-weight:700;color:var(--acc)">${st.avgLen == null ? '—' : st.avgLen}</div><div class="small muted">avg days</div></div><div><div class="num" style="font-size:26px;font-weight:700;color:var(--acc)">${rate}</div><div class="small muted">came back</div></div></div>
      ${st.reasons.length ? `<div class="q" style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:12px 0 4px">Days to come back, by reason</div>${st.reasons.map(r => `<div style="display:flex;justify-content:space-between;padding:3px 0" class="small"><span>${esc(r.why)} <span class="muted">×${r.n}</span></span><span class="num">${r.avgBack == null ? '—' : r.avgBack + ' days'}</span></div>`).join('')}
      <div class="q" style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:12px 0 4px">Pauses most</div>${st.habits.map(h => `<div style="display:flex;justify-content:space-between;padding:3px 0" class="small"><span>${HABIT_META[h.h].name}</span><span class="num">${h.n}</span></div>`).join('')}` : ''}
      <p class="small" style="margin:12px 0 0">${esc(st.note)}</p></div>

    <div class="card"><h3>Wind-down and lights-out</h3>
      ${wi.items.length ? wi.items.map(i => `<div style="display:flex;justify-content:space-between;padding:3px 0" class="small"><span>${esc(i.name)} <span class="muted">×${i.n}</span></span><span class="num">${i.early} of ${i.n} by 10:00</span></div>`).join('') : ''}
      <p class="small" style="margin:10px 0 0">${esc(wi.note)}</p></div>
  </div>`;
}
/* ── Backup / import: one JSON file with everything (never the AI key). Accepts 2.0 backups and v1 backups. ── */
function exportObject() {
  const o = JSON.parse(JSON.stringify(S));
  o.exportedAt = new Date().toISOString(); o.appVersion = APP_VERSION;
  return o;
}
async function exportData() {
  const date = todayKey(), name = `gleefulhabit3-backup-${date}.json`;
  const blob = new Blob([JSON.stringify(exportObject(), null, 2)], { type:'application/json' });
  try { localStorage.setItem('gh3_lastExport', todayKey()); } catch (e) {}
  try {
    const file = new File([blob], name, { type:'application/json' });
    if (navigator.canShare && navigator.canShare({ files:[file] })) { await navigator.share({ files:[file], title:'GleefulHabit 3.0 backup' }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function isV1Backup(o) { return !!(o && !o.schema && Array.isArray(o.habits) && o.user); }
/* Returns { ok, msg }. A 2.0 backup replaces everything; a v1 backup adds its history to what's here. */
function applyBackup(obj) {
  if (!obj || typeof obj !== 'object') return { ok:false, msg:'That file isn’t a GleefulHabit backup' };
  if (obj.schema === SCHEMA || obj.schema === 2) {                          // a 3.0 backup, or a 2.0 backup (same data plus the new parts, defaulted)
    const from2 = obj.schema === 2;
    delete obj.exportedAt; delete obj.appVersion;
    S = migrateState(obj); if (!S.startDate) S.startDate = todayKey();
    if (from2) S.ui.from2 = { at:Date.now(), days:Object.keys(S.days).length };
    save(); refresh(); return { ok:true, msg:from2 ? '2.0 backup restored' : 'Backup restored' };
  }
  if (isV1Backup(obj)) {
    const c = importV1(obj, S); S.ui.v1Offer = 'done'; save(); refresh();
    return { ok:true, msg:`v1 history added: ${c.workouts} workouts, ${c.foods} food entries, ${c.weights} weigh-ins` };
  }
  return { ok:false, msg:'That file isn’t a GleefulHabit backup' };
}
function onImportFile(ev) {
  const f = ev.target.files && ev.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    let obj = null; try { obj = JSON.parse(r.result); } catch (e) {}
    const v1 = isV1Backup(obj);
    if (obj && !confirm(v1 ? 'Add this v1 backup’s history to 3.0? Days from today on are skipped.' : 'Replace everything on this device with this backup?')) { ev.target.value = ''; return; }
    const res = applyBackup(obj); toast(res.msg); ev.target.value = '';
  };
  r.readAsText(f);
}
function backupHTML() {
  const v1here = !!readV1() && !S.imported;
  return `<div class="card"><h3>Backup</h3>
    <p class="small muted" style="margin:0 0 8px">One file with every log, pause, win, sleep night, workout and weight. 2.0 backups import here too. The AI key is never included. iOS can clear app data, so export now and then.</p>
    <div class="row2"><button class="btn primary" style="margin:0" onclick="exportData()">Export</button>
      <label class="btn" style="margin:0">Import<input type="file" id="impFile" accept=".json,application/json" style="display:none" onchange="onImportFile(event)"></label></div>
    ${v1here ? `<button class="btn quiet" style="margin-top:10px" onclick="bringV1()">Bring over my v1 history</button>` : ''}
    <p class="small muted" style="margin:10px 0 0">GleefulHabit 3.0 · version ${APP_VERSION}${S.ui.from2 ? ' · copied from 2.0 on ' + new Date(S.ui.from2.at).toLocaleDateString('en-US', { month:'short', day:'numeric' }) : ''}</p></div>`;
}
function bringV1() {
  if (!confirm('Add your v1 history (weight, protein, workouts, wins) to 3.0? v1 itself is not changed.')) return;
  const c = doV1Import(); refresh(); toast(`Added ${c.workouts} workouts, ${c.foods} food entries, ${c.weights} weigh-ins`);
}
/* First launch with v1 data on this phone: offer to bring the history over (money always starts fresh). */
function maybeOfferV1() {
  if (S.ui.v1Offer !== 'pending') return;
  const sum = v1Summary(readV1());
  if (!sum || (!sum.days && !sum.weights)) { skipV1Import(); return; }
  SH = { kind:'v1' };
  openSheet(`<h2>Welcome to 3.0</h2>
    <p class="hint">I found your v1 data on this phone: ${sum.days} logged days${sum.weights ? ` and ${sum.weights} weigh-ins` : ''}. Want that history here?</p>
    <p class="small muted" style="margin:0 0 4px">Workouts, protein entries, weight and wins come over. XP, packs and points stay behind. Your v1 app is not touched.</p>
    <button class="btn primary" onclick="v1Yes()">Bring my history</button>
    <button class="btn quiet" onclick="v1No()">Start fresh</button>`);
}
function v1Yes() { const c = doV1Import(); closeSheet(); refresh(); toast(`Added ${c.workouts} workouts, ${c.foods} food entries, ${c.weights} weigh-ins`); }
function v1No() { skipV1Import(); closeSheet(); toast('Starting fresh'); }

/* ── Start ── */
applyTheme();
closeMonths();
render();
if (S.ui.lastVersion && S.ui.lastVersion !== APP_VERSION) setTimeout(() => toast('Updated to the latest version'), 600);
S.ui.lastVersion = APP_VERSION; save();
maybeOfferV1();
</script>
</body>
</html>
