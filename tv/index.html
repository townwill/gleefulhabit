<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Pixel TV">
<meta name="theme-color" content="#0b0a0f">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
<title>Pixel TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
:root{
  --room:#0b0a0f; --plastic:#cdc4ae; --plastic2:#a39a85; --plastic3:#6f685a;
  --phosphor:#7dffa0; --amber:#ffc15e; --ink:#e8e2d0; --btn:#2b2934; --btn-edge:#121117;
  --mono:"VT323",ui-monospace,Menlo,monospace; --px:"Press Start 2P","VT323",monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--room);color:var(--ink);font-family:var(--mono);overscroll-behavior:none}
body{min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:max(10px,env(safe-area-inset-top)) 10px max(14px,env(safe-area-inset-bottom));
  background:radial-gradient(ellipse at 50% 30%,#1b1826 0%,#0b0a0f 70%)}
.tv{width:min(100%,calc((100dvh - 190px) * 1.3333 + 40px),720px);margin:0 auto}
.cab{background:linear-gradient(160deg,var(--plastic) 0%,var(--plastic2) 60%,var(--plastic3) 100%);border-radius:26px;padding:16px 16px 10px;
  box-shadow:0 18px 40px rgba(0,0,0,.65),inset 0 2px 0 rgba(255,255,255,.35),inset 0 -6px 12px rgba(0,0,0,.35)}
.screen{position:relative;width:100%;aspect-ratio:4/3;background:#000;border-radius:9% / 11%;overflow:hidden;
  box-shadow:inset 0 0 0 3px #000,inset 0 0 50px 8px #000,0 0 0 4px #22201a,0 0 0 6px rgba(255,255,255,.18);isolation:isolate}
#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;
  filter:contrast(1.1) saturate(1.2) brightness(1.04) blur(.35px);animation:flick 5s steps(1) infinite}
#noise{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;opacity:0;pointer-events:none;mix-blend-mode:screen}
.fx{position:absolute;inset:0;pointer-events:none}
.scan{background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.30) 3px,rgba(0,0,0,0) 4px);mix-blend-mode:multiply}
.mask{background:repeating-linear-gradient(to right,rgba(255,0,0,.05) 0,rgba(255,0,0,.05) 1px,rgba(0,255,0,.05) 1px,rgba(0,255,0,.05) 2px,rgba(0,0,255,.05) 2px,rgba(0,0,255,.05) 3px)}
.vig{background:radial-gradient(ellipse at center,rgba(0,0,0,0) 52%,rgba(0,0,0,.62) 100%)}
.glare{background:linear-gradient(128deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,0) 28%),radial-gradient(ellipse at 22% 10%,rgba(255,255,255,.10),rgba(255,255,255,0) 40%)}
.roll{background:linear-gradient(to bottom,rgba(255,255,255,0),rgba(255,255,255,.045) 50%,rgba(255,255,255,0));height:22%;top:-25%;bottom:auto;animation:roll 7.5s linear infinite}
@keyframes roll{to{top:110%}}
@keyframes flick{0%{opacity:1}7%{opacity:.965}8%{opacity:1}42%{opacity:.975}43%{opacity:1}77%{opacity:.97}78%{opacity:1}}
.screen.pwr-on{animation:crtOn .55s cubic-bezier(.2,.8,.2,1) both}
.screen.pwr-off{animation:crtOff .4s ease-in both}
@keyframes crtOn{0%{transform:scale(1,.004);filter:brightness(5)}45%{transform:scale(1,.01);filter:brightness(4)}100%{transform:scale(1,1);filter:brightness(1)}}
@keyframes crtOff{0%{transform:scale(1,1);filter:brightness(1)}60%{transform:scale(1,.006);filter:brightness(4)}100%{transform:scale(0,.004);filter:brightness(6)}}
.osd{position:absolute;top:5.5%;right:7%;font:clamp(22px,6.6vw,44px)/1 var(--mono);color:var(--phosphor);text-shadow:0 0 8px rgba(125,255,160,.8),2px 2px 0 #012;letter-spacing:.06em;opacity:0;transition:opacity .25s;text-align:right}
.osd.show{opacity:1}
.cap{position:absolute;top:5.5%;left:7%;font:clamp(15px,4.2vw,26px)/1.1 var(--mono);color:#fff;text-shadow:0 0 6px rgba(255,255,255,.5),2px 2px 0 #000;letter-spacing:.08em;opacity:0;transition:opacity .35s}
.cap.show{opacity:.95}
.sub{position:absolute;left:3%;right:3%;bottom:3.5%;text-align:center;font:clamp(15px,4.5vw,29px)/1.02 var(--mono);color:#fff;pointer-events:none}
.sub span.line{display:inline-block;background:rgba(0,0,0,.55);padding:1px 8px 2px;border-radius:2px;text-shadow:0 0 6px rgba(160,255,210,.55),2px 2px 0 #000}
.sub b{font-weight:400;letter-spacing:.05em;margin-right:.35em}
.offmsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:10%;font:clamp(18px,5vw,30px)/1.3 var(--mono);color:#4b5b4f;letter-spacing:.1em;background:#050606;z-index:3}
.offmsg.hide{display:none}
.brandbar{display:flex;align-items:center;justify-content:space-between;padding:10px 6px 2px;font:clamp(13px,3.4vw,18px) var(--mono);color:#40392c;letter-spacing:.18em}
.led{width:9px;height:9px;border-radius:50%;background:#401010;box-shadow:inset 0 0 2px #000;display:inline-block;margin-right:8px;vertical-align:middle}
.led.on{background:#ff4a2a;box-shadow:0 0 8px #ff4a2a}
.knobs{display:flex;gap:8px}.knobs i{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#8a8372,#35302a);box-shadow:0 2px 3px rgba(0,0,0,.5)}
.remote{margin-top:14px;display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.remote button,.gbtn{font:inherit;font-size:clamp(19px,5vw,26px);letter-spacing:.06em;color:var(--ink);background:var(--btn);border:0;border-bottom:5px solid var(--btn-edge);border-radius:13px;min-height:54px;padding:6px 4px;cursor:pointer;touch-action:manipulation;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.remote button:active,.gbtn:active{transform:translateY(3px);border-bottom-width:2px}
.remote .pwr{background:#8e2323;grid-column:span 1}
.remote .wide{grid-column:span 2}
.remote button.lit{color:var(--phosphor);text-shadow:0 0 8px rgba(125,255,160,.7)}
.ver{margin:14px 0 0;text-align:center;font-size:17px;color:#5d5870;letter-spacing:.08em}

/* ---------- TV guide ---------- */
.guide{position:fixed;inset:0;z-index:20;background:#030804;color:var(--phosphor);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:max(16px,env(safe-area-inset-top)) 16px 40px}
.guide[hidden]{display:none}
.gin{max-width:640px;margin:0 auto}
.guide h1{font:400 clamp(26px,7vw,40px)/1 var(--px);margin:6px 0 4px;color:var(--amber);text-shadow:0 0 10px rgba(255,193,94,.5);letter-spacing:.02em}
.guide h2{font:400 clamp(24px,6vw,32px)/1 var(--mono);margin:22px 0 8px;color:var(--amber);letter-spacing:.1em;border-bottom:2px dashed rgba(125,255,160,.3);padding-bottom:4px}
.guide p,.guide label{font-size:clamp(19px,4.8vw,23px);line-height:1.15;margin:6px 0;color:#a8d8b4}
.guide .dim{color:#5f8a6b}
.row{display:flex;gap:10px;align-items:center;padding:10px 12px;margin:8px 0;border:2px solid rgba(125,255,160,.35);border-radius:6px;background:rgba(125,255,160,.05);cursor:pointer;font-size:clamp(20px,5.2vw,26px)}
.row:active{background:rgba(125,255,160,.18)}
.row .n{color:var(--amber);min-width:3.2ch}.row .t{flex:1}.row .s{color:#5f8a6b;font-size:.8em}
.row.soon{opacity:.55;cursor:default}
.guide input,.guide textarea,.guide select{width:100%;font:inherit;font-size:22px;color:var(--phosphor);background:#02080a;border:2px solid rgba(125,255,160,.4);border-radius:6px;padding:8px 10px;margin:4px 0}
.guide textarea{min-height:70px;resize:vertical}
.guide .gbtn{width:100%;margin:8px 0;color:#04140a;background:var(--phosphor);border-bottom-color:#2b8f4b}
.guide .gbtn.alt{background:var(--btn);color:var(--ink);border-bottom-color:var(--btn-edge)}
.guide details{margin-top:18px;border:2px dashed rgba(125,255,160,.3);border-radius:6px;padding:6px 12px}
.guide summary{font-size:24px;cursor:pointer;color:var(--amber);padding:6px 0}
.status{min-height:1.2em;color:var(--amber)!important}
.status.err{color:#ff8a7a!important}
.updatebar{position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:40;display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit;background:var(--amber);color:#2a1a00;border:0;border-radius:12px;padding:10px;font-size:22px;box-shadow:0 6px 20px rgba(0,0,0,.6)}
.updatebar b{font-weight:400;font-size:26px}
</style>
</head>
<body>
<div class="tv">
  <div class="cab">
    <div class="screen" id="screen">
      <canvas id="cv" width="320" height="240"></canvas>
      <canvas id="noise" width="107" height="80"></canvas>
      <div class="fx mask"></div><div class="fx scan"></div><div class="fx roll"></div><div class="fx vig"></div><div class="fx glare"></div>
      <div class="osd" id="osd"></div>
      <div class="cap" id="cap"></div>
      <div class="sub" id="sub"></div>
      <div class="offmsg" id="offmsg">TAP ⏻ TO POWER ON</div>
    </div>
    <div class="brandbar"><span><i class="led" id="led"></i>TELEVISTA&nbsp;13</span><span class="knobs"><i></i><i></i></span></div>
  </div>
  <div class="remote">
    <button class="pwr" id="bPwr" aria-label="Power">⏻</button>
    <button id="bChDn" aria-label="Channel down">CH ▼</button>
    <button id="bChUp" aria-label="Channel up">CH ▲</button>
    <button id="bMute" aria-label="Sound">SND ON</button>
    <button id="bPlay" class="wide" aria-label="Pause or play">❚❚ PAUSE</button>
    <button id="bSkip" aria-label="Replay or next">⟲ RESTART</button>
    <button id="bGuide" aria-label="TV guide">GUIDE</button>
  </div>
  <p class="ver" id="ver"></p>
</div>
<div class="guide" id="guide" hidden><div class="gin" id="gin"></div></div>
<script>
'use strict';
/* =====================================================================
   PIXEL TV — a CRT that plays original, AI-written episodic shows.
   Single file, no build step. Sections:
     1. helpers   2. audio engine   3. speech   4. pixel renderer
     5. sets      6. show data      7. playback engine   8. writer/director (API)
     9. UI / guide   10. boot
   ===================================================================== */

/* ---------- 1. helpers ---------- */
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const lsGet = (k, d = null) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } };
const hash = s => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
const mf = m => 440 * Math.pow(2, (m - 69) / 12);
const estDur = (text, rate = 1) => 0.35 + (String(text).trim().split(/\s+/).length * 0.36) / clamp(rate, 0.5, 1.6);

/* ---------- 2. audio engine (everything is synthesized — no audio files) ---------- */
const AU = {
  ctx: null, muted: false, vol: 0.9, curMus: null,
  init() {
    if (this.ctx) return true;
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) { /* iOS 16.4+: ignore the silent switch */ }
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return false;
    try { this.setup(new C()); } catch (e) { return false; }
    return true;
  },
  setup(ctx) {
    this.ctx = ctx;
    this.comp = ctx.createDynamicsCompressor();
    this.comp.threshold.value = -16; this.comp.ratio.value = 5; this.comp.attack.value = 0.004; this.comp.release.value = 0.2;
    this.master = ctx.createGain(); this.master.gain.value = this.muted ? 0 : this.vol;
    this.comp.connect(this.master); this.master.connect(ctx.destination);
    const bus = v => { const g = ctx.createGain(); g.gain.value = v; g.connect(this.comp); return g; };
    this.musBus = bus(0.5); this.sfxBus = bus(0.85); this.lafBus = bus(1.6);
    const len = ctx.sampleRate * 2, b = ctx.createBuffer(1, len, ctx.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.noiseBuf = b;
  },
  resume() { try { if (this.ctx && this.ctx.state !== 'running' && this.ctx.resume) this.ctx.resume(); } catch (e) { } },
  suspend() { try { if (this.ctx && this.ctx.suspend && !this.offline) this.ctx.suspend(); } catch (e) { } },
  setMuted(m) {
    this.muted = m;
    if (this.master) this.master.gain.setTargetAtTime(m ? 0 : this.vol, this.ctx.currentTime, 0.02);
    if (m && window.speechSynthesis) try { speechSynthesis.cancel(); } catch (e) { }
  },
  now() { return this.ctx.currentTime + 0.03; },

  /* --- primitives --- */
  tone(bus, o) {
    const c = this.ctx, t = o.t, dur = o.dur, a = o.a == null ? 0.005 : o.a, r = o.r == null ? 0.05 : o.r, vol = o.vol == null ? 0.2 : o.vol;
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'square';
    osc.frequency.setValueAtTime(o.f, t);
    if (o.f2) osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.f2), t + dur);
    let node = osc;
    if (o.lp) {
      const fl = c.createBiquadFilter(); fl.type = 'lowpass'; fl.Q.value = o.q || 1;
      fl.frequency.setValueAtTime(o.lp, t);
      if (o.lp2) fl.frequency.exponentialRampToValueAtTime(o.lp2, t + dur);
      osc.connect(fl); node = fl;
    }
    node.connect(g); g.connect(bus);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur + r);
    osc.start(t); osc.stop(t + dur + r + 0.03);
  },
  noise(bus, o) {
    const c = this.ctx, t = o.t, dur = o.dur, a = o.a == null ? 0.003 : o.a;
    const s = c.createBufferSource(); s.buffer = this.noiseBuf; s.loop = true;
    const fl = c.createBiquadFilter(); fl.type = o.type || 'lowpass'; fl.Q.value = o.q || 1;
    fl.frequency.setValueAtTime(o.f || 1000, t);
    if (o.f2) fl.frequency.exponentialRampToValueAtTime(o.f2, t + dur);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(o.vol == null ? 0.2 : o.vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(fl); fl.connect(g); g.connect(bus);
    s.start(t, Math.random() * 1.5); s.stop(t + dur + 0.05);
  },

  /* --- instruments --- */
  slap(bus, t, m, dur, vol = 0.55) {
    const f = mf(m);
    this.tone(bus, { t, type: 'sawtooth', f, dur, vol, a: 0.004, r: 0.04, lp: 1900, lp2: 240, q: 3 });
    this.tone(bus, { t, type: 'triangle', f, dur: dur * 0.9, vol: vol * 0.8 });
    this.tone(bus, { t, type: 'square', f: f * 2, dur: 0.05, vol: vol * 0.3, a: 0.001, r: 0.02 });
    this.noise(bus, { t, dur: 0.025, vol: vol * 0.45, type: 'highpass', f: 3200 });
  },
  lead(bus, t, m, dur, vol = 0.14) {
    const f = mf(m);
    this.tone(bus, { t, type: 'square', f, dur, vol, a: 0.01, r: 0.06, lp: 3600 });
    this.tone(bus, { t, type: 'square', f: f * 1.005, dur, vol: vol * 0.5, a: 0.01, r: 0.06 });
  },
  stab(bus, t, ms, dur, vol = 0.07) { ms.forEach(m => this.tone(bus, { t, type: 'sawtooth', f: mf(m), dur, vol, a: 0.005, r: 0.05, lp: 2800, lp2: 800 })); },
  kick(bus, t, v = 0.7) { this.tone(bus, { t, type: 'sine', f: 150, f2: 45, dur: 0.14, vol: v, a: 0.002, r: 0.03 }); this.noise(bus, { t, dur: 0.02, vol: v * 0.3, type: 'lowpass', f: 900 }); },
  snare(bus, t, v = 0.4) { this.noise(bus, { t, dur: 0.13, vol: v, type: 'bandpass', f: 1900, q: 0.7 }); this.tone(bus, { t, type: 'triangle', f: 200, f2: 120, dur: 0.08, vol: v * 0.6, a: 0.002 }); },
  hat(bus, t, v = 0.12, open) { this.noise(bus, { t, dur: open ? 0.12 : 0.035, vol: v, type: 'highpass', f: 7500 }); },

  /* --- music --- */
  stopMusic() {
    const b = this.curMus; if (!b) return; this.curMus = null;
    try { b.gain.cancelScheduledValues(this.ctx.currentTime); b.gain.setTargetAtTime(0, this.ctx.currentTime, 0.06); } catch (e) { }
    setTimeout(() => { try { b.disconnect(); } catch (e) { } }, 700);
  },
  playMusic(name) {
    this.stopMusic();
    if (!this.ctx) return 9.2;
    const bus = this.ctx.createGain(); bus.connect(this.musBus); this.curMus = bus;
    const t0 = this.now() + 0.04;
    if (name === 'theme') return this.theme(bus, t0);
    if (name === 'outro') return this.outro(bus, t0);
    return 0;
  },
  theme(bus, t0) {
    const E = 60 / 126 / 2;                           // one eighth note
    const roots = [48, 45, 41, 43];                   // C  Am  F  G
    const chords = [[60, 64, 67], [57, 60, 64], [60, 65, 69], [59, 62, 67]];
    const bassPat = [[0, 0, 0.9], [1, 0, 0.45], [2, 12, 0.9], [3, 0, 0.45], [4, 7, 0.9], [5, 0, 0.45], [6, 10, 0.9], [7, 12, 0.45]];
    const mel = [
      [76, 0, 79, 0, 81, 79, 76, 0],
      [72, 0, 76, 0, 79, 76, 74, 0],
      [81, 0, 77, 0, 76, 77, 79, 0],
      [79, 0, 83, 0, 86, 83, 79, 0]];
    for (let bar = 0; bar < 4; bar++) {
      const b0 = t0 + bar * 8 * E;
      bassPat.forEach(([i, off, len]) => this.slap(bus, b0 + i * E, roots[bar] + off, len * E, 0.5));
      mel[bar].forEach((m, i) => { if (m) this.lead(bus, b0 + i * E, m, E * 1.7, 0.13); });
      [3, 7].forEach(i => this.stab(bus, b0 + i * E, chords[bar], E * 0.7, 0.06));
      for (let i = 0; i < 8; i++) {
        this.hat(bus, b0 + i * E, i % 2 ? 0.07 : 0.12);
        if (i === 0 || i === 4 || (i === 3 && bar % 2)) this.kick(bus, b0 + i * E);
        if (i === 2 || i === 6) this.snare(bus, b0 + i * E);
      }
    }
    const f0 = t0 + 32 * E;                           // final button
    this.slap(bus, f0, 48, 1.3, 0.6); this.lead(bus, f0, 84, 1.4, 0.15); this.lead(bus, f0, 76, 1.4, 0.1);
    this.stab(bus, f0, [60, 64, 67, 72], 1.1, 0.08); this.kick(bus, f0, 0.8); this.snare(bus, f0, 0.5);
    this.noise(bus, { t: f0, dur: 1.2, vol: 0.18, type: 'highpass', f: 5000 });
    return 32 * E + 1.6;
  },
  outro(bus, t0) {
    const E = 0.2;
    [[0, 48], [1, 48], [2, 55], [3, 53], [4, 52], [5, 50]].forEach(([i, m]) => this.slap(bus, t0 + i * E, m, 0.16));
    [[0, 76], [2, 79], [4, 81], [5, 79]].forEach(([i, m]) => this.lead(bus, t0 + i * E, m, 0.3));
    const f = t0 + 6 * E; this.slap(bus, f, 48, 1.0, 0.6); this.lead(bus, f, 84, 1.1); this.stab(bus, f, [60, 64, 67, 72], 0.9); this.kick(bus, f); this.snare(bus, f, 0.5);
    return 6 * E + 1.4;
  },
  /* one-shot stingers play on the sfx bus (don't interrupt the music bus) */
  sting(kind) {
    if (!this.ctx) return 1.2;
    const t = this.now(), b = this.sfxBus;
    if (kind === 'dramatic') {
      [[0, 48], [0.42, 47], [0.84, 43]].forEach(([o, m], i) => {
        this.tone(b, { t: t + o, type: 'sawtooth', f: mf(m - 12), dur: i === 2 ? 1.6 : 0.3, vol: 0.36, a: 0.004, r: 0.2, lp: 1400, lp2: 200 });
        this.tone(b, { t: t + o, type: 'square', f: mf(m), dur: i === 2 ? 1.2 : 0.25, vol: 0.14, lp: 2200 });
        this.tone(b, { t: t + o, type: 'sine', f: 110, f2: 40, dur: 0.3, vol: 0.45 });
        this.noise(b, { t: t + o, dur: 0.4, vol: 0.22, type: 'lowpass', f: 2500, f2: 300 });
      });
      return 2.4;
    }
    const riffs = [
      [[0, 48], [0.14, 48], [0.28, 55], [0.42, 53], [0.56, 48]],

  if (e.code === 'network') return 'Couldn’t reach Anthropic. Check your connection and try again.';
  if (e.status === 401) return 'Your API key was rejected. Check it in Settings.';
  if (e.status === 404) return `Model “${e.model}” isn’t available on your account. Pick another in Settings.`;
  if (/credit balance/i.test(e.detail || '')) return 'Your Anthropic account is out of credit. Add some at console.anthropic.com.';

}
const EMOTES = ['normal', 'happy', 'sad', 'angry', 'shock', 'deadpan', 'shout'], PROPS = ['phone', 'papers', 'envelope', 'mug', 'none'];
function sanitizeEpisode(raw, show) {

  const posOk = p => typeof p === 'number' || (typeof p === 'string' && (POS[p.toUpperCase()] != null || p === 'window'));
  const mapOf = (o, f) => { const r = {}; if (o && typeof o === 'object') Object.entries(o).slice(0, 5).forEach(([k, v]) => { const x = f(v); if (x !== undefined) r[String(k).toUpperCase()] = x; }); return r; };

    const out = { type: 'scene', set: SETS[sc.set] ? sc.set : 'apt', time: ['day', 'dusk', 'night'].includes(sc.time) ? sc.time : 'day', caption: String(sc.caption || '').slice(0, 24), cast: {}, beats: [] };
    Object.entries(sc.cast || {}).slice(0, 5).forEach(([n, o]) => { o = o && typeof o === 'object' ? o : {}; out.cast[String(n).toUpperCase()] = { x: posOk(o.x) ? o.x : 'C', pose: o.pose === 'sit' ? 'sit' : 'stand', face: o.face === -1 ? -1 : 1, prop: PROPS.includes(o.prop) ? o.prop : 'none' }; });

      if (b.say && b.line && strip(b.line)) { nb.say = String(b.say).toUpperCase().slice(0, 20); nb.line = strip(b.line); if (EMOTES.includes(b.emote)) nb.emote = b.emote; if (b.sing) nb.sing = true; if (b.hold != null) nb.hold = clamp(+b.hold || 0, 0, 3); }

      if (b.move && typeof b.move === 'object') nb.move = mapOf(b.move, v => posOk(v) ? v : undefined);
      if (b.pose && typeof b.pose === 'object') nb.pose = mapOf(b.pose, v => v === 'sit' ? 'sit' : 'stand');
      if (b.prop && typeof b.prop === 'object') nb.prop = mapOf(b.prop, v => PROPS.includes(v) ? v : 'none');
      if (b.react && typeof b.react === 'object') nb.react = mapOf(b.react, v => EMOTES.includes(v) ? v : undefined);
      if (b.act && typeof b.act === 'object' && ['poke', 'tally'].includes(b.act.do) && b.act.who) nb.act = { who: String(b.act.who).toUpperCase(), do: b.act.do, target: b.act.target ? String(b.act.target).toUpperCase() : undefined };

  let ep = null, lastErr = null;

  if (e.key === ' ') { e.preventDefault(); S.power ? togglePause() : power(true); }
  else if (e.key === 'ArrowUp') chStep(1); else if (e.key === 'ArrowDown') chStep(-1);
  else if (e.key === 'm') toggleMute(); else if (e.key === 'g') openGuide();
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') setPaused(true); else checkForUpdate(); });

/* ---------- update check (same pattern as the other apps in this repo) ---------- */
const APP_VERSION = '2026-10-08.1200';
let updateShown = false;
async function checkForUpdate() {
  if (updateShown || location.protocol === 'file:') return;
  try {
    const resp = await fetch(location.pathname + '?check=' + Date.now(), { cache: 'no-store' });
    if (!resp.ok) return;
    const m = (await resp.text()).match(/const APP_VERSION = '([^']+)'/);
    if (!m || m[1] <= APP_VERSION) return;
    updateShown = true;
    const bar = document.createElement('button');
    bar.className = 'updatebar'; bar.type = 'button';
    bar.innerHTML = `<b>New version ready</b><span>Tap to update to ${esc(m[1])}</span>`;
    bar.onclick = () => location.replace(location.pathname + '?v=' + encodeURIComponent(m[1]));
    document.body.appendChild(bar);
  } catch (e) { /* offline — try again next time */ }
}

/* ---------- 10. boot ---------- */
(function boot() {
  AU.muted = !!cfg().muted;
  $('ver').textContent = 'Pixel TV · version ' + APP_VERSION;
  const lastV = lsGet('tv_lastVersion'); if (lastV && lastV !== APP_VERSION) setTimeout(() => showOSD('UPDATED ' + APP_VERSION.slice(5, 10), 3000), 600);
  lsSet('tv_lastVersion', APP_VERSION);
  if (location.search.includes('v=')) history.replaceState(null, '', location.pathname);
  syncButtons();
  try { if (document.fonts) document.fonts.load('16px "Press Start 2P"'); } catch (e) { }
  S.last = performance.now(); requestAnimationFrame(frame);
  checkForUpdate();
  window.__TV = { S, AU, SP, SFX, SETS, PILOT, LOOKS, env, allEpisodes, sanitizeEpisode, parseJson, endTallyOf, playEpisode, tune, power, render, drawCard, drawPerson, generateEpisode, guestLook, getState };
})();
</script>
