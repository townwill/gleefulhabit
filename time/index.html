<title>Late for Yesterday</title>

<style>
/* Layout: a stainless dashboard console. Header = time display + speedometer; body = map of chapters or the puzzle bench. Single dark look on purpose. */
:root{
  --bg:#0e1013; --panel:#171a1f; --panel2:#1f242b; --line:#2c333c; --steel:#9aa4b0; --fg:#eceff3; --muted:#8b95a1;
  --amber:#ffb22e; --amber-dim:#3a2c12; --red:#ff4f3f; --red-dim:#3d1714; --green:#4cf08c; --green-dim:#123522; --cyan:#62e3ff;
  --display:"Bungee",Impact,"Arial Black",sans-serif; --body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"Share Tech Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:16px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
*{box-sizing:border-box}
button{font:inherit;color:var(--fg);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;touch-action:manipulation}
button:hover{border-color:var(--steel)}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
button.primary{background:var(--amber);color:#1d1404;border-color:var(--amber);font-weight:500}
.wrap{max-width:980px;margin:0 auto}
header.console{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding:16px 0 14px;border-bottom:1px solid var(--line);margin-bottom:18px}
.brand{display:flex;flex-direction:column;cursor:pointer;min-width:0}
.brand h1{font-family:var(--display);font-weight:400;font-size:clamp(22px,4.4vw,32px);line-height:1;margin:0;letter-spacing:.5px;color:var(--fg)}
.brand h1 span{color:var(--amber)}
.brand small{font-size:12px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-top:6px}
.gauges{display:flex;gap:10px;flex-wrap:wrap}
.readout{background:#07080a;border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-width:0}
.readout label{display:block;font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted)}
.readout b{font-family:var(--mono);font-weight:400;font-size:20px;letter-spacing:1px;font-variant-numeric:tabular-nums}
.readout.now b{color:var(--green);text-shadow:0 0 6px rgba(76,240,140,.35)}
.readout.mph b{color:var(--red);text-shadow:0 0 6px rgba(255,79,63,.35)}
.mphbar{height:4px;background:var(--red-dim);border-radius:2px;margin-top:4px;overflow:hidden}
.mphbar i{display:block;height:100%;background:var(--red);transition:width .6s}
/* map */
.hero{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;margin-bottom:22px}
.hero p{margin:0;color:var(--muted);max-width:56ch}
.hero .syncnote{font-size:12px;margin-top:6px;color:var(--muted)}
.hero>div{min-width:0}
.chap{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.chap h2{font-family:var(--display);font-weight:400;font-size:18px;margin:0;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;text-wrap:balance}
.chap h2 em{font-style:normal;font-family:var(--mono);font-size:14px;color:var(--green)}
.chap .meta{font-size:13px;color:var(--muted);margin:2px 0 12px}
.lv{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px}
@media (max-width:560px){.lv{grid-template-columns:repeat(5,minmax(0,1fr))}}
.lvb{flex-direction:column;justify-content:center;gap:1px;padding:7px 0 5px;min-width:0;border-radius:8px}
.lvb .n{font-family:var(--mono);font-size:16px;line-height:1}
.lvb .k{font-size:10px;color:var(--muted);letter-spacing:.5px}
.lvb .st{font-size:10px;color:var(--amber);letter-spacing:1px;min-height:12px;line-height:12px}
.lvb.done{background:#1b2a20;border-color:#2a4a34}
.lvb.next{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber) inset}
.lvb.locked{opacity:.35;cursor:not-allowed}
/* play */
.bench{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:820px){.bench{grid-template-columns:minmax(0,1fr)}}
.topbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.topbar .title{font-family:var(--display);font-size:16px;letter-spacing:.5px}
.topbar .sub{font-size:13px;color:var(--muted)}
.board{display:grid;width:max-content;max-width:100%;border:3px solid var(--steel);border-radius:4px;touch-action:none;user-select:none;-webkit-user-select:none;background:#000}
.fc{display:flex;align-items:center;justify-content:center;cursor:pointer;border:.5px solid rgba(0,0,0,.22);position:relative}
.fc.focus{box-shadow:inset 0 0 0 3px var(--amber)}
.fc svg{width:58%;height:58%;pointer-events:none}
.fc .x{pointer-events:none;font-weight:500;line-height:1}
.sc{display:flex;align-items:center;justify-content:center;cursor:pointer;background:#1a1e24;color:var(--cyan);font-family:var(--mono);border-right:1px solid #3b434e;border-bottom:1px solid #3b434e}
.sc.g{color:var(--fg);background:#262c34;font-weight:700;font-family:var(--body)}
.sc.hl{background:#212832}
.sc.same{background:#2b3a2f}
.sc.sel{background:var(--amber-dim);box-shadow:inset 0 0 0 2px var(--amber)}
.sc.bad{color:#fff;background:var(--red)}
.sc.focus{box-shadow:inset 0 0 0 3px var(--amber)}
.sc.bR{border-right:3px solid #c9d1db}.sc.bB{border-bottom:3px solid #c9d1db}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.pad{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-top:12px;max-width:100%}
.pad button{justify-content:center;font-family:var(--mono);font-size:20px;padding:10px 0}
.toggle{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.bubble{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;gap:12px;align-items:flex-start}
.av{width:44px;height:44px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:16px}
.bubble .who{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);margin:0}
.bubble .say{margin:4px 0 0;font-size:16px;line-height:1.55;text-wrap:pretty}
.bubble .why{margin:8px 0 0;font-size:14px;line-height:1.55;color:var(--muted)}
.bubble .why b{color:var(--amber);font-weight:500}
.rules{font-size:13px;color:var(--muted);line-height:1.6;background:transparent;border:1px dashed var(--line);border-radius:12px;padding:12px 14px}
.rules b{color:var(--fg);font-weight:500}
.clock{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.clock .readout{padding:4px 10px}
.clock .readout b{font-size:18px;color:var(--amber)}
.clock .readout.par b{color:var(--muted)}
.clock .readout.go b{color:var(--green)}
.card.fast{border-color:var(--green);box-shadow:0 0 0 1px var(--green),0 0 28px rgba(76,240,140,.25)}
.card .eyebrow.fast{color:var(--amber)}
.card .times{font-family:var(--mono);font-size:15px;color:var(--muted);margin:-4px 0 12px;font-variant-numeric:tabular-nums}
.card .times b{color:var(--fg);font-weight:400}
.card .times .nb{color:var(--green)}
.stat{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
/* modal */
.veil{position:fixed;inset:0;background:rgba(5,6,8,.78);display:flex;align-items:center;justify-content:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));z-index:30}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:460px;width:100%;padding:22px;animation:rise .35s ease-out}
.card .eyebrow{font-family:var(--mono);color:var(--green);font-size:14px;letter-spacing:1px}
.card h3{font-family:var(--display);font-weight:400;font-size:24px;margin:6px 0 10px;text-wrap:balance}
.card p{margin:0 0 16px;line-height:1.6}
.card .bolts{font-size:26px;letter-spacing:6px;color:var(--amber);margin:-4px 0 12px}
.card .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.flash{position:fixed;inset:0;background:#fff;pointer-events:none;z-index:40;animation:flash .7s ease-out forwards}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.22)}100%{transform:scale(1)}}
.shake{animation:shake .45s}.pop{animation:pop .35s ease-out}.cshake{animation:shake .35s}
@media (prefers-reduced-motion:reduce){.shake,.pop,.cshake,.card,.flash{animation:none!important}.flash{display:none}}
</style>

t":"s","p":"620000530001060050103000000030000200","s":"621345534621462153153462216534345216"},{"t":"f","n":9,"r":["CCBBBBBDA","CCCBBBBDD","CECBBBDDD","EEEEEBDBD","EEEEEBBBD","EEFEEEBBG","EHFFEEGGG","HHHHEEGGG","IIHHHHGGG"],"s":[8,5,0,6,4,2,7,3,1]},{"t":"f","n":9,"r":["CCCCCCAAB","CCCCCCCBB","CCCCCDDDD","FGGEEDDDD","FGGGEEEDD","FFGGGGDDD","FFFGDDDDD","HFIGGDDDD","HFIGGDDDD"],"s":[6,8,4,7,5,1,3,0,2]},{"t":"s","p":"000310600050200100030000050002420000","s":"542316613254265143134625351462426531"},{"t":"f","n":9,"r":["BBBBCCCAA","BBCCCCCAC","DBBCCCCCC","DDCCCCCCC","EEEGCCCCC","EEGGCCCFC","EEGGGGFFF","EGGGGGHHF","GGIIHHHHF"],"s":[8,1,5,0,2,7,4,6,3]},{"t":"f","n":9,"r":["BDCCCAAAA","BDCCCCCCA","BDCCCCAAA","FDCGGCEEE","FCCGGGEGE","FFFFGGGGG","FFHHHHGGG","FFFHGHHGG","HHHHGGGGI"],"s":[5,0,4,1,6,2,7,3,8]},{"t":"f","n":10,"r":["CAAAAABBBB","CCAADADBBB","CCCDDDDDBB","CCCCDDDDDB","EECCDDDDBB","EECGGFHBBB","EGCGGHHBHB","GGGGGHHHHH","GGGGGHHHIH","JGGGGHHHII"],"s":[4,9,2,7,1,5,3,6,8,0]},{"t":"s","p":"500014200000000005300000003102004600","s":"536214241536412365365421653142124653"},{"t":"f","n":10,"r":["AAEEEEDDDD","ACCCEBBDDD","ACEEEFDDDD","AAAEEFDFDD","JJEEFFFFGG","JHHHHFGGGG","JJHHHFGGGG","JJHHHHHHHG","JHHHHHHHHI","JJJHHHHIII"],"s":[0,6,1,8,3,5,7,4,9,2]},{"t":"f","n":10,"r":["BBCCCCCAAA","BBDDDCCCAA","DBDDDDCFFF","DDDDDDDDDF","DEEDDDDDDF","EEEEDDDDFF","EEEEGGGFFH","IEEGGGGFFH","IIIGGGGGJH","IIIGGJJJJH"],"s":[7,0,6,3,1,8,4,9,2,5]},{"t":"s","p":"054000000105060000000301600002000500","s":"154623236145361254542361615432423516"},{"t":"f","n":10,"r":["CCCCCCCCCA","CBBBCCCCCA","CBBDDDCCCC","BBBDDDDECH","BGDDDDDEHH","FGDDDDDEHH","FGGDDDJJHH","FGGJJDJJHH","IIGJJDJHHH","IIJJJJJHHH"],"s":[9,3,6,4,7,0,2,8,1,5]},{"t":"f","n":10,"r":["BAABBBBFFF","BBBBEEEEFF","CBBBEEEFFF","CCBBEEEDFH","IGGEEGEGFH","IGGGGGGGFH","IGGJJGGHHH","IGGIJJGGGH","IIIIJGGHGH","IIJJJJHHHH"],"s":[1,3,0,7,4,8,6,9,2,5]},{"t":"s","p":"002004500000000000010260020030030001","s":"162354543612256143314265421536635421"},{"t":"f","n":10,"r":["CCDDABBBBB","CCDDDDDGGB","CFDDDDGGGE","FFFDDDGGEE","FFFFHGGJEE","FFFFHGGJJJ","FFHHHGGGJJ","FFHHHGGGJJ","HHHHIIGGJJ","HHHIIIJJJJ"],"s":[4,9,0,3,8,1,6,2,5,7]},{"t":"f","n":10,"r":["CCCCCCCAAA","DCDCBBBEEE","DCDDDDDEEE","DDDDFFDHEE","FFFFFFDHEE","FIIIJJDHEG","FFIJJJJHEG","FFIIJJHHHG","IIIIIJJHHH","IIIIIJJJHH"],"s":[7,4,1,3,8,0,9,6,2,5]},{"t":"s","p":"000000560000054000000051036100000006","s":"341562562314154623623451236145415236"},{"t":"f","n":10,"r":["AAAAACCCCD","BFFAECECDD","FFFFEEECCD","FFFFEEEDDD","FFIFFEEHHH","FFIFEEHHHH","IIIGEEHHHH","IIGGJEHHHH","IIIIJHHHHH","IIIIJJHHHH"],"s":[4,0,7,9,6,1,3,8,2,5]}],"story":{"chapters":[{"name":"The garage","place":"Maple Ridge","now":"SEP 12 1986","intro":"Maple Ridge, 1986. Riley Park skates up to Doc Halvorsen's garage at midnight. Inside sits the Gullwing: a stainless steel coupe with doors that open like wings, and a glowing gadget behind the seats called the flux coil. Tonight is its first test.","outro":"FLASH. The Gullwing vanishes in a trail of fire. Riley blinks, and the mall parking lot is a cornfield. The dashboard reads NOV 03 1956. The flux coil is dead, and Doc is 30 years away.","lines":[["doc","Riley, you came! Tonight the Gullwing makes its first jump, but the flux coil needs power cells. One per row, one per column, one per color, and no two can touch. Tap a square twice to place a bolt."],["riley","So every color gets exactly one bolt. Got it, Doc."],["doc","This is the timeline map. Every row, column, and 2x3 box needs the numbers 1 to 6, once each. If the map has holes, we could land anywhere!"],["doc","Excellent! The coil is humming at 12 percent. Keep going!"],["riley","Why does it have to hit 91 miles per hour, anyway?"],["doc","At 91 the flux coil folds time like a pancake. Don't ask me about the syrup."],["doc","Tip: if a color only fits in one row, cross out the rest of that row. You can drag to paint x's."],["riley","Doc, your dog just licked a power cell."],["doc","Newton will be fine. He's licked worse. The grids get bigger from here!"],["doc","Recalibrating the timeline map. Same rules, fewer clues."],["riley","There's a van parked across the street with its lights off."],["doc","Probably nothing. Probably. Keep wiring!"],["doc","The map says our first hop is one minute into the future. Small steps, Riley."],["riley","Coil's at 70 percent. The garage lights are flickering."],["doc","That's normal! That's... mostly normal."],["riley","Doc, the van guys are getting out. They look mad."],["doc","I may have borrowed a few parts from them. Quickly, Riley!"],["doc","Get in the Gullwing! Floor it across the mall parking lot!"],["riley","The map just reset itself! It says 1956?!"],["doc","Hit 91 and don't look back! Great galloping gigawatts!"]]},{"name":"Elm Street","place":"Maple Ridge","now":"NOV 03 1956","intro":"Maple Ridge, 1956. Milkshakes cost a dime and everybody waves. Riley has a dead time machine, a vest everyone thinks is a life jacket, and one hope: find the young Doc Halvorsen.","outro":"The lightning hits the water tower, races down the cable, and the Gullwing explodes back into time. On the other side, the real Doc is waiting with wild eyes. \"Riley! We have a problem with the future!\"","lines":[["riley","A farmer just chased me with a rake. He thinks I'm from outer space."],["riley","I need to find Doc. The young Doc. He lives on Elm Street in this year."],["ydoc","Who are you? How do you know about my flux coil sketches?"],["ydoc","A time machine?! Prove it. Help me wire these power cells."],["riley","Doc, the coil needs a huge jolt. Way bigger than a wall outlet."],["ydoc","We'd need a bolt of lightning to charge this thing! Where would we ever find one of those?"],["riley","Wait. This souvenir flyer says the water tower gets hit by lightning on Saturday at 9:17 PM!"],["ydoc","A water tower and a lightning bolt. Ha! Let's map it out."],["riley","Uh oh. That's Rex Grubb. He runs this whole school."],["rex","Hey, new kid. Nice life jacket. Expecting a flood?"],["riley","I just need to stay out of Grubb's way until Saturday."],["ydoc","I'm running a cable from the water tower to the street. Keep the cells coming."],["riley","My family photo is fading! I must have changed something."],["ydoc","You've bent the timeline! Every square on that map matters now."],["rex","Grubb's gang swiped the cable spool! Ha ha!"],["riley","Got the spool back. Grubb went headfirst into the bake sale table."],["ydoc","It's 9:10 PM. The storm is rolling in!"],["riley","The cable's connected! The Gullwing is at the starting line."],["ydoc","Final map check. One wrong number and you'll land in the dinosaur days."],["ydoc","Lightning in 30 seconds! Go, Riley, GO!"]]},{"name":"Skyline","place":"Maple Ridge","now":"JUN 21 2016","intro":"Maple Ridge, 2016. Cars cruise above the rooftops and pizza cooks itself in four seconds. Doc has bad news: someone in the future wants to rewrite the past.","outro":"Back home in 1986, Maple Ridge is all wrong: neon casinos everywhere and a giant sign reading GRUBB TOWERS. In Doc's mailbox is a yellowed note in Rex's handwriting: \"Buried the numbers in 1886. You'll never find 'em.\" Doc reaches for his cowboy hat.","lines":[["doc","Welcome to 2016! Flying cars, four-second pizza, and one terrible problem."],["riley","Is that a hover skateboard? I need one. I need one so bad."],["doc","Focus! Rex Grubb's grandson Rook has stolen my spare flux coil."],["riley","What does he want with a flux coil?"],["doc","He wants to send a printout of 60 years of lottery numbers back to old Rex in 1956!"],["rook","Hey, it's the kid from Grandpa's old yearbook! Catch me if you can!"],["riley","He's on a hover board! I'm borrowing this one from a little kid. Sorry, little kid!"],["doc","Hover boards run on power cells too. Keep them balanced!"],["riley","Rook's heading for the courthouse fountain!"],["doc","Hover boards don't work on water! Unless they have plenty of power."],["rook","You'll never catch me, slowpoke!"],["riley","Got the coil back! Rook is stuck in the fountain."],["doc","The timeline map just twitched. Something's still wrong."],["riley","Doc, somebody took the Gullwing for a joyride while we were gone."],["doc","It's back, and the seat is still warm. Who was driving it?"],["riley","There's a cane on the floor. And a lottery printout."],["doc","Old Rex! He borrowed the Gullwing and carried the numbers to the past himself!"],["riley","So the 1986 we go home to will be different?"],["doc","Check the map. If Rex got rich, the whole town is his."],["doc","There's only one way to find out. Set the dial for home!"]]},{"name":"Dry Gulch","place":"Maple Ridge territory","now":"AUG 09 1886","intro":"Maple Ridge territory, 1886. There's no town yet. Just a dusty saloon, a windmill, and half a railroad. Somewhere out here, Rex buried the lottery numbers that made him rich.","outro":"The train roars off the end of an unfinished bridge just as the Gullwing flashes away. The tin box sits in Riley's lap. They tear up the printout on the way home, but the dashboard blinks a warning: TIMELINE UNSTABLE. One last storm is coming.","lines":[["doc","1886! Yeehaw! ...Why is there no road?"],["riley","Doc, the fuel line cracked on landing. There's no gas station for 30 years!"],["doc","Then we'll find another way to hit 91. First, that printout."],["riley","The saloon owner says a stranger buried a tin box under the old windmill."],["ike","Name's Ike Grubb. You two are standing on my windmill."],["doc","Ike is Rex's great-great-grandpa. Same scowl."],["riley","Doc built a steam shovel out of a tea kettle. It needs power cells."],["riley","Found the tin box! It's full of... sand?"],["doc","Ike moved it. Of course he did."],["ike","Lookin' for this, partner? Meet me at high noon. Bring your fancy wagon."],["riley","A high noon showdown. Very normal. Totally fine."],["doc","I have a plan. It involves a steam train and a lot of math."],["riley","Doc, the train tops out at 50. We need 91!"],["doc","Not with my special logs! Each one burns hotter than the last. Wire the boosters!"],["ike","It's noon, kid. Draw!"],["riley","I drew a timeline map. Ike got so confused he dropped the box!"],["doc","Got the printout! Now to the train!"],["riley","The engine is pushing the Gullwing! 60... 70..."],["doc","Map check! If the dates are off we'll end up in the Ice Age!"],["riley","88... 90... 91!"]]},{"name":"The storm","place":"Maple Ridge","now":"SEP 12 1986","intro":"Maple Ridge, 1986, one last time. The casinos are gone, but the town keeps flickering like a bad TV signal. Thunder rolls over the water tower. Doc says the timeline has to be locked before it shakes apart.","outro":"The bolt strikes. The town settles. No casinos, no GRUBB TOWERS, just Maple Ridge on a rainy night. Riley's family photo is whole again. Doc tips his cowboy hat. \"Thanks, Riley. Same time tomorrow? Or yesterday?\" He grins, and the Gullwing vanishes in a flash of fire.","lines":[["doc","We're home, but the timeline is cracking like an egg."],["riley","The town keeps flickering. Houses, then casinos, then houses again!"],["doc","We have to lock the timeline in place. Every map must be perfect now."],["riley","Doc! Rook Grubb followed us from 2016!"],["rook","Grandpa says you ruined everything. I'm taking that coil!"],["doc","Don't let him near the Gullwing! Double the power cells!"],["riley","He's riding a hover board in the middle of a thunderstorm. Bold."],["doc","Lightning hits the water tower again at 9:17 PM. Same storm, 30 years later!"],["riley","We get one shot to charge up and lock the timeline."],["doc","Repairing the 1956 branch. Careful with every square."],["rook","Ha! I cut your cable!"],["riley","I've got both ends! Wire faster, Doc!"],["doc","Repairing the 2016 branch. Almost there."],["riley","Rook slipped into the fountain again. Some things never change."],["doc","9:15! The coil is screaming!"],["doc","Repairing the 1886 branch. The last crack!"],["riley","My family photo is coming back! Everyone's in it!"],["doc","One more power grid, and the timeline is whole!"],["doc","The final timeline map. Lock it in, Riley."],["doc","Lightning in 3... 2... hit 91, Riley!"]]}]}};

/* cloud save: one doc in Will's Firebase (apps/lfy/progress/save), so iPad, phone and computer share progress */
let cloud=null,syncState='local',pushT=null;
function mergeSaves(a,b){const out={done:{},best:{},seen:{},autoX:b.autoX!==undefined?b.autoX:a.autoX};
  for(const s of [a,b]){for(const k in (s.done||{}))out.done[k]=out.done[k]===undefined?s.done[k]:Math.min(out.done[k],s.done[k]);
    for(const k in (s.best||{}))out.best[k]=out.best[k]===undefined?s.best[k]:Math.min(out.best[k],s.best[k]);
    for(const k in (s.seen||{}))out.seen[k]=1}
  return out}
function cloudPush(){if(!cloud)return;clearTimeout(pushT);pushT=setTimeout(async()=>{try{await cloud.set({save:JSON.stringify(save),at:Date.now()});setSync('cloud')}catch(e){
  if(e&&e.code=='unavailable'){setTimeout(cloudPush,1500+Math.random()*1500)}else if(e&&(e.code=='invalid_argument'||e.code=='revoked'||e.code=='not_granted')){cloud=null;setSync('local')}}},600)}
async function cloudPull(){if(!cloud)return;try{const snap=await cloud.get();
  if(snap.exists){const d=snap.data();const remote=JSON.parse(d.save||'{}');const before=JSON.stringify(save);save=mergeSaves(save,remote);
    try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}
    if(JSON.stringify(mergeSaves(remote,{}))!==JSON.stringify(mergeSaves(save,{})))cloudPush();
    if(JSON.stringify(save)!==before)refreshAfterSync()}
  else if(Object.keys(save.done).length)cloudPush();
  setSync('cloud')}catch(e){if(!e||e.code!='unavailable'){cloud=null;setSync('local')}}}

/* ---------- timer ---------- */

const fmt=ms=>{const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function tStart(){const T=cur&&cur.t;if(!T||T.running||T.done)return;T.running=true;T.start=performance.now();$('#clkbox').classList.add('go')}

setInterval(()=>{if(cur&&cur.t){const c=$('#clk');if(c)c.textContent=fmt(tElapsed())}},250);
document.addEventListener('visibilitychange',()=>{const T=cur&&cur.t;if(!T||T.done)return;
  if(document.hidden&&T.running){T.acc+=performance.now()-T.start;T.running=false;T.paused=true}
  else if(!document.hidden&&T.paused){T.paused=false;T.running=true;T.start=performance.now()}});
const FAST=["Great galloping gigawatts, that was quick!","You beat the par! The flux coil can barely keep up!","Faster than a hover board going downhill!","Riley, you're a blur! I didn't even finish my coffee!","Record speed! Somebody check the speedometer!"];
/* ---------- level ---------- */
let cur=null;

function say(p,text,why,mode){const P=PEOPLE[p];$('#bub').innerHTML=avatar(p)+`<div style="min-width:0"><p class="who">${P[0]}</p><p class="say">${esc(text)}</p>${why?`<p class="why"><b>Why:</b> ${esc(why)}</p>`:''}</div>`}
function boardPx(n){const w=Math.min(window.innerWidth-32-6,n<=7?420:500);return Math.max(26,Math.floor(w/n))}
function win(){
  tStop();const ms=tElapsed(),par=PAR(cur.L)*1000,fast=cur.hints==0&&ms<=par;
  if(!save.best)save.best={};const oldBest=save.best[cur.i],newBest=oldBest===undefined||ms<oldBest;if(newBest)save.best[cur.i]=Math.round(ms);

/* ---------- flux cells ---------- */
function initFlux(){
  const L=cur.L,N=L.n,R=L.r,SOL=L.s;
  const st={qs:Array(N*N).fill(0),docX:new Set(),drag:null,solved:false};cur.st=st;
  const rc=i=>[Math.floor(i/N),i%N],reg=i=>R[Math.floor(i/N)][i%N];
  const blocks=(a,b)=>{const [r1,c1]=rc(a),[r2,c2]=rc(b);return r1==r2||c1==c2||reg(a)==reg(b)||(Math.abs(r1-r2)<=1&&Math.abs(c1-c2)<=1)};
  const bolts=()=>{const p=[];st.qs.forEach((v,i)=>v==2&&p.push(i));return p};
  const keys=[...new Set(R.join(''))].sort();
  const G=[];keys.forEach(k=>G.push({name:'the '+COLORS[k][2]+' circuit',kind:'circuit',cells:[...Array(N*N).keys()].filter(i=>reg(i)==k)}));
  for(let r=0;r<N;r++)G.push({name:'row '+(r+1),kind:'row',cells:[...Array(N).keys()].map(c=>r*N+c)});
  for(let c=0;c<N;c++)G.push({name:'column '+(c+1),kind:'column',cells:[...Array(N).keys()].map(r=>r*N+c)});
  $('#ctl').innerHTML=`<div class="controls"><button id="hb">Ask Doc</button><button id="rs">↺ Reset</button><label class="toggle"><input type="checkbox" id="ax" ${save.autoX?'checked':''}> Auto-X</label></div>`;
  $('#rules').innerHTML=`<b>Rules:</b> place ${N} bolts. One in every row, every column, and every color. Bolts can't touch, not even corners.<br><b>Controls:</b> tap once for x, twice for a bolt. Drag to paint x's. Start a drag on an x to erase.`;
  function deduce(){const p=bolts(),isOpen=i=>st.qs[i]!=2&&!st.docX.has(i)&&!p.some(b=>blocks(b,i));
    const todo=G.filter(g=>!g.cells.some(i=>st.qs[i]==2));
    for(const g of todo){const o=g.cells.filter(isOpen);if(o.length==1)return{type:'place',cells:o,focus:g.cells,msg:'Put a bolt in the last open spot of '+g.name+'.',why:'Every '+g.kind+' needs exactly one bolt, and every other square in '+g.name+' is already blocked. Only one spot is left, so the bolt has to go there.'}}
    for(const g of todo.filter(g=>g.kind=='circuit')){const o=g.cells.filter(isOpen);
      for(const [kind,f] of [['row',i=>rc(i)[0]],['column',i=>rc(i)[1]]]){const s=new Set(o.map(f));if(s.size==1){const line=[...s][0];
        const t=[...Array(N*N).keys()].filter(i=>f(i)==line&&reg(i)!=reg(o[0])&&isOpen(i));
        if(t.length)return{type:'x',cells:t,focus:o,msg:'I crossed out the rest of '+kind+' '+(line+1)+'.',why:'Every open spot left in '+g.name+' (outlined) sits in '+kind+' '+(line+1)+'. Its bolt has to land in that '+kind+', which uses up the '+kind+"'s only bolt. Nothing else in that "+kind+' can have one.'}}}}
    for(const g of todo.filter(g=>g.kind!='circuit')){const o=g.cells.filter(isOpen);const s=new Set(o.map(reg));if(o.length&&s.size==1){const k=[...s][0];
      const t=[...Array(N*N).keys()].filter(i=>reg(i)==k&&!g.cells.includes(i)&&isOpen(i));
      if(t.length)return{type:'x',cells:t,focus:o,msg:'I crossed out the rest of the '+COLORS[k][2]+' circuit.',why:'Every open spot left in '+g.name+' (outlined) is '+COLORS[k][2]+'. So '+g.name+"'s bolt is also the "+COLORS[k][2]+" circuit's bolt, and the rest of that circuit has to stay empty."}}}
    for(let i=0;i<N*N;i++){if(!isOpen(i))continue;for(const g of todo){if(g.cells.includes(i))continue;const b=g.cells.filter(isOpen);
      if(b.length&&b.every(j=>blocks(i,j)))return{type:'x',cells:[i],focus:b,msg:'I crossed out the square with the orange x.',why:'Imagine a bolt there. It would block every open spot left in '+g.name+' (outlined). That '+g.kind+' would have no room at all, so this square can never work.'}}}
    return null}
  function draw(changed){const bd=$('#bd'),px=boardPx(N);bd.style.gridTemplateColumns=`repeat(${N},${px}px)`;bd.innerHTML='';
    const p=bolts(),bad=new Set(),auto=save.autoX;
    for(let a=0;a<p.length;a++)for(let b=a+1;b<p.length;b++)if(blocks(p[a],p[b])){bad.add(p[a]);bad.add(p[b])}
    st.qs.forEach((v,i)=>{const [r,c]=rc(i),k=reg(i),d=document.createElement('div');d.className='fc';d.dataset.i=i;d.style.width=d.style.height=px+'px';d.style.background=COLORS[k][0];d.style.color=COLORS[k][1];
      if(c<N-1&&R[r][c+1]!==k)d.style.borderRight='3px solid #111';if(r<N-1&&R[r+1][c]!==k)d.style.borderBottom='3px solid #111';
      if(v==2){d.innerHTML=BOLT;if(bad.has(i)){d.style.background='#ff4f3f';d.style.color='#fff'}}
      else if(st.docX.has(i))d.innerHTML=`<span class="x" style="font-size:${px*.42}px;color:#c06a00">✕</span>`;
      else if(v==1)d.innerHTML=`<span class="x" style="font-size:${px*.34}px;opacity:.7">✕</span>`;
      else if(auto&&p.some(b=>blocks(b,i)))d.innerHTML=`<span class="x" style="font-size:${px*.26}px;opacity:.35">✕</span>`;
      if(cur.focus.has(i))d.classList.add('focus');
      if((i===changed&&v==2)||cur.pop.has(i))d.classList.add(bad.has(i)?'cshake':'pop');
      bd.appendChild(d)});
    statLine(p.length+' of '+N+' bolts placed');
    if(!st.solved&&p.length==N&&bad.size==0){st.solved=true;say('doc',['Coil charged! Beautiful wiring, Riley!','Ha! That\'s the stuff! Full power!','Ninety-one, here we come!'][cur.i%3]);win()}
    else if(p.length==N&&bad.size){say('doc','Short circuit! Check the red bolts.');shakeBoard()}
    else if(changed!==undefined&&st.qs[changed]==2&&bad.has(changed))say('doc','Zap! That bolt breaks a rule. It shares a row, column, or color with another bolt, or it touches one.');
  }
  const bd=$('#bd');
  const cellAt=e=>{const el=document.elementFromPoint(e.clientX,e.clientY);return el&&el.dataset&&el.dataset.i!==undefined&&bd.contains(el)?+el.dataset.i:-1};
  const isX=i=>st.qs[i]==1||st.docX.has(i);
  const paint=i=>{if(i<0||st.qs[i]==2)return;if(st.drag.mode=='x'){if(!isX(i))st.qs[i]=1}else{st.qs[i]=0;st.docX.delete(i)}};
  bd.addEventListener('pointerdown',e=>{if(st.solved)return;const i=cellAt(e);if(i<0)return;tStart();e.preventDefault();try{bd.setPointerCapture(e.pointerId)}catch(_){}
    st.drag={start:i,last:i,moved:false,mode:isX(i)?'clear':'x'}});
  bd.addEventListener('pointermove',e=>{if(!st.drag)return;const i=cellAt(e);if(i<0||i==st.drag.last)return;
    if(!st.drag.moved){st.drag.moved=true;cur.focus.clear();cur.pop.clear();paint(st.drag.start)}
    st.drag.last=i;paint(i);draw()});
  bd.addEventListener('pointerup',()=>{if(!st.drag)return;const d=st.drag;st.drag=null;
    if(!d.moved){const i=d.start;cur.focus.clear();cur.pop.clear();if(st.docX.has(i)){st.docX.delete(i);st.qs[i]=2}else st.qs[i]=(st.qs[i]+1)%3;draw(i)}});
  bd.addEventListener('pointercancel',()=>{st.drag=null});
  $('#hb').onclick=()=>{if(st.solved)return;tStart();cur.pop.clear();const p=bolts();cur.hints++;
    const wrong=p.find(i=>SOL[rc(i)[0]]!==rc(i)[1]);
    if(wrong!==undefined){cur.focus=new Set([wrong]);say('doc','That outlined bolt is a dead end. Pull it out first.','This puzzle has only one answer, and that bolt isn\'t part of it. Once it\'s gone, ask me again and I\'ll explain the next step.');draw();return}
    const h=deduce();if(!h){say('doc','Hmm, I\'m stumped too. Try Reset.');draw();return}
    cur.focus=new Set(h.focus);h.cells.forEach(i=>{cur.pop.add(i);if(h.type=='place')st.qs[i]=2;else st.docX.add(i)});say('doc',h.msg,h.why);draw()};
  $('#rs').onclick=()=>{if(st.solved)return;st.qs.fill(0);st.docX.clear();cur.focus.clear();cur.pop.clear();say(cur.story[0],cur.story[1]);draw()};
  $('#ax').onchange=e=>{save.autoX=e.target.checked;persist();draw()};
  cur.redraw=draw;draw();
}

/* ---------- timeline map (6x6 sudoku, 2x3 boxes) ---------- */
function initSud(){
  const L=cur.L,P=L.p.split('').map(Number),S=L.s.split('').map(Number);
  const st={v:P.slice(),given:P.map(x=>x>0),sel:-1,solved:false};cur.st=st;
  const box=i=>Math.floor(Math.floor(i/6)/2)*2+Math.floor((i%6)/3);
  const peers=i=>{const r=Math.floor(i/6),c=i%6,b=box(i);return [...Array(36).keys()].filter(j=>j!=i&&(Math.floor(j/6)==r||j%6==c||box(j)==b))};
  const PE=[...Array(36).keys()].map(peers);
  const units=[];for(let r=0;r<6;r++)units.push({name:'row '+(r+1),cells:[...Array(6).keys()].map(c=>r*6+c)});
  for(let c=0;c<6;c++)units.push({name:'column '+(c+1),cells:[...Array(6).keys()].map(r=>r*6+c)});
  for(let b=0;b<6;b++)units.push({name:'this box',cells:[...Array(36).keys()].filter(i=>box(i)==b)});
  const bad=i=>{const v=st.v[i];return v&&PE[i].some(j=>st.v[j]==v)};
  $('#ctl').innerHTML=`<div class="pad" id="pad">${[1,2,3,4,5,6].map(n=>`<button data-n="${n}">${n}</button>`).join('')}</div><div class="controls"><button id="hb">Ask Doc</button><button id="er">⌫ Erase</button><button id="rs">↺ Reset</button></div>`;
  $('#rules').innerHTML=`<b>Rules:</b> fill every square with 1 to 6. Each row, column, and 2x3 box uses every number exactly once.<br><b>Controls:</b> tap a square, then a number. On a keyboard, type 1 to 6 and use the arrow keys.`;
  function draw(changed){const bd=$('#bd'),px=Math.min(64,boardPx(6));bd.style.gridTemplateColumns=`repeat(6,${px}px)`;bd.innerHTML='';
    const sr=Math.floor(st.sel/6),scl=st.sel%6,sb=st.sel>=0?box(st.sel):-1,sv=st.sel>=0?st.v[st.sel]:0;
    st.v.forEach((v,i)=>{const r=Math.floor(i/6),c=i%6,d=document.createElement('div');d.className='sc'+(st.given[i]?' g':'');d.dataset.i=i;
      d.style.width=d.style.height=px+'px';d.style.fontSize=Math.round(px*.46)+'px';
      if(c==2)d.classList.add('bR');if(r==1||r==3)d.classList.add('bB');
      if(st.sel>=0&&i!=st.sel){if(sv&&v==sv)d.classList.add('same');else if(r==sr||c==scl||box(i)==sb)d.classList.add('hl')}
      if(i==st.sel)d.classList.add('sel');
      if(cur.focus.has(i))d.classList.add('focus');
      d.textContent=v||'';if(!st.given[i]&&bad(i))d.classList.add('bad');
      if((i===changed&&v)||cur.pop.has(i))d.classList.add(i===changed&&bad(i)?'cshake':'pop');
      d.onclick=()=>{if(st.solved)return;tStart();st.sel=i;cur.focus.clear();cur.pop.clear();draw()};bd.appendChild(d)});
    const filled=st.v.filter(x=>x).length;statLine(filled+' of 36 squares filled');
    const full=filled==36,ok=full&&st.v.every((v,i)=>!bad(i));
    if(!st.solved&&ok){st.solved=true;st.sel=-1;say('doc',['Timeline locked! The map is whole again.','Perfect! Not a single paradox.','Map repaired. History thanks you, Riley.'][cur.i%3]);win()}
    else if(full&&!ok){say('doc','Paradox detected! Fix the red squares.');shakeBoard()}
    else if(changed!==undefined&&bad(changed))say('doc','Paradox! That number already appears in this row, column, or box.');
  }
  function put(n){if(st.solved||st.sel<0||st.given[st.sel])return;tStart();st.v[st.sel]=n;cur.focus.clear();cur.pop.clear();draw(st.sel)}
  $('#pad').querySelectorAll('button').forEach(b=>b.onclick=()=>put(+b.dataset.n));
  $('#er').onclick=()=>put(0);
  $('#rs').onclick=()=>{if(st.solved)return;st.v=P.slice();st.sel=-1;cur.focus.clear();cur.pop.clear();say(cur.story[0],cur.story[1]);draw()};
  cur.key=e=>{if(st.solved)return;if(/^[0-9]$|^Arrow|^Backspace$|^Delete$/.test(e.key))tStart();if(e.key>='1'&&e.key<='6'){put(+e.key);e.preventDefault()}else if(e.key=='Backspace'||e.key=='Delete'||e.key=='0'){put(0);e.preventDefault()}
    else if(e.key.startsWith('Arrow')){let s=st.sel<0?0:st.sel;const r=Math.floor(s/6),c=s%6;
      if(e.key=='ArrowUp'&&r>0)s-=6;if(e.key=='ArrowDown'&&r<5)s+=6;if(e.key=='ArrowLeft'&&c>0)s--;if(e.key=='ArrowRight'&&c<5)s++;st.sel=s;draw();e.preventDefault()}};
  $('#hb').onclick=()=>{if(st.solved)return;tStart();cur.pop.clear();cur.hints++;
    const wrong=st.v.findIndex((v,i)=>!st.given[i]&&v&&v!=S[i]);
    if(wrong>=0){cur.focus=new Set([wrong]);st.sel=wrong;say('doc','That outlined '+st.v[wrong]+' doesn\'t belong there. Erase it first.','This map has only one answer, and that number isn\'t part of it, even if it doesn\'t clash with anything yet. Ask me again once it\'s gone.');draw();return}
    const cand=i=>[1,2,3,4,5,6].filter(n=>!PE[i].some(j=>st.v[j]==n));
    for(let i=0;i<36;i++){if(st.v[i])continue;const cs=cand(i);if(cs.length!=1)continue;
      const r=Math.floor(i/6),c=i%6,used={row:[],col:[],box:[]},seen=new Set();const src=[];
      for(const j of PE[i]){if(st.v[j]&&Math.floor(j/6)==r&&!seen.has(st.v[j])){seen.add(st.v[j]);used.row.push(st.v[j]);src.push(j)}}
      for(const j of PE[i]){if(st.v[j]&&j%6==c&&!seen.has(st.v[j])){seen.add(st.v[j]);used.col.push(st.v[j]);src.push(j)}}
      for(const j of PE[i]){if(st.v[j]&&box(j)==box(i)&&!seen.has(st.v[j])){seen.add(st.v[j]);used.box.push(st.v[j]);src.push(j)}}
      const parts=[];const fmt=a=>a.sort().join(', ');
      if(used.row.length)parts.push('Row '+(r+1)+' already has '+fmt(used.row));
      if(used.col.length)parts.push('column '+(c+1)+' adds '+fmt(used.col));
      if(used.box.length)parts.push('the box adds '+fmt(used.box));
      st.v[i]=cs[0];st.sel=i;cur.focus=new Set(src);cur.pop=new Set([i]);
      say('doc','Only a '+cs[0]+' fits in the highlighted square.',parts.join(', ')+'. The outlined squares rule out every number except '+cs[0]+'.');draw();return}
    for(const u of units)for(let n=1;n<=6;n++){if(u.cells.some(i=>st.v[i]==n))continue;const sp=u.cells.filter(i=>!st.v[i]&&cand(i).includes(n));
      if(sp.length==1){const i=sp[0];st.v[i]=n;st.sel=i;cur.focus=new Set(u.cells);cur.pop=new Set([i]);
        say('doc','In '+u.name+', the '+n+' can only go in one square.','Every other open square in '+u.name+' (outlined) already sees a '+n+' in its row, column, or box. So the '+n+' has nowhere else to go.');draw();return}}
    say('doc','Hmm, I\'m stumped too. Try Reset.');draw()};
  cur.redraw=draw;draw();
}
document.addEventListener('keydown',e=>{if(modal.innerHTML)return;if(cur&&cur.key)cur.key(e)});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(cur&&cur.redraw)cur.redraw()},120)});
showMap();
</script>

/* the artifact-style db the game expects, backed by Firestore under apps/<APP>/ */
function makeDb(F, fs) {
  const P = p => 'apps/' + APP + '/' + p;
  const err = e => ({ code: (e && e.code === 'permission-denied') ? 'revoked' : 'unavailable', message: String((e && e.message) || e) });
  const wrapDoc = s => { const ex = s.exists(); const d = ex ? s.data() : undefined; return { id: s.id, exists: ex, data: () => d, metadata: s.metadata }; };
  const wrapQuery = q => { const docs = q.docs.map(wrapDoc); return { docs, size: docs.length, empty: !docs.length, metadata: q.metadata,
    docChanges: () => q.docChanges().map(c => ({ type: c.type, doc: wrapDoc(c.doc), oldIndex: c.oldIndex, newIndex: c.newIndex })) }; };
  function docRef(path) {
    const r = F.doc(fs, P(path));
    return { id: r.id, path,
      get: () => F.getDoc(r).then(wrapDoc),
      set: data => F.setDoc(r, data),
      update: data => F.updateDoc(r, data),
      delete: () => F.deleteDoc(r),
      onSnapshot: (next, onErr) => F.onSnapshot(r, s => next(wrapDoc(s)), e => onErr && onErr(err(e))),
      collection: sub => colRef(path + '/' + sub) };
  }
  function query(base, cons) {
    const target = () => cons.length ? F.query(base, ...cons) : base;
    return {
      where: (f, op, v) => query(base, [...cons, F.where(f, op, v)]),
      orderBy: (f, d) => query(base, [...cons, F.orderBy(f, d || 'asc')]),
      limit: n => query(base, [...cons, F.limit(n)]),
      get: () => F.getDocs(target()).then(wrapQuery),
      onSnapshot: (next, onErr) => F.onSnapshot(target(), s => next(wrapQuery(s)), e => onErr && onErr(err(e))) };
  }
  function colRef(path) {
    const q = query(F.collection(fs, P(path)), []);
    q.path = path;
    q.doc = id => docRef(path + '/' + (id || (Date.now().toString(36) + Math.random().toString(36).slice(2, 10))));
    q.add = async data => { const d = q.doc(); await d.set(data); return d; };
    return q;
  }
  return { doc: docRef, collection: colRef };
}
