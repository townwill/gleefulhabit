<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Marquee">
<meta name="theme-color" content="#140e11">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<title>Marquee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://image.tmdb.org">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: a dark screening room. Sticky marquee header, poster wall (grid or shelves), bottom tab bar, bottom sheets for detail. */
:root{
  color-scheme:dark;
  --ground:#140e11;      /* house lights down */
  --surface:#1f171b;     /* seat-back */
  --surface2:#2a2025;
  --line:#3b2e34;
  --ink:#f4eadb;         /* projector-lit cream */
  --muted:#a9989c;
  --bulb:#f3b847;        /* marquee bulb */
  --bulb-ink:#2a1a00;
  --velvet:#d9445c;      /* favorites */
  --seen:#62c48f;
  --watch:#86b6ff;
  --shadow:0 10px 30px rgba(0,0,0,.45);
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --navh:62px;
}
*{box-sizing:border-box}
html,body{background:var(--ground);margin:0}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;padding-bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px) + 16px);min-height:100vh}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--bulb);outline-offset:2px}
img{max-width:100%;display:block}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tnum{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* ---------- header ---------- */
header.top{position:sticky;top:0;z-index:20;background:linear-gradient(var(--ground) 82%,rgba(20,14,17,0));padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 6px}
.brandrow{display:flex;align-items:center;gap:12px;max-width:1400px;margin:0 auto}
.brand{font-family:var(--display);font-weight:900;font-size:30px;letter-spacing:.06em;line-height:1;color:var(--bulb);text-transform:uppercase;position:relative;padding:4px 10px;border:2px solid var(--bulb);border-radius:6px;box-shadow:0 0 0 3px var(--ground),0 0 0 4px rgba(243,184,71,.35)}
.brand::after{content:"";position:absolute;inset:auto 0 -9px 0;height:8px;background-image:radial-gradient(circle,var(--bulb) 1.4px,transparent 1.8px);background-size:10px 8px;opacity:.9}
.stats{flex:1;min-width:0;color:var(--muted);font-size:12.5px;line-height:1.3}
.stats b{color:var(--ink);font-weight:700}
.stats .wide{display:none}
@media(min-width:560px){.stats .wide{display:inline}}
@media(max-width:420px){.brand{font-size:24px;padding:4px 8px}}
body.selecting{padding-bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px) + 80px)}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink);background:var(--surface)}
.iconbtn:hover{background:var(--surface2)}
.searchrow{max-width:1400px;margin:12px auto 0;display:flex;gap:8px}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:42px;color:var(--muted)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--ink);font-size:16px}
.search:focus-within{border-color:var(--bulb)}
.pickbtn{display:flex;align-items:center;gap:6px;background:var(--bulb);color:var(--bulb-ink);font-weight:700;border-radius:12px;padding:0 14px;height:42px;white-space:nowrap}
.pickbtn:hover{filter:brightness(1.06)}

/* ---------- toolbar chips ---------- */
.toolbar{max-width:1400px;margin:10px auto 0;display:flex;flex-direction:column;gap:8px}
.chiprow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;align-items:center}
.chiprow::-webkit-scrollbar{display:none}
.chiprow .lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-right:4px;flex:none}
.chip{flex:none;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.chip.on{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.chip.sm{padding:4px 10px;font-size:12.5px}
select.chip{appearance:none;-webkit-appearance:none;padding-right:26px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 14px) 52%,calc(100% - 9px) 52%;background-size:5px 5px;background-repeat:no-repeat}

/* ---------- main ---------- */
main{padding:6px 16px 0;max-width:1400px;margin:0 auto}
.banner{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--bulb);border-radius:12px;padding:12px 14px;margin:8px 0 14px}
.banner p{margin:0;flex:1;min-width:0;font-size:14px}
.banner b{color:var(--bulb)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;padding:9px 14px;font-weight:700;background:var(--surface2);border:1px solid var(--line);color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--bulb);color:var(--bulb-ink);border-color:var(--bulb)}
.btn.ghost{background:none}
.btn.danger{color:var(--velvet)}
.btn:disabled{opacity:.5;cursor:default}
.progress{margin:8px 0 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.progress .bar{height:6px;border-radius:6px;background:var(--surface2);overflow:hidden;margin-top:8px}
.progress .bar i{display:block;height:100%;background:var(--bulb);width:0;transition:width .3s}
.progress small{color:var(--muted)}

h2.sect{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:.02em;text-transform:uppercase;margin:18px 0 10px;line-height:1.05;text-wrap:balance}
.empty{color:var(--muted);text-align:center;padding:40px 16px;max-width:460px;margin:0 auto}
.empty h3{font-family:var(--display);font-size:26px;text-transform:uppercase;color:var(--ink);margin:0 0 6px}

/* poster grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:16px 12px}
@media(min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 16px}}
.tile{display:flex;flex-direction:column;gap:6px;text-align:left;min-width:0;position:relative}
.pz{position:relative;aspect-ratio:2/3;max-width:100%;border-radius:8px;overflow:hidden;background:var(--surface);box-shadow:0 4px 14px rgba(0,0,0,.4);transition:transform .15s}
.tile:hover .pz{transform:translateY(-2px)}
.pz img{width:100%;height:100%;object-fit:cover}
.pz.seen img{filter:saturate(.75) brightness(.92)}
.fake{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;font-family:var(--display);font-weight:800;font-size:19px;line-height:1.02;text-transform:uppercase;color:#fff8ec;letter-spacing:.01em;overflow:hidden;word-break:break-word}
.fake small{font-family:var(--body);font-weight:600;font-size:11px;opacity:.8;margin-top:4px;text-transform:none}
.cap{font-size:12.5px;line-height:1.25;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cap span{color:var(--muted);font-weight:500}
.badges{position:absolute;top:6px;right:6px;display:flex;flex-direction:column;gap:4px;pointer-events:none}
.bd{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:rgba(20,14,17,.82);backdrop-filter:blur(4px)}
.bd svg{width:14px;height:14px;stroke-width:2.6}
.bd.s{color:var(--seen)} .bd.f{color:var(--velvet)} .bd.f svg{fill:var(--velvet)} .bd.w{color:var(--watch)}
.selbox{position:absolute;top:6px;left:6px;width:26px;height:26px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.35);display:grid;place-items:center}
.tile.sel .selbox{background:var(--bulb);border-color:var(--bulb);color:var(--bulb-ink)}
.tile.sel .pz{outline:3px solid var(--bulb);outline-offset:-3px}
.selbox svg{width:15px;height:15px;stroke-width:3;opacity:0}
.tile.sel .selbox svg{opacity:1}

/* shelves */
.shelf{margin:4px 0 18px;content-visibility:auto;contain-intrinsic-size:auto 260px}
.shelfhead{display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;padding:6px 0 8px}
.shelfhead h3{margin:0;font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.02em;line-height:1.05;min-width:0}
.shelfhead span{color:var(--muted);font-size:12.5px;white-space:nowrap}
.shelfhead .more{margin-left:auto;color:var(--bulb);font-weight:700;font-size:13px;white-space:nowrap}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:108px;gap:12px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity;scrollbar-width:thin}
@media(min-width:700px){.rail{grid-auto-columns:140px;gap:16px}}
.rail .tile{scroll-snap-align:start}
.meter{height:3px;border-radius:3px;background:var(--surface2);overflow:hidden;width:60px;flex:none;align-self:center}
.meter i{display:block;height:100%;background:var(--seen)}

.backrow{display:flex;align-items:center;gap:10px;margin:10px 0 4px;flex-wrap:wrap}
.backrow h2{margin:0;flex:1;min-width:0}

/* list cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.lcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-align:left;display:flex;flex-direction:column}
.lcard:hover{border-color:var(--muted)}
.collage{display:grid;grid-template-columns:repeat(4,1fr);aspect-ratio:8/3;background:var(--surface2)}
.collage div{background-size:cover;background-position:center;border-right:1px solid var(--ground)}
.lcard .lb{padding:10px 12px 12px}
.lcard .k{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.lcard .n{font-weight:700;font-size:15px;line-height:1.25;margin-top:2px}
.lcard .c{color:var(--muted);font-size:12.5px}
.lcard.new{align-items:center;justify-content:center;min-height:140px;border-style:dashed;color:var(--muted);font-weight:700;gap:6px}

/* ---------- bottom nav ---------- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(20,14,17,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{display:grid;grid-template-columns:repeat(4,1fr);max-width:640px;margin:0 auto;height:var(--navh)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11px;font-weight:600}
nav.tabs button.on{color:var(--bulb)}
nav.tabs .cnt{font-size:10px;opacity:.8}

/* select bar */
.selbar{position:fixed;left:0;right:0;bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px));z-index:31;background:var(--surface2);border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;align-items:center;overflow-x:auto}
.selbar b{white-space:nowrap;margin-right:4px}
.selbar .btn{padding:8px 12px}

/* ---------- sheets ---------- */
.ov{position:fixed;inset:0;z-index:50;background:rgba(8,5,7,.66);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
@media(min-width:760px){.ov{align-items:center;padding:24px}}
.sheet{background:var(--surface);width:100%;max-width:720px;max-height:94vh;overflow:auto;overscroll-behavior:contain;border-radius:18px 18px 0 0;box-shadow:var(--shadow);animation:rise .22s ease-out;padding-bottom:env(safe-area-inset-bottom,0px)}
@media(min-width:760px){.sheet{border-radius:18px;max-height:90vh}}
.sheet.narrow{max-width:520px}
@keyframes rise{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){.ov,.sheet{animation:none}.pz{transition:none}}
.sh-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.sh-head h3{margin:0;flex:1;min-width:0;font-family:var(--display);font-weight:800;font-size:24px;text-transform:uppercase;letter-spacing:.02em;line-height:1.05}
.sh-body{padding:16px}
.x{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);color:var(--ink);flex:none}

/* detail */
.hero{position:relative;min-height:200px;background:var(--surface2) center/cover no-repeat}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(31,23,27,.15) 0%,rgba(31,23,27,.55) 55%,var(--surface) 100%)}
.hero .x{position:absolute;top:12px;right:12px;z-index:2;background:rgba(20,14,17,.7)}
.dtop{display:flex;gap:16px;padding:0 16px;margin-top:-96px;position:relative;z-index:1;align-items:flex-end}
.dtop .pz{width:118px;flex:none}
@media(min-width:600px){.dtop .pz{width:150px}}
.dtitle{min-width:0;padding-bottom:4px}
.dtitle h2{margin:0;font-family:var(--display);font-weight:900;font-size:34px;line-height:.98;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.dtitle .meta{color:var(--muted);font-size:13.5px;margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 10px}
.cert{border:1px solid var(--muted);border-radius:4px;padding:0 5px;font-size:11.5px;font-weight:700;color:var(--ink)}
.tagline{font-style:italic;color:var(--bulb);margin:14px 0 0}
.overview{margin:10px 0 0;max-width:65ch}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.act{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--muted)}
.act svg{width:22px;height:22px}
.act.on.s{color:var(--seen);border-color:var(--seen)}
.act.on.f{color:var(--velvet);border-color:var(--velvet)} .act.on.f svg{fill:var(--velvet)}
.act.on.w{color:var(--watch);border-color:var(--watch)}
.act small{font-weight:500;font-size:11px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin-top:16px;font-size:14px}
.kv dt{color:var(--muted);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;padding-top:2px}
.kv dd{margin:0;min-width:0}
.lbl2{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:20px 0 8px;display:flex;align-items:center;gap:8px}
.wrapchips{display:flex;flex-wrap:wrap;gap:6px}
.tog{padding:6px 12px;border-radius:999px;border:1px dashed var(--line);font-size:13.5px;font-weight:600;color:var(--muted)}
.tog.on{border-style:solid;border-color:var(--bulb);color:var(--bulb);background:rgba(243,184,71,.08)}
.franchise{display:flex;align-items:center;gap:12px;width:100%;margin-top:16px;padding:12px 14px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);text-align:left}
.franchise b{display:block}
.franchise small{color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.links a{color:var(--muted);font-size:13px}

/* rows (search results, check list) */
.row{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .th{width:46px;flex:none;aspect-ratio:2/3;border-radius:5px;overflow:hidden;background:var(--surface2);position:relative}
.row .th img{width:100%;height:100%;object-fit:cover}
.row .rt{flex:1;min-width:0}
.row .rt b{display:block;line-height:1.25}
.row .rt small{color:var(--muted);display:block;line-height:1.3}
.row .ra{display:flex;gap:6px;flex:none}
.field{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;color:var(--ink);outline:0}
.field:focus{border-color:var(--bulb)}
.note{color:var(--muted);font-size:13.5px}
.steps{margin:8px 0 0;padding-left:20px;color:var(--muted);font-size:14px}
.steps li{margin:3px 0}
.steps a{color:var(--bulb)}
.setsec{padding:14px 0;border-bottom:1px solid var(--line)}
.setsec:last-child{border-bottom:0}
.setsec h4{margin:0 0 6px;font-size:15px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
textarea.field{min-height:110px;font-size:13px;font-family:ui-monospace,Menlo,monospace}

/* pick */
.pickstage{display:flex;flex-direction:column;align-items:center;gap:14px;padding:6px 0 4px;text-align:center}
.pickstage .pz{width:min(230px,62vw);box-shadow:0 0 0 2px var(--bulb),0 0 40px rgba(243,184,71,.28)}
.pickstage h2{margin:0;font-family:var(--display);font-weight:900;font-size:32px;text-transform:uppercase;line-height:1;text-wrap:balance}
.pickstage .why{color:var(--muted);font-size:14px}
.spin{animation:spin .5s ease-out}
@keyframes spin{from{transform:rotateY(90deg) scale(.9);opacity:.3}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}}

.tile.miss .pz{opacity:.5;filter:grayscale(.85)}
.tile.miss:hover .pz{opacity:.75}
.tile.miss .cap{color:var(--muted)}
.ribbon{position:absolute;left:6px;top:6px;background:var(--surface2);color:var(--bulb);border:1px dashed var(--bulb);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:2px 6px;border-radius:4px;pointer-events:none}
.rowbtn{display:flex;gap:12px;align-items:center;flex:1;min-width:0;text-align:left}
.prov{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.prov span{display:flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:4px 10px 4px 4px;font-size:13px;font-weight:600}
.prov img{width:28px;height:28px;border-radius:7px}
.provnone{color:var(--muted);font-size:14px;margin:6px 0 0}
.attr{color:var(--muted);font-size:11.5px;margin-top:12px}
.attr a{color:var(--muted)}
/* pick questions */
.q{margin-bottom:16px}
.q .lbl2{margin:0 0 8px}
.q .wrapchips .chip{font-size:14px}
.pickgo{display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;bottom:0;background:var(--surface);padding:12px 0 4px;border-top:1px solid var(--line)}
.pickgo .note b{color:var(--ink)}
.btn.big{padding:12px 18px;font-size:16px}
.linkbtn{color:var(--muted);text-decoration:underline;font-size:13.5px}
/* quick sort */
.sheet.full{max-width:560px;height:100%;max-height:100%;border-radius:0;display:flex;flex-direction:column;overflow:hidden}
@media(min-width:760px){.sheet.full{height:auto;max-height:94vh;border-radius:18px}}
.qs-top{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 8px}
.qs-top .count{flex:1;min-width:0;text-align:center;font-size:13px;color:var(--muted)}
.qs-top .count b{color:var(--ink)}
.qs-bar{height:3px;background:var(--surface2);margin:0 16px}
.qs-bar i{display:block;height:100%;background:var(--seen);transition:width .2s}
.qs-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:14px 16px 6px;position:relative}
.qs-card{position:relative;height:100%;max-height:520px;aspect-ratio:2/3;max-width:100%;border-radius:14px;overflow:hidden;background:var(--surface2);box-shadow:0 14px 40px rgba(0,0,0,.55);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;will-change:transform}
.qs-card img{width:100%;height:100%;object-fit:cover;pointer-events:none}
.qs-card .fake{font-size:30px;padding:18px}
.stamp{position:absolute;top:22px;padding:4px 12px;border:3px solid;border-radius:8px;font-family:var(--display);font-weight:900;font-size:30px;letter-spacing:.04em;text-transform:uppercase;opacity:0;background:rgba(20,14,17,.55);pointer-events:none}
.stamp.s{left:18px;color:var(--seen);transform:rotate(-12deg)}
.stamp.n{right:18px;color:var(--muted);transform:rotate(12deg)}
.stamp.f{left:50%;top:auto;bottom:26px;transform:translateX(-50%);color:var(--velvet)}
.qs-title{text-align:center;padding:4px 16px 0}

.qs-btns .n{color:var(--muted)} .qs-btns .s{color:var(--seen)} .qs-btns .f{color:var(--velvet)} .qs-btns .f svg{fill:var(--velvet)}
.qs-sub{display:flex;justify-content:center;gap:10px;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 14px);flex-wrap:wrap}
.qs-sub .btn{padding:7px 12px;font-size:13.5px}
.qs-hint{text-align:center;color:var(--muted);font-size:12px;padding:0 16px 8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px) + 14px);z-index:80;background:var(--ink);color:var(--ground);font-weight:600;padding:10px 16px;border-radius:12px;box-shadow:var(--shadow);max-width:calc(100vw - 32px);font-size:14px}
.updatebar{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;transform:translateX(-50%);z-index:90;background:var(--bulb);color:var(--bulb-ink);border-radius:12px;padding:10px 16px;display:flex;flex-direction:column;align-items:center;box-shadow:var(--shadow)}
.updatebar span{font-size:12px}
.foot{color:var(--muted);text-align:center;font-size:12px;margin:30px 0 10px}

  if (!bearer) u.searchParams.set('api_key', key);
  for (const [k, v] of Object.entries(params)) if (v != null && v !== '') u.searchParams.set(k, v);
  for (let attempt = 0; attempt < 4; attempt++) {

    catch (e) { if (attempt === 3) throw new TmdbError('net', 'Can’t reach TMDB — check your connection.'); await sleep(800 * (attempt + 1)); continue; }
    if (r.status === 429) { await sleep(1200 * (attempt + 1)); continue; }
    if (r.status === 401) throw new TmdbError('auth', 'TMDB didn’t accept that key. Check it in Settings.');
    if (r.status === 404) throw new TmdbError('404', 'Not found on TMDB');
    if (!r.ok) { if (attempt === 3) throw new TmdbError('http', 'TMDB error ' + r.status); await sleep(800); continue; }
    return r.json();

/* ---------- matching run (resumable; posters show up as it goes) ---------- */
const RUN = { on: false, done: 0, total: 0, err: '' };
async function runMatching() {
  if (RUN.on || !getKey()) return;
  const items = libItems();
  const jobs = [];
  for (const it of items) {
    const m = S.match[it.lk];
    if (!m) jobs.push({ it, find: true });
    else if (m.id && !META[m.id]) jobs.push({ it, find: false });
  }
  const seenIds = new Set();
  if (!jobs.length) return;
  Object.assign(RUN, { on: true, done: 0, total: jobs.length, err: '' });
  renderProgress();
  let i = 0, lastPaint = Date.now();
  async function worker() {
    while (i < jobs.length && !RUN.err) {
      const job = jobs[i++];
      try {
        let id = S.match[job.it.lk]?.id;
        if (job.find && S.match[job.it.lk]) { id = S.match[job.it.lk].id; }
        else if (job.find) { const m = await findMatch(job.it); S.match[job.it.lk] = m; id = m.id; save(); }
        if (id && !META[id] && !seenIds.has(id)) { seenIds.add(id); await loadDetails(id); }
      } catch (e) {
        if (e.code === 'auth' || e.code === 'nokey') { RUN.err = e.message; break; }
        if (e.code === 'net') { RUN.err = e.message; break; }
      }
      RUN.done++;
      renderProgress();
      if (Date.now() - lastPaint > 2500) { lastPaint = Date.now(); build(); render(); }
    }
  }
  await Promise.all(Array.from({ length: 6 }, worker));
  RUN.on = false; saveNow(); saveMeta(true); build(); render();
  if (RUN.err) toast(RUN.err, 4500);
  else { const n = ALL.filter(e => !e.id || e.c === 'lo').length; toast(n ? `All set. ${n} movies could use a quick look in Settings → Check matches.` : 'All movies matched.', 4500); }
}
function renderProgress() {
  const el = $('#progress'); if (!el) return;
  if (!RUN.on) { el.hidden = true; return; }
  el.hidden = false;
  el.innerHTML = `<b>Loading posters & details</b> <small class="tnum">${RUN.done.toLocaleString()} of ${RUN.total.toLocaleString()}</small><div class="bar"><i style="width:${(RUN.done / Math.max(1, RUN.total) * 100).toFixed(1)}%"></i></div><small>You can keep browsing. This only happens once per device.</small>`;
}

/* ---------- filtering / sorting ---------- */
function matchesQ(e, q) {
  if (!q) return true;
  const m = M(e);
  const hay = norm([T(e), e.t, m?.d?.join(' '), m?.cast?.join(' '), m?.c?.[1], Y(e)].join(' '));
  return q.split(' ').every(w => hay.includes(w));
}
function applyShow(list, show) {
  switch (show) {
    case 'unseen': return list.filter(e => !mk(e.k).s);
    case 'seen': return list.filter(e => mk(e.k).s);
    case 'fav': return list.filter(e => mk(e.k).f);
    case 'kid': return list.filter(isKid);
    default: return list;
  }
}
function sortList(list, how = ui.sort) {
  const by = {
    az: (a, b) => sortKey(T(a)).localeCompare(sortKey(T(b))),
    new: (a, b) => (Y(b) || 0) - (Y(a) || 0) || sortKey(T(a)).localeCompare(sortKey(T(b))),
    old: (a, b) => (Y(a) || 9999) - (Y(b) || 9999) || sortKey(T(a)).localeCompare(sortKey(T(b))),
    rating: (a, b) => (M(b)?.v || 0) - (M(a)?.v || 0),
    short: (a, b) => (M(a)?.r || 999) - (M(b)?.r || 999)
  }[how] || ((a, b) => 0);
  return list.slice().sort(by);
}
const visible = () => sortList(applyShow(ALL.filter(e => matchesQ(e, norm(ui.q))), ui.show));

/* ---------- grouping ---------- */
const GROUPS = { none: 'Everything', genre: 'Genre', franchise: 'Franchise', director: 'Director', decade: 'Decade', mood: 'Mood' };
function groupsFor(list, type) {
  const g = new Map();
  const add = (name, e) => { if (!g.has(name)) g.set(name, []); g.get(name).push(e); };
  for (const e of list) {
    const m = M(e);
    if (type === 'genre') (m?.g?.length ? m.g : ['Not loaded yet']).forEach(n => add(n, e));
    else if (type === 'franchise') { if (m?.c) add(m.c[1] + '\u0000' + m.c[0], e); }
    else if (type === 'director') (m?.d || []).forEach(n => add(n, e));
    else if (type === 'decade') { const y = Y(e); add(y ? Math.floor(y / 10) * 10 + 's' : 'Unknown', e); }
  }
  if (type === 'mood') return S.lists.filter(l => l.kind === 'mood').map(l => ({ name: l.name, list: list.filter(e => l.items.includes(e.k)), listId: l.id }));
  let out = [...g.entries()].map(([name, list]) => {
    const o = { name, list };
    if (type === 'franchise') { const [n, id] = name.split('\u0000'); o.name = n; o.collId = +id; }
    return o;
  });
  if (type === 'director') out = out.filter(x => x.list.length >= 3);
  if (type === 'decade') out.sort((a, b) => b.name.localeCompare(a.name));
  else out.sort((a, b) => b.list.length - a.list.length || a.name.localeCompare(b.name));
  if (type === 'franchise' || type === 'decade') out.forEach(x => x.list.sort((a, b) => (Y(a) || 0) - (Y(b) || 0)));
  return out;
}

/* ---------- rendering: tiles ---------- */
function hue(s) { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }
function posterHTML(e, cls = '') {
  const m = M(e), seen = mk(e.k).s;

  const h = hue(e.t);
  return `<div class="pz ${cls}" style="background:linear-gradient(160deg,hsl(${h} 45% 30%),hsl(${(h + 40) % 360} 50% 12%))"><div class="fake">${esc(T(e))}<small>${esc(Y(e) || '')}</small></div></div>`;
}
function badgesHTML(k) {

    t.querySelector('.badges').innerHTML = badgesHTML(k);

}
const gridHTML = list => list.length ? `<div class="grid">${list.map(tileHTML).join('')}</div>` : '';
/* franchise entries you don't own (from TMDB collections) */
function collMissing(collId) {
  const c = COLL[collId]; if (!c) return null;
  const now = today();
  return c.parts.filter(p => !ENT.get('t' + p.id) && p.release_date && p.release_date <= now);
}
function missTileHTML(p) {
  const y = (p.release_date || '').slice(0, 4), h = hue(p.title || '');
  const pic = p.poster_path ? `<img loading="lazy" decoding="async" alt="" src="${IMG(p.poster_path)}">` : `<div class="fake" style="background:linear-gradient(160deg,hsl(${h} 30% 26%),hsl(${h} 30% 10%))">${esc(p.title)}</div>`;
  return `<button class="tile miss" data-miss="${p.id}"><div class="pz">${pic}</div><span class="ribbon">Not owned</span><span class="cap">${esc(p.title)} <span>${esc(y)}</span></span></button>`;
}
/* owned + not-owned in release order */
function seriesHTML(g) {
  const miss = (ui.show === 'all' && !ui.q && g.collId) ? (collMissing(g.collId) || []) : [];
  return [...g.list.map(e => ({ y: Y(e) || 0, h: tileHTML(e) })), ...miss.map(p => ({ y: parseInt(p.release_date) || 0, h: missTileHTML(p) }))].sort((a, b) => a.y - b.y).map(x => x.h);
}
let collRun = null;
function ensureCollections(ids) {
  if (collRun || !getKey()) return;
  const need = [...new Set(ids)].filter(id => !COLL[id]);
  if (!need.length) return;
  collRun = { done: 0, total: need.length };
  (async () => {
    let i = 0;
    const worker = async () => { while (i < need.length) { const id = need[i++]; try { await getCollection(id); } catch (e) { if (e.code === 'auth' || e.code === 'net') { i = need.length; } } collRun.done++; const n = $('#collnote'); if (n) n.textContent = `Looking up the movies you don’t own… ${collRun.done} of ${collRun.total}`; } };
    await Promise.all([worker(), worker(), worker(), worker()]);
    collRun = null;
    if (ui.tab === 'library' && (ui.group === 'franchise' || ui.open?.collId)) render();
  })();
}
function shelfHTML(g, type) {
  const seen = g.list.filter(e => mk(e.k).s).length;
  const pct = g.list.length ? Math.round(seen / g.list.length * 100) : 0;
  const data = type === 'mood' ? `data-list="${esc(g.listId)}"` : `data-grp="${esc(type)}" data-name="${esc(g.name)}" ${g.collId ? `data-coll="${g.collId}"` : ''}`;
  const series = type === 'franchise' ? seriesHTML(g) : null;
  const missN = series ? series.length - g.list.length : 0;
  const tiles = series ? series.slice(0, 30).join('') : g.list.slice(0, 24).map(tileHTML).join('');
  const countTxt = type === 'franchise' ? `${g.list.length} owned${missN ? ` · ${missN} not` : ''} · ${seen} seen` : `${g.list.length} · ${seen} seen`;
  return `<section class="shelf"><button class="shelfhead" ${data}><h3>${esc(g.name)}</h3><span class="tnum">${countTxt}</span><span class="meter"><i style="width:${pct}%"></i></span><span class="more">${g.list.length > 24 ? 'All ' + g.list.length : 'Open'}</span></button>
    ${g.list.length ? `<div class="rail">${tiles}</div>` : `<p class="note">Nothing here yet. Open a movie and tap “${esc(g.name)}” to add it.</p>`}</section>`;
}

function bulk(action) {
  if (action === 'done') { ui.select = false; SEL.clear(); render(); return; }
  if (!SEL.size) { toast('Tap posters to select them first.'); return; }
  const keys = [...SEL];
  if (action === 'list') { openListPicker(keys); return; }
  if (action === 'remove') {
    const b = document.querySelector('[data-bulk="remove"]');
    if (b && b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = `Tap again to remove ${keys.length}`; return; }
    removeMovies(keys); SEL.clear(); render(); return;
  }
  for (const k of keys) {
    if (action === 'seen') { setMark(k, 's', mk(k).s || today()); setMark(k, 'w', 0); }
    if (action === 'unseen') setMark(k, 's', 0);
    if (action === 'fav') setMark(k, 'f', 1);
    if (action === 'watch') setMark(k, 'w', Date.now());
  }
  toast(`Updated ${keys.length} movie${keys.length === 1 ? '' : 's'}`);
  SEL.clear(); render();
}

/* ---------- quick sort: one poster at a time, swipe or tap ---------- */
function unsorted() { return ALL.filter(e => !mk(e.k).s && !mk(e.k).n); }
function openSort() {
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  let queue = unsorted();
  queue = [...shuffle(queue.filter(e => M(e)?.p)), ...shuffle(queue.filter(e => !M(e)?.p))];
  const total0 = ALL.length;
  const undo = [];
  let sortedNow = 0, busy = false;
  const keyH = ev => {
    if (STACK[STACK.length - 1]?.ov !== ov) return;
    const map = { ArrowRight: 's', ArrowLeft: 'n', ArrowUp: 'f', ArrowDown: 'skip', w: 'w', z: 'undo', Backspace: 'undo' };
    if (map[ev.key]) { ev.preventDefault(); act(map[ev.key]); }
  };
  const sheet = openSheet('<div></div>', { full: true, onClose: () => { document.removeEventListener('keydown', keyH); render(); if (sortedNow) toast(`Sorted ${sortedNow} movie${sortedNow === 1 ? '' : 's'}`); } });
  const ov = STACK[STACK.length - 1].ov;
  document.addEventListener('keydown', keyH);
  sheet.innerHTML = `<div class="qs-top"><button class="x" data-act="close" aria-label="Close">${IC.x}</button><div class="count tnum" id="qsCount"></div><button class="x" id="qsUndo" aria-label="Undo" title="Undo">${IC.back}</button></div>
    <div class="qs-bar"><i id="qsBar"></i></div>
    <div class="qs-stage" id="qsStage"></div>
    <div class="qs-title" id="qsTitle"></div>
    <div class="qs-btns"><button class="n" data-qs="n">${IC.x}Haven’t seen</button><button class="f" data-qs="f">${IC.heart}Loved it</button><button class="s" data-qs="s">${IC.check}Seen it</button></div>
    <div class="qs-hint">Swipe right if you’ve seen it, left if not, up if you loved it</div>
    <div class="qs-sub"><button class="btn" data-qs="w">${IC.mark}Haven’t seen, want to</button><button class="btn ghost" data-qs="skip">Not sure, skip</button></div>`;
  const stage = sheet.querySelector('#qsStage'), title = sheet.querySelector('#qsTitle');
  sheet.querySelectorAll('[data-qs]').forEach(b => b.onclick = () => act(b.dataset.qs));
  sheet.querySelector('#qsUndo').onclick = () => act('undo');
  const counts = () => {
    const left = unsorted().length, done = total0 - left;
    sheet.querySelector('#qsCount').innerHTML = `<b>${done.toLocaleString()}</b> sorted · ${left.toLocaleString()} to go`;
    sheet.querySelector('#qsBar').style.width = (done / Math.max(1, total0) * 100).toFixed(1) + '%';
    sheet.querySelector('#qsUndo').disabled = !undo.length;
    sheet.querySelector('#qsUndo').style.opacity = undo.length ? 1 : .35;
  };
  const show = () => {
    counts();
    const e = queue[0];
    if (!e) {
      stage.innerHTML = `<div class="empty"><h3>All sorted</h3><p>Every movie is marked seen or not seen. Your favorites are in Lists &amp; Moods.</p><button class="btn primary" data-act="close">Done</button></div>`;
      title.innerHTML = ''; sheet.querySelectorAll('.qs-btns,.qs-sub,.qs-hint').forEach(x => x.hidden = true); return;
    }
    sheet.querySelectorAll('.qs-btns,.qs-sub,.qs-hint').forEach(x => x.hidden = false);
    const m = M(e);
    const pic = m?.p ? `<img alt="" src="${IMG(m.p, 'w500')}">` : `<div class="fake" style="background:linear-gradient(160deg,hsl(${hue(e.t)} 45% 30%),hsl(${(hue(e.t) + 40) % 360} 50% 12%))">${esc(T(e))}</div>`;
    stage.innerHTML = `<div class="qs-card" id="qsCard">${pic}<span class="stamp s">Seen</span><span class="stamp n">Not seen</span><span class="stamp f">Loved it</span></div>`;
    title.innerHTML = `<h3>${esc(T(e))}</h3><div class="tnum">${[Y(e), fmtRun(m?.r), m?.d?.[0]].filter(Boolean).map(esc).join(' · ')}</div>`;
    const nx = queue[1]; if (nx && M(nx)?.p) { const im = new Image(); im.src = IMG(M(nx).p, 'w500'); }
    drag(sheet.querySelector('#qsCard'));
  };
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const fly = (card, dir, done) => {
    if (reduce || !card) { done(); return; }
    const to = { s: 'translate(130%,0) rotate(18deg)', n: 'translate(-130%,0) rotate(-18deg)', f: 'translate(0,-120%)', w: 'translate(-130%,0) rotate(-18deg)', skip: 'translate(0,120%)' }[dir];
    card.style.transition = 'transform .22s ease-in, opacity .22s'; card.style.transform = to; card.style.opacity = '0';
    setTimeout(done, 200);
  };
  function act(a) {
    if (busy) return;
    if (a === 'undo') {
      const u = undo.pop(); if (!u) return;
      if (u.prev) S.marks[u.k] = u.prev; else delete S.marks[u.k];
      save(); if (u.counted) sortedNow--;
      queue.unshift(ENT.get(u.k)); show(); return;
    }
    const e = queue[0]; if (!e) return;
    busy = true;
    const k = e.k, prev = S.marks[k] ? Object.assign({}, S.marks[k]) : null;
    if (a === 's') setMark(k, 's', today());
    if (a === 'f') { setMark(k, 's', today()); setMark(k, 'f', 1); }
    if (a === 'n') setMark(k, 'n', 1);
    if (a === 'w') { setMark(k, 'n', 1); setMark(k, 'w', Date.now()); }
    undo.push({ k, prev, counted: a !== 'skip' }); if (undo.length > 50) undo.shift();
    if (a !== 'skip') sortedNow++;
    fly(sheet.querySelector('#qsCard'), a, () => { queue.shift(); if (a === 'skip') queue.push(e); busy = false; show(); });
  }
  function drag(card) {
    if (!card) return;
    let x0 = 0, y0 = 0, dx = 0, dy = 0, on = false;
    const st = { s: card.querySelector('.stamp.s'), n: card.querySelector('.stamp.n'), f: card.querySelector('.stamp.f') };
    card.addEventListener('pointerdown', ev => { on = true; x0 = ev.clientX; y0 = ev.clientY; dx = dy = 0; card.setPointerCapture(ev.pointerId); card.style.transition = 'none'; });
    card.addEventListener('pointermove', ev => {
      if (!on) return; dx = ev.clientX - x0; dy = ev.clientY - y0;
      card.style.transform = `translate(${dx}px,${dy}px) rotate(${dx / 18}deg)`;
      const up = -dy > Math.abs(dx) ? Math.min(1, -dy / 110) : 0;
      st.s.style.opacity = up ? 0 : Math.max(0, Math.min(1, dx / 110)); st.n.style.opacity = up ? 0 : Math.max(0, Math.min(1, -dx / 110)); st.f.style.opacity = up;
    });
    const end = () => {
      if (!on) return; on = false;
      if (-dy > 110 && -dy > Math.abs(dx)) act('f');
      else if (dx > 100) act('s');
      else if (dx < -100) act('n');
      else { card.style.transition = 'transform .2s'; card.style.transform = ''; Object.values(st).forEach(x => x.style.opacity = 0); }
    };
    card.addEventListener('pointerup', end); card.addEventListener('pointercancel', end);
  }
  show();
}

function refreshCheck() {
  if (!checkSheet || !checkSheet.isConnected) return;
  const list = sortList(ALL.filter(e => !e.id || e.c === 'lo'), 'az');
  const body = checkSheet.querySelector('#checkBody');
  body.innerHTML = list.length ? `<p class="note">These were guesses or misses. “Looks right” confirms it; “Fix” lets you pick the right movie.</p>` + list.map(e => {
    const m = M(e);
    return `<div class="row"><div class="th">${m?.p ? `<img loading="lazy" alt="" src="${IMG(m.p, 'w92')}">` : ''}</div><div class="rt"><b>${esc(e.t)} ${e.y ? `<span class="note">(${e.y})</span>` : ''}</b><small>${e.id ? `Matched to: ${esc(m?.t || '…')} (${esc(m?.y || '?')})` : 'Not found on TMDB'}</small></div>
      <div class="ra">${e.id ? `<button class="btn" data-ok="${esc(e.k)}">Looks right</button>` : ''}<button class="btn primary" data-fixk="${esc(e.k)}">Fix</button></div></div>`;
  }).join('') : '<div class="empty"><h3>All good</h3><p>Every movie is matched.</p></div>';
}

/* ---------- events ---------- */
document.addEventListener('click', ev => {
  const t = ev.target;
  const nav = t.closest('nav.tabs button');
  if (nav) { ui.tab = nav.dataset.tab; ui.open = null; ui.listOpen = null; saveUi(); render(); window.scrollTo(0, 0); return; }
  const set = t.closest('[data-set]');
  if (set) { ui[set.dataset.set] = set.dataset.v; ui.open = null; saveUi(); render(); return; }
  if (t.closest('#setBtn')) { openSettings(); return; }
  if (t.closest('#pickBtn')) { openPick(); return; }
  if (t.closest('#selBtn')) { ui.select = !ui.select; SEL.clear(); render(); if (ui.select) toast('Tap posters to select. Actions are at the bottom.'); return; }
  const bk = t.closest('[data-bulk]'); if (bk) { bulk(bk.dataset.bulk); return; }

  const sheet = t.closest('.sheet');
  const act = t.closest('[data-act]')?.dataset.act;
  if (act === 'close') { closeSheet(); return; }
  if (act === 'quicksort') { while (STACK.length) closeSheet(); openSort(); return; }
  if (act === 'addmovie') { openAddMovie(); return; }
  if (act === 'showremoved') { openRemoved(); return; }
  const missEl = t.closest('[data-miss]');
  if (missEl && !t.closest('[data-wishid]')) { openMissing(+missEl.dataset.miss); return; }
  if (sheet && sheet.dataset.mid && (act === 'misswish' || act === 'missown')) {
    const id = +sheet.dataset.mid, d = NOTOWNED[id];
    if (act === 'misswish' && d) { if (addWish(d, d.belongs_to_collection?.name?.replace(/\s*Collection$/i, '') || '')) toast(`${d.title} is on your wish list`); paintMissing(sheet); if (ui.tab === 'wish') render(); }
    if (act === 'missown') { ownIt(id).then(() => { if (sheet.isConnected) paintMissing(sheet); }); }
    return;
  }
  if (sheet) {
    const k = sheet.dataset.k;
    const mark = t.closest('[data-mark]'); if (mark && k) { toggleMark(k, mark.dataset.mark); paintDetail(sheet); return; }
    const tog = t.closest('[data-tog]'); if (tog && k) { toggleList(k, tog.dataset.tog); paintDetail(sheet); if (ui.tab !== 'library' || ui.group === 'mood') render(); return; }
    if (act === 'fix' && k) { openFix(k); return; }
    if (act === 'remove' && k) {
      const b = t.closest('[data-act]');
      if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = 'Tap again to remove'; return; }
      closeSheet(); removeMovies([k]); render(); return;
    }
    if (act === 'newlist') { openListEditor(t.closest('[data-act]').dataset.kind, k ? [k] : []); return; }
    const lnk = t.closest('[data-q]'); if (lnk) { while (STACK.length) closeSheet(); ui.tab = 'library'; ui.open = null; ui.q = lnk.dataset.q; $('#q').value = ui.q; render(); window.scrollTo(0, 0); return; }
    const fr = t.closest('.franchise'); if (fr) { while (STACK.length) closeSheet(); ui.tab = 'library'; ui.open = { type: 'franchise', name: fr.dataset.name, collId: +fr.dataset.coll }; saveUi(); render(); window.scrollTo(0, 0); return; }
    const ok = t.closest('[data-ok]'); if (ok) { const e = ENT.get(ok.dataset.ok); e.lks.forEach(lk => { if (S.match[lk]) S.match[lk].c = 'ok'; }); save(); build(); refreshCheck(); return; }
    const fx = t.closest('[data-fixk]'); if (fx) { openFix(fx.dataset.fixk); return; }
    const tile = t.closest('.tile'); if (tile) { openDetail(tile.dataset.k); return; }
    return;
  }

  const tile = t.closest('.tile');
  if (tile) {
    if (ui.select) { const k = tile.dataset.k; SEL.has(k) ? SEL.delete(k) : SEL.add(k); refreshTile(k); renderSelbar(); return; }
    openDetail(tile.dataset.k); return;
  }
  const sh = t.closest('.shelfhead');
  if (sh) {
    if (sh.dataset.list) { ui.tab = 'lists'; ui.listOpen = sh.dataset.list; saveUi(); render(); window.scrollTo(0, 0); return; }
    ui.open = { type: sh.dataset.grp, name: sh.dataset.name, collId: sh.dataset.coll ? +sh.dataset.coll : null };
    render(); window.scrollTo(0, 0); return;
  }
  const lc = t.closest('.lcard[data-list]'); if (lc) { ui.listOpen = lc.dataset.list; render(); window.scrollTo(0, 0); return; }
  const wb = t.closest('[data-wishid]');
  if (wb) {
    const id = +wb.dataset.wishid; const p = allParts()[id] || (t.closest('#missing')?._parts || []).find(x => x.id === id);
    if (p && addWish(p, wb.dataset.coll)) { wb.textContent = 'On list'; wb.classList.remove('primary'); toast(`${p.title} is on your wish list`); }
    return;
  }
  switch (act) {
    case 'settings': openSettings(); break;
    case 'closegroup': ui.open = null; render(); break;
    case 'closelist': ui.listOpen = null; render(); break;
    case 'pickhere': openPick(); break;
    case 'newlist': openListEditor(t.closest('[data-act]').dataset.kind); break;
    case 'editlist': { const L = listKeys(ui.listOpen); if (L?.list) openListEditor(L.list.kind, null, L.list); break; }
    case 'wishsearch': openWishSearch(); break;
    case 'bought': boughtIt(+t.closest('[data-act]').dataset.id); break;
    case 'unwish': S.wish = S.wish.filter(x => x.id !== +t.closest('[data-act]').dataset.id); save(); render(); break;
    case 'findmissing': findAllMissing(); break;
  }
});
document.addEventListener('change', ev => { if (ev.target.id === 'sortSel') { ui.sort = ev.target.value; saveUi(); render(); } });
let qT;
$('#q').addEventListener('input', ev => { clearTimeout(qT); qT = setTimeout(() => { ui.q = ev.target.value; render(); }, 180); });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && STACK.length) closeSheet(); });

/* ---------- update check (same pattern as Slab Happy) ---------- */
let updateShown = false;
async function checkForUpdate() {
  if (updateShown || location.protocol === 'file:') return;
  try {
    const resp = await fetch(location.pathname + '?check=' + Date.now(), { cache: 'no-store' });
    if (!resp.ok) return;
    const m = (await resp.text()).match(/const APP_VERSION = '([^']+)'/);
    if (!m || m[1] <= APP_VERSION) return;
    updateShown = true;
    const bar = document.createElement('button');
    bar.className = 'updatebar'; bar.type = 'button';
    bar.innerHTML = `<b>New version ready</b><span>Tap to update to ${esc(m[1])}</span>`;
    bar.onclick = () => location.replace(location.pathname + '?v=' + encodeURIComponent(m[1]));
    document.body.appendChild(bar);
  } catch (e) { }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkForUpdate(); });

/* ---------- boot ---------- */
(function boot() {
  build(); render();
  const lastV = lsGet('mq_lastVersion');
  if (lastV && lastV !== APP_VERSION) toast('Updated to version ' + APP_VERSION, 3500);
  lsSet('mq_lastVersion', APP_VERSION);
  if (location.search.includes('v=')) history.replaceState(null, '', location.pathname);
  if (!lsGet(STATE_LS)) saveNow();
  if (getKey()) runMatching();
  checkForUpdate();
})();
</script>
