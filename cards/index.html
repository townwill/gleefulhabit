<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Slab Happy">
<meta name="theme-color" content="#0a1120">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<title>Slab Happy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --ground:#e9edf3; --surface:#ffffff; --surface2:#f4f6fa; --ink:#0f1b33; --muted:#5a6782; --line:#d4dbe6;
  --accent:#c8102e; --accent-ink:#ffffff; --gold:#a8740a; --gold-bg:#fbf1da; --green:#17744a; --green-bg:#e0f3e9;
  --navy:#1e3a8a; --navy-bg:#e3e9fb; --shadow:0 1px 2px rgba(15,27,51,.06),0 6px 18px rgba(15,27,51,.08);
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif; --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark; --ground:#0a1120; --surface:#131c2f; --surface2:#1a2440; --ink:#e7ecf6; --muted:#94a1ba; --line:#27334d;
    --accent:#ff4a5b; --accent-ink:#1a0508; --gold:#e8b64c; --gold-bg:#3a2c0e; --green:#4cc98a; --green-bg:#0f3324;
    --navy:#8fb0ff; --navy-bg:#1b2a55; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark; --ground:#0a1120; --surface:#131c2f; --surface2:#1a2440; --ink:#e7ecf6; --muted:#94a1ba; --line:#27334d;
  --accent:#ff4a5b; --accent-ink:#1a0508; --gold:#e8b64c; --gold-bg:#3a2c0e; --green:#4cc98a; --green-bg:#0f3324;
  --navy:#8fb0ff; --navy-bg:#1b2a55; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{background:var(--ground)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:12px 110px}

/* top bar */
.top{position:sticky;top:0;padding-top:env(safe-area-inset-top,0px);z-index:20;background:var(--ground);border-bottom:1px solid var(--line)}
.top-in{max-width:560px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:.02em;text-transform:uppercase;line-height:1;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:18px;height:24px;border:3px solid var(--accent);border-radius:3px;position:relative}
.brand i::after{content:"";position:absolute;left:2px;right:2px;top:2px;height:5px;background:var(--accent)}
.pill{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:16px;color:#fff;flex:none}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{background:none;border:0;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2}
.nav button[aria-current="page"]{color:var(--accent)}
.nav .count{font-family:var(--mono);font-size:10px;letter-spacing:0}

h1,h2,h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.02em;margin:0;text-wrap:balance;line-height:1.05}
h1{font-size:34px;font-weight:800}
h2{font-size:24px;font-weight:800}
h3{font-size:18px;font-weight:700}
.eyebrow{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:14px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:16px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--ground)}
.btn.ghost{background:transparent}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2}
.linkbtn{background:none;border:0;color:var(--navy);font-weight:600;padding:6px 0;text-decoration:underline;text-underline-offset:3px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}

/* scan */
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;min-height:250px;border:2px dashed var(--line);border-radius:18px;background:var(--surface);padding:24px 16px;cursor:pointer;position:relative}
.drop:hover{border-color:var(--accent)}
.drop .slab{width:92px;height:128px;border:4px solid var(--accent);border-radius:8px;position:relative;background:var(--surface2)}
.drop .slab::before{content:"";position:absolute;left:6px;right:6px;top:6px;height:18px;background:var(--accent);border-radius:2px}
.drop .slab::after{content:"";position:absolute;left:14px;right:14px;top:34px;bottom:12px;border:2px solid var(--line);border-radius:3px}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.scanning{position:relative;border-radius:14px;overflow:hidden;background:var(--surface2);max-width:280px;margin:0 auto}
.scanning img{display:block;width:100%}
.scanning::after{content:"";position:absolute;left:0;right:0;height:3px;background:var(--accent);box-shadow:0 0 18px 4px var(--accent);top:0;animation:sweep 1.8s ease-in-out infinite alternate}
@keyframes sweep{to{top:calc(100% - 3px)}}
@media (prefers-reduced-motion:reduce){.scanning::after{animation:none;top:50%}}

/* slab label (grading label look) */
.label{border:3px solid var(--accent);border-radius:10px;background:var(--surface);overflow:hidden}
.label-top{background:var(--accent);color:var(--accent-ink);display:flex;justify-content:space-between;align-items:center;padding:4px 12px;font-family:var(--display);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:13px}
.label-body{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:10px 12px 12px}
.label-body .l1{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:15px;letter-spacing:.04em;color:var(--muted)}
.label-body .l2{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:26px;line-height:1;grid-column:1}
.label-body .l3{font-family:var(--display);font-weight:600;text-transform:uppercase;font-size:15px;letter-spacing:.04em;grid-column:1}
.label-body .grade{grid-column:2;grid-row:1 / span 3;align-self:center;text-align:center;font-family:var(--display);font-weight:800;font-size:34px;line-height:1}
.label-body .grade small{display:block;font-size:12px;letter-spacing:.1em;color:var(--muted)}

.valuebox{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}
.bignum{font-family:var(--mono);font-weight:700;font-size:40px;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.range{font-family:var(--mono);font-size:13px;color:var(--muted)}
.rangebar{height:8px;border-radius:99px;background:var(--surface2);position:relative;margin-top:8px;border:1px solid var(--line)}
.rangebar b{position:absolute;top:-4px;width:14px;height:14px;border-radius:50%;background:var(--ink);border:2px solid var(--surface);transform:translateX(-50%)}

.rec{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-weight:800;letter-spacing:.08em;text-transform:uppercase;border-radius:8px;padding:4px 10px;font-size:15px;white-space:nowrap}
.rec.big{font-size:24px;padding:8px 16px;border-radius:12px}
.rec.SELL{background:var(--green-bg);color:var(--green)}
.rec.HOLD{background:var(--gold-bg);color:var(--gold)}
.rec.KEEP{background:var(--navy-bg);color:var(--navy)}
.rec.NONE{background:var(--surface2);color:var(--muted)}
.why{border-left:4px solid var(--line);padding:2px 0 2px 12px}
.why.SELL{border-color:var(--green)} .why.HOLD{border-color:var(--gold)} .why.KEEP{border-color:var(--navy)}

.comps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.comps li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.comps li:first-child{border-top:0}
.comps .p{font-family:var(--mono);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}

.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:600;font-size:15px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.chip.fav{background:var(--gold-bg);color:var(--gold);border-color:transparent;padding:2px 8px;font-size:12px;font-family:var(--display);letter-spacing:.08em;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:8px}

.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:8px 12px;width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:380px){.grid2{grid-template-columns:1fr}}

/* lists */
.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat .n{font-family:var(--mono);font-weight:700;font-size:24px;font-variant-numeric:tabular-nums}
.cards{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.crow{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.crow:first-child{border-top:0}
.thumb{width:52px;height:72px;border-radius:6px;object-fit:cover;background:var(--surface2);border:2px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-weight:800;color:var(--muted);font-size:20px}
.crow .t{font-weight:700;line-height:1.2}
.crow .s{font-size:13px;color:var(--muted);line-height:1.3;margin-top:2px}
.crow .v{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.crow .v .m{font-family:var(--mono);font-weight:700;font-variant-numeric:tabular-nums}
.delta{font-family:var(--mono);font-size:12px}
.up{color:var(--green)} .down{color:var(--accent)}
.recheck{display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--ground);border-radius:16px;padding:14px 16px}
.recheck .btn{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.bar{height:6px;border-radius:9px;background:rgba(127,127,127,.35);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.nudge{background:var(--green-bg);color:var(--green);border-radius:12px;padding:10px 14px;font-weight:600;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.empty{text-align:center;padding:32px 16px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 12px;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}

/* sheet */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(6,10,20,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--ground);width:100%;max-width:560px;max-height:calc(100% - env(safe-area-inset-top,0px) - 24px);overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.x{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.x svg{width:18px;height:18px;stroke:currentColor;stroke-width:2.4;fill:none}
.photo{max-width:220px;margin:0 auto;border-radius:10px;border:3px solid var(--line);display:block}

/* quiz */
.qprog{display:flex;gap:6px;margin-bottom:6px}
.qprog i{flex:1;height:6px;border-radius:9px;background:var(--line)}
.qprog i.on{background:var(--accent)}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;width:100%}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--surface2)}
.opt b{display:block;font-size:17px}
.opt .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;margin-top:2px}
.opt[aria-pressed="true"] .dot{border:7px solid var(--accent)}
.teamgrid{display:flex;flex-wrap:wrap;gap:8px;max-height:260px;overflow-y:auto;padding:2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--ground);padding:12px 18px;border-radius:12px;font-weight:600;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.note{font-size:13px;color:var(--muted);background:var(--surface2);border-radius:10px;padding:10px 12px}
.loading{display:grid;place-items:center;min-height:50vh;gap:12px;color:var(--muted)}
.hint{font-size:13px;color:var(--muted)}
details summary{cursor:pointer;font-weight:700;padding:6px 0}
</style>
<style>
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
html{-webkit-text-size-adjust:100%}
.prog{height:12px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--accent),#ff8a5b);transition:width .25s linear}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}}
.top-in{padding-top:14px}
.brand svg{width:34px;height:34px;border-radius:9px;flex:none}
.brandtxt{display:flex;flex-direction:column;gap:2px}
.vtag{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted)}
.updatebar{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:#17744a;color:#fff;border:0;border-radius:14px;padding:12px 16px;box-shadow:var(--shadow);max-width:536px;margin:0 auto}
.mbadge{font-size:14px;font-weight:600;border-radius:10px;padding:8px 12px;line-height:1.35}
.mbadge.ok{background:var(--green-bg);color:var(--green)}
.mbadge.warn{background:var(--gold-bg);color:var(--gold)}
.mbadge.bad{background:rgba(200,16,46,.12);color:var(--accent)}
.updatebar span{font-size:14px;opacity:.9}
body.has-update .toast{bottom:calc(160px + env(safe-area-inset-bottom,0px))}
.drop .logo{width:112px;height:112px;border-radius:26px;box-shadow:var(--shadow)}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><svg aria-hidden="true" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="hbg" cx="50%" cy="22%" r="85%"><stop offset="0" stop-color="#3559c7"/><stop offset="1" stop-color="#162c6e"/></radialGradient>
    <linearGradient id="hsheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".55"/><stop offset=".45" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#hbg)"/>
  <g transform="rotate(-6 256 262)">
    <rect x="132" y="58" width="248" height="400" rx="38" fill="#0b1636" opacity=".35" transform="translate(10 14)"/>
    <rect x="132" y="58" width="248" height="400" rx="38" fill="#eef2f8" stroke="#c7d1e2" stroke-width="8"/>
    <rect x="158" y="84" width="196" height="72" rx="12" fill="#c8102e"/>
    <rect x="176" y="104" width="86" height="11" rx="5.5" fill="#fff" opacity=".9"/>
    <rect x="176" y="126" width="58" height="11" rx="5.5" fill="#fff" opacity=".65"/>
    <text x="318" y="140" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="46" fill="#fff" text-anchor="middle">10</text>
    <rect x="166" y="180" width="180" height="250" rx="14" fill="#ffffff" stroke="#d6dce6" stroke-width="6"/>
    <circle cx="222" cy="272" r="19" fill="#0f1b33"/><circle cx="290" cy="272" r="19" fill="#0f1b33"/>
    <circle cx="228" cy="266" r="6" fill="#fff"/><circle cx="296" cy="266" r="6" fill="#fff"/>
    <circle cx="198" cy="318" r="15" fill="#ff8fa0" opacity=".55"/><circle cx="314" cy="318" r="15" fill="#ff8fa0" opacity=".55"/>
    <path d="M206 322 Q256 384 306 322" stroke="#0f1b33" stroke-width="20" fill="none" stroke-linecap="round"/>
    <path d="M150 76 L250 76 L150 250 Z" fill="url(#hsheen)" opacity=".5"/>
  </g>
  <path d="M410 70 l12 30 30 12 -30 12 -12 30 -12 -30 -30 -12 30 -12z" fill="#f2c14e"/>
  <path d="M96 380 l8 20 20 8 -20 8 -8 20 -8 -20 -20 -8 20 -8z" fill="#f2c14e"/>
</svg>
<span class="brandtxt">Slab Happy<span class="vtag" id="vtag"></span></span></div>
  <div id="who"></div>
</div></header>

<main class="wrap" id="view"><div class="loading"><div class="brand">Loading your cards…</div></div></main>

<nav class="nav" id="nav" hidden><div class="nav-in">
  <button data-tab="scan"><svg viewBox="0 0 24 24"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3.5"/></svg>Scan</button>
  <button data-tab="pc"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8"/><path d="M12 17s-3-1.8-3-3.8a1.6 1.6 0 0 1 3-.8 1.6 1.6 0 0 1 3 .8c0 2-3 3.8-3 3.8z"/></svg><span>PC <span class="count" id="c-pc"></span></span></button>
  <button data-tab="sell"><svg viewBox="0 0 24 24"><path d="M3 12V4h8l10 10-8 8L3 12z"/><circle cx="7.5" cy="8" r="1.5"/></svg><span>Sell <span class="count" id="c-sell"></span></span></button>
  <button data-tab="family"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.2c2.8.3 5 2.6 5 5.8"/></svg>Family</button>
</div></nav>

<div id="overlay"></div>
<div id="toast" class="toast" hidden role="status"></div>
<script>
const APP_VERSION = '2026-09-23.0200';

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const num = x => { const n = parseFloat(String(x ?? '').replace(/[$,]/g, '')); return isFinite(n) ? n : null; };
const money = n => n == null || !isFinite(n) ? '—' : '$' + (n >= 100 ? Math.round(n).toLocaleString() : n.toFixed(2));

const THUMBS = {};
const IDB = {
  db: null,
  open() {
    return new Promise(res => {
      try {
        const r = indexedDB.open('compcheck', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('thumbs');
        r.onsuccess = () => { this.db = r.result; res(); };
        r.onerror = () => res();
      } catch (e) { res(); }
    });
  },
  tx(mode) { return this.db ? this.db.transaction('thumbs', mode).objectStore('thumbs') : null; },
  loadAll() {
    return new Promise(res => {
      const st = this.tx('readonly'); if (!st) return res();
      const req = st.openCursor();
      req.onsuccess = () => { const c = req.result; if (c) { THUMBS[c.key] = c.value; c.continue(); } else res(); };
      req.onerror = () => res();
    });
  },
  put(id, v) { try { this.tx('readwrite')?.put(v, id); } catch (e) {} },
  del(id) { try { this.tx('readwrite')?.delete(id); } catch (e) {} },
};

/* ---------- Claude API ---------- */
async function askClaude({ prompt, image, model, search = true, maxSearch = 4, signal, onProgress }) {
  const key = localStorage.getItem(KEY_LS);
  if (!key) throw { code: 'no_key' };
  const content = [];
  if (image) content.push({ type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: image } });
  content.push({ type: 'text', text: prompt });
  const searches = [];
  const prog = ev => { if (ev.type === 'query' && ev.query) searches.push({ q: ev.query, n: null }); if (ev.type === 'results' && searches.length) searches[searches.length - 1].n = ev.count; (onProgress || (() => {}))(ev); };
  const useSearch = search && settings.search && !settings.searchUnavailable;
  let useDomains = true;
  const post = async (messages, withTools) => {
    const body = { model: MODELS[model] || MODELS.best, max_tokens: 4000, messages, stream: true };
    if (withTools) { const t = { type: 'web_search_20250305', name: 'web_search', max_uses: maxSearch }; if (useDomains) t.allowed_domains = COMP_DOMAINS; body.tools = [t]; }
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST', signal,
      headers: { 'content-type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify(body),
    });
    if (!resp.ok) { const t = await resp.text().catch(() => ''); throw { code: 'http', status: resp.status, detail: t }; }
    prog({ type: 'sent' });
    return readStream(resp, prog);
  };
  let messages = [{ role: 'user', content }], data, withTools = useSearch, searched = false;
  for (let i = 0; i < 4; i++) {
    try { data = await post(messages, withTools); }
    catch (e) {
      // Web search not switched on for this API account: fall back to Claude's own knowledge.
      if (withTools && useDomains && e.code === 'http' && e.status === 400 && /domain/i.test(e.detail || '')) {
        useDomains = false; data = await post(messages, true);   // a card site was refused — search the whole web instead
      } else if (withTools && e.code === 'http' && e.status === 400 && /web.?search|tool/i.test(e.detail || '')) {
        settings.searchUnavailable = true; saveSettings(); withTools = false;
        toast('Live eBay search is off for your API account — using Claude’s price knowledge instead.', 5000);
        data = await post(messages, false);
      } else throw e;
    }
    if (data.content.some(b => b.type === 'web_search_tool_result')) searched = true;
    if (data.stop_reason === 'pause_turn') { messages = [...messages, { role: 'assistant', content: data.content }]; continue; }
    break;
  }
  const text = data.content.filter(b => b.type === 'text').map(b => b.text).join('');
  prog({ type: 'done' });
  return { json: parseJSON(text), searched, searches };
}

// Reads Claude's streamed reply, rebuilding the content blocks and reporting real progress:
// 'start' when Claude begins, 'search' / 'query' / 'results' for each web search, 'text' as the answer is written.
async function readStream(resp, prog) {
  if (!resp.body || !resp.body.getReader) { const d = await resp.json(); return { content: d.content || [], stop_reason: d.stop_reason }; }
  const reader = resp.body.getReader(), dec = new TextDecoder();
  const blocks = []; let buf = '', stop = null, chars = 0;
  const handle = ev => {
    if (ev.type === 'message_start') prog({ type: 'start' });
    else if (ev.type === 'content_block_start') {
      const b = JSON.parse(JSON.stringify(ev.content_block)); blocks[ev.index] = b;
      if (b.type === 'server_tool_use') { b._json = ''; prog({ type: 'search' }); }
      if (b.type === 'web_search_tool_result') prog({ type: 'results', count: Array.isArray(b.content) ? b.content.length : 0 });
    } else if (ev.type === 'content_block_delta') {
      const b = blocks[ev.index]; if (!b) return;
      if (ev.delta.type === 'text_delta') { b.text = (b.text || '') + ev.delta.text; chars += ev.delta.text.length; prog({ type: 'text', chars }); }
      else if (ev.delta.type === 'input_json_delta') b._json += ev.delta.partial_json;
    } else if (ev.type === 'content_block_stop') {
      const b = blocks[ev.index];
      if (b && b.type === 'server_tool_use') { try { b.input = JSON.parse(b._json || '{}'); } catch (e) { b.input = {}; } delete b._json; prog({ type: 'query', query: b.input.query || '' }); }
    } else if (ev.type === 'message_delta') { if (ev.delta && ev.delta.stop_reason) stop = ev.delta.stop_reason; }
    else if (ev.type === 'error') { const et = ev.error?.type || ''; throw { code: 'http', status: et === 'overloaded_error' ? 529 : et === 'rate_limit_error' ? 429 : 500, detail: ev.error?.message || et }; }
  };
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf('\n\n')) >= 0) {
      const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
      const data = chunk.split('\n').filter(l => l.startsWith('data:')).map(l => l.slice(5).trim()).join('');
      if (data) handle(JSON.parse(data));
    }
  }
  const content = blocks.filter(Boolean).map(b => { if (b.type === 'text') { const t = { type: 'text', text: b.text || '' }; return t; } return b; });
  return { content, stop_reason: stop };
}
function parseJSON(text) {
  const m = text.match(/<json>([\s\S]*?)<\/json>/i);
  let raw = (m ? m[1] : text).replace(/```json|```/g, '').trim();
  const s = raw.search(/[\[{]/), e = Math.max(raw.lastIndexOf('}'), raw.lastIndexOf(']'));
  if (s < 0 || e < s) throw { code: 'bad_json', text };
  try { return JSON.parse(raw.slice(s, e + 1)); } catch (err) { throw { code: 'bad_json', text }; }
}
function errCopy(e) {
  if (!e) return 'Something went wrong. Try again.';
  if (e.name === 'AbortError') return '';
  if (e.code === 'no_key') return 'Add your Anthropic API key first (Family tab → Settings).';
  if (e.code === 'bad_json') return 'The price lookup came back garbled. Try again.';
  if (e.code === 'http') {
    const d = (e.detail || '').toLowerCase();
    if (e.status === 401) return 'Your API key was rejected. Check it in Family → Settings.';
    if (/credit balance/.test(d)) return 'Your Anthropic account is out of credit. Add some at console.anthropic.com.';
    if (e.status === 429) return 'Too many lookups at once. Wait a minute and try again.';
    if (e.status === 529 || e.status >= 500) return 'Claude is busy right now. Try again in a minute.';
    if (/model/.test(d) && e.status === 404) return 'That model isn’t available on your API account. Switch to “Fast” in Settings.';
    return `Request failed (${e.status}). Try again.`;
  }
  return 'Couldn’t reach Claude. Check your connection and try again.';
}

function profileBlurb(p) {
  return `Collector "${p.name}"${p.kid ? ' is a kid' : ''}. Sports: ${p.sports.join(', ') || 'any'}. Favorite teams: ${p.teams.join(', ') || 'none'}. Favorite players: ${p.players.join(', ') || 'none'}. Collecting style: ${GOALS[p.goal]?.p || 'balanced'}. When a card spikes: ${RISK[p.risk]?.p || 'waits to see'}.`;
}
const REC_RULES = `Recommendation must be one of:
- "SELL": good time to cash out (price near a peak, hype likely to fade, extra copy, or collector is profit-focused and it's not a true favorite).
- "HOLD": value likely to grow or hold (young rising player, rookie before breakout, season/playoffs upcoming) — keep for now, revisit later.
- "KEEP": belongs in their personal collection (favorite player/team, sentimental, or too low-value to be worth selling).
Weigh the collector profile heavily: cards of their favorite players/teams lean KEEP unless the collector is profit-focused or sells quickly into spikes and the price is unusually high. Cards under $3 are usually KEEP (or bundle later).`;
const kidNote = p => p.kid ? ' Write "reason" in simple, friendly words a kid can understand.' : '';
const SEARCH_RULES = `PRICING RULES — follow exactly:
a) Pin the exact version first: year, set, card number, parallel COLOR + finish (e.g. "Gold Reptilian Refractor", not just "Reptilian"), print run (/50), and grade (raw vs PSA 10 etc). Put the full parallel name in "parallel". In modern Topps/Bowman/Panini sets each print run maps to one named parallel (e.g. /50 is usually Gold) — if the card is serial numbered and you're not certain which parallel has that print run in this set, make your FIRST search find out (e.g. "2025-26 Bowman Chrome basketball Reptilian parallels print runs" or "BCV-121 /50"), and cross-check with the colors in the photo. Newer sets may be after your training, so don't rely on memory for them.
b) If you have web search, search for SOLD/completed sales of that exact version. Put the card number and print run in your queries (e.g. "LeBron James BCV-121 Gold Reptilian /50 sold"). Good sources: eBay sold/completed listings (ebay.com/itm pages), 130point.com, sportscardspro.com, cardladder.com, psacard.com auction prices, Goldin, Fanatics Collect.
c) A sale only counts as a comp if its title matches the player, year/set, card number, parallel COLOR and print run. Different colors, base cards, unnumbered versions, or a different /N are NOT comps — never price a numbered color parallel from base or unnumbered-parallel sales; numbered color parallels of stars usually sell for many times the base card. Raw and graded prices are different markets.
d) Ignore active listings and asking prices; use sold prices only (an accepted Best Offer may be below the listed price — say so in the note). Prefer the last 90 days.
e) low/mid/high come from the matching sales (mid = median). Put up to 4 matching sales in "comps" with price, date, url and the listing title in "desc".
f) Set "match": "exact" if you found 2+ sales of the exact version, "close" if only 1 or only near matches (e.g. same card, different grade — say which in the note), "none" if you found none and are estimating. Set "matchCount" to the number of exact sales you found. Never claim "exact" without real sales.
g) If no exact sales turn up, estimate from the closest real data: the same parallel/print run for this player in similar recent sets, or other players' copies of this exact parallel — never from the base card. Say what you based it on in the first comp's note.`;

}

function labelBlock(c) {
  const top = [c.year, c.brand, c.set].filter(Boolean).join(' ');
  const l3 = [c.cardNumber ? '#' + c.cardNumber : '', c.parallel, c.serial, c.rookie ? 'RC' : ''].filter(Boolean).join(' · ');
  const graded = c.grader && c.grade;
  return `<div class="label"><div class="label-top"><span>${esc(c.sport || 'Card')}${c.team ? ' · ' + esc(c.team) : ''}</span><span>${graded ? esc(c.grader) : 'Raw'}</span></div>
    <div class="label-body"><div class="l1">${esc(top || 'Unknown set')}</div><div class="l2">${esc(c.player || 'Unknown player')}</div><div class="l3">${esc(l3 || '—')}</div>
    <div class="grade">${graded ? esc(c.grade) : '<span style="font-size:22px">RAW</span>'}<small>${graded ? 'GRADE' : 'UNGRADED'}</small></div></div></div>`;
}
function recWord(r) { return r === 'SELL' ? 'Sell' : r === 'HOLD' ? 'Hold' : r === 'KEEP' ? 'Keep in PC' : 'Not priced'; }
function matchBadge(c) {
  if (c.match === 'you') return `<div class="mbadge ok">✓ From ${c.matchCount} sale${c.matchCount === 1 ? '' : 's'} you entered</div>`;
  if (c.match === 'exact') return `<div class="mbadge ok">✓ ${c.matchCount || 'Several'} sales of this exact card</div>`;
  if (c.match === 'close') return `<div class="mbadge warn">≈ Only close matches found — double-check eBay before selling</div>`;
  if (c.match === 'none') return `<div class="mbadge bad">No sales of this exact card found — this is an estimate. Try “Dig deeper” or check eBay.</div>`;
  return '';
}
function valueBlock(c) {
  const lo = c.low, hi = c.high, mid = c.mid;
  let pos = 50; if (lo != null && hi != null && hi > lo && mid != null) pos = Math.max(0, Math.min(100, (mid - lo) / (hi - lo) * 100));
  return `<div class="panel stack"><div class="valuebox"><div><div class="eyebrow">${c.match === 'exact' || c.match === 'you' ? 'Based on recent sales' : 'Estimated value'}</div><div class="bignum">${money(mid)}</div></div>
    <span class="rec big ${c.rec || 'NONE'}">${recWord(c.rec)}</span></div>
    ${lo != null && hi != null ? `<div><div class="rangebar"><b style="left:${pos}%"></b></div><div class="row range" style="justify-content:space-between;margin-top:6px"><span>Low ${money(lo)}</span><span>High ${money(hi)}</span></div></div>` : ''}
    ${matchBadge(c)}
    ${c.reason ? `<p class="why ${c.rec}" style="margin:0">${esc(c.reason)}</p>` : ''}
    ${c.trend ? `<div class="small muted">Market trend: <b>${esc(c.trend)}</b>${c.confidence != null ? ` · ID confidence ${Math.round(c.confidence * 100)}%` : ''}</div>` : ''}</div>`;
}
function compsBlock(c, ctx) {
  const comps = c.comps || [], se = c.searches || [];
  return `<div class="panel stack" style="gap:10px">
    ${comps.length ? `<div><div class="eyebrow" style="margin-bottom:6px">Comps</div><ul class="comps">${comps.map(x => `<li><span>${x.url ? `<a href="${esc(x.url)}" target="_blank" rel="noopener" style="color:var(--navy)">${esc(x.desc || 'Sale')}</a>` : esc(x.desc)}${x.date || x.note ? `<br><span class="small muted">${esc([x.date, x.note].filter(Boolean).join(' · '))}</span>` : ''}</span><span class="p">${money(num(x.price))}</span></li>`).join('')}</ul></div>` : ''}
    ${se.length ? `<details><summary class="small">What Claude searched (${se.length})</summary><ul class="small muted" style="margin:6px 0 0;padding-left:18px">${se.map(x => `<li>“${esc(x.q)}”${x.n != null ? ` — ${x.n} result${x.n === 1 ? '' : 's'}` : ''}</li>`).join('')}</ul></details>` : ''}
    <details ${c.match === 'none' ? 'open' : ''}><summary class="small">Found sales on eBay? Enter the prices</summary>
      <div class="stack" style="gap:8px;margin-top:8px"><span class="small muted">Tap eBay sold, then type the sold prices of the exact card, separated by commas.</span>
      <div class="row" style="flex-wrap:nowrap"><input id="mpin_${ctx}" inputmode="decimal" placeholder="480, 282, 399" style="flex:1;min-width:0;min-height:46px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);padding:8px 12px;font-family:var(--mono)"><button class="btn sm dark" data-mp="${ctx}">Use</button></div></div></details>
  </div>`;
}
function applyManual(c, text) {
  const ps = String(text).split(/[\s,;]+/).map(num).filter(x => x > 0).sort((a, b) => a - b);
  if (!ps.length) return null;
  const h = ps.length >> 1, mid = ps.length % 2 ? ps[h] : (ps[h - 1] + ps[h]) / 2;
  return { ...c, low: ps[0], mid, high: ps[ps.length - 1], match: 'you', matchCount: ps.length, comps: ps.slice().reverse().map(p => ({ desc: 'eBay sold (you entered)', price: p, date: '', url: '', note: '' })) };
}
// After the collector enters real prices, refresh the sell/hold call for that price (quick, no web search).
async function refreshRec(c, p) {
  const r = await askClaude({ prompt: `Card: ${cardDesc(c)}. Real recent sold prices: ${c.comps.map(x => money(x.price)).join(', ')} (median ${money(c.mid)}). Today is ${today()}.\n${REC_RULES}\n${profileBlurb(p)}${kidNote(p)} Keep "reason" to 1-2 sentences.\n${OUT('{"rec":"SELL|HOLD|KEEP","reason":""}')}`, model: 'fast', search: false });
  const rec = String(r.json.rec || '').toUpperCase();
  return ['SELL', 'HOLD', 'KEEP'].includes(rec) ? { rec, reason: String(r.json.reason || '') } : null;
}
function ebayLink(c) { const run = (String(c.serial || '').match(/\/\s*\d+/) || [''])[0].replace(/\s/g, ''); const q = c.query || [c.year, c.set, c.player, c.cardNumber, c.parallel, run, c.grader && c.grade ? c.grader + ' ' + c.grade : ''].filter(Boolean).join(' '); return 'https://www.ebay.com/sch/i.html?_nkw=' + encodeURIComponent(q) + '&LH_Sold=1&LH_Complete=1'; }
function editFields(c, pre) {

  return `<div class="stack">${f('player', 'Player', 'text', 'e.g. Bo Nix')}

}
function readFields(root, c) {

function resultView(p, s) {

    <div class="row"><div class="eyebrow">${priced ? 'Comp found' : 'New card'} · for ${esc(p.name)}</div><span class="spacer"></span><button class="linkbtn" data-act="rescan">Scan another</button></div>

/* ---- lists ---- */
function sortCards(arr) {
  const a = [...arr];
  if (state.sort === 'value') a.sort((x, y) => (y.mid || 0) - (x.mid || 0));
  else if (state.sort === 'recent') a.sort((x, y) => (y.addedAt || 0) - (x.addedAt || 0));
  else a.sort((x, y) => (x.player || '').localeCompare(y.player || ''));
  return a;
}
function delta(c) { const h = c.history || []; if (h.length < 2) return ''; const d = h[h.length - 1].mid - h[h.length - 2].mid; if (!d || !isFinite(d)) return '<span class="delta muted">no change</span>'; return `<span class="delta ${d > 0 ? 'up' : 'down'}">${d > 0 ? '▲' : '▼'} ${money(Math.abs(d))}</span>`; }
function isFav(p, c) {
  const hay = ((c.player || '') + ' ' + (c.team || '')).toLowerCase();
  return p.players.some(x => x && hay.includes(x.toLowerCase())) || p.teams.some(t => { const n = t.replace(/\s*\(.*\)$/, '').toLowerCase(); return n && hay.includes(n); });
}
function cardRow(c, p) {
  const sub = [c.year, c.brand, c.set, c.parallel, c.grader && c.grade ? c.grader + ' ' + c.grade : ''].filter(Boolean).join(' · ');
  const th = THUMBS[c.id];
  return `<button class="crow" data-card="${c.id}">
    ${th ? `<img class="thumb" src="${th}" alt="">` : `<span class="thumb">${esc((c.player || '?')[0])}</span>`}
    <span><span class="t">${esc(c.player || 'Unknown')}${isFav(p, c) ? ' <span class="chip fav">Fav</span>' : ''}</span><div class="s">${esc(sub)}</div></span>
    <span class="v"><span class="m">${money(c.mid)}</span><span class="rec ${c.rec || 'NONE'}" style="font-size:12px;padding:2px 7px">${recWord(c.rec)}</span>${delta(c)}</span></button>`;
}
function recheckBox() {
  const r = state.recheck, all = state.cards.length;
  if (!all) return '';
  if (r) return `<div class="recheck"><div style="flex:1"><b>Rechecking ${Math.min(r.done, r.total)} of ${r.total}…</b><div class="bar"><i style="width:${r.total ? r.done / r.total * 100 : 0}%"></i></div></div><button class="btn sm" data-act="stoprecheck">Stop</button></div>`;
  const last = Math.max(0, ...state.cards.map(c => c.checkedAt || 0));
  return `<div class="recheck"><div style="flex:1"><b>Recheck all our cards</b><div class="small" style="opacity:.8">${all} card${all > 1 ? 's' : ''} across ${state.profiles.length} profile${state.profiles.length > 1 ? 's' : ''}${last ? ' · last ' + new Date(last).toLocaleDateString() : ''}</div></div><button class="btn sm" data-act="recheck" ${hasKey() ? '' : 'disabled'}>Recheck</button></div>`;
}
function listView(p, list) {
  const cards = sortCards(cardsOf(p.id, list));
  const total = cards.reduce((s, c) => s + (c.mid || 0), 0);
  const pcSells = list === 'sell' ? cardsOf(p.id, 'pc').filter(c => c.rec === 'SELL') : [];
  return `<div class="stack">
    <div><div class="eyebrow">${esc(p.name)}’s</div><h1>${list === 'pc' ? 'Personal Collection' : 'To Sell'}</h1></div>
    <div class="summary"><div class="stat"><div class="eyebrow">Cards</div><div class="n">${cards.length}</div></div><div class="stat"><div class="eyebrow">${list === 'sell' ? 'Could bring in' : 'Est. value'}</div><div class="n">${money(total)}</div></div></div>
    ${recheckBox()}
    ${backupNudge()}
    ${pcSells.length ? `<div class="nudge"><span>${pcSells.length} card${pcSells.length > 1 ? 's' : ''} in your PC say${pcSells.length > 1 ? '' : 's'} SELL</span><button class="btn sm" data-act="showpcsells">Review</button></div>` : ''}
    ${cards.length ? `<div class="row"><span class="small muted">Sort</span><div class="seg" role="group">${[['value', 'Value'], ['recent', 'Newest'], ['name', 'Name']].map(([k, l]) => `<button data-sort="${k}" aria-pressed="${state.sort === k}">${l}</button>`).join('')}</div></div>
      <div class="cards">${cards.map(c => cardRow(c, p)).join('')}</div>`
      : `<div class="panel empty"><p>No cards here yet.</p><button class="btn primary" data-act="gotoscan">Scan a card</button></div>`}
  </div>`;
}

/* ---- backup ---- */
const lastBackup = () => lsGet('cc_lastBackup') || 0;
const unbacked = () => state.cards.filter(c => (c.addedAt || 0) > lastBackup() || (c.checkedAt || 0) > lastBackup()).length;
function backupNudge() {
  const n = unbacked(), lb = lastBackup();
  if (!n || (lb && n < 3 && Date.now() - lb < 7 * 864e5)) return '';
  return `<div class="nudge" style="background:var(--gold-bg);color:var(--gold)"><span>${n} card${n === 1 ? '' : 's'} not backed up yet</span><button class="btn sm" data-act="export">Back up</button></div>`;
}
function backupPanel() {
  const n = unbacked(), lb = lastBackup();
  return `<div class="panel stack"><h2>Backup</h2>
    <p class="small muted" style="margin:0">Cards live on this phone. Deleting the home-screen icon erases them, so keep a backup in Files or iCloud Drive. Updates never erase anything.</p>
    <div class="small"><b>${lb ? 'Last backup ' + new Date(lb).toLocaleDateString([], { month: 'short', day: 'numeric' }) : 'Never backed up'}</b>${n ? ` · <span style="color:var(--gold)">${n} change${n === 1 ? '' : 's'} since</span>` : lb ? ' · all saved' : ''}</div>
    <div class="grid2"><button class="btn sm ${n ? 'primary' : ''}" data-act="export">Back up now</button><label class="btn sm" for="importfile" style="position:relative;overflow:hidden">Restore backup<input id="importfile" type="file" accept="application/json,.json,text/plain" style="position:absolute;inset:0;opacity:0"></label></div>
  </div>`;
}

          : `<div class="row"><button class="linkbtn" data-act="retake" data-id="${p.id}">Retake quiz</button><span class="spacer"></span><button class="linkbtn" style="color:var(--accent)" data-act="delprofile" data-id="${p.id}">Delete profile</button></div>`}</div>`;

      <div class="field"><span class="eyebrow">Recheck all uses</span><div class="seg" role="group">${[['fast', 'Cheaper (Haiku)'], ['best', 'Best (Sonnet)']].map(([k, l]) => `<button data-set="recheckModel" data-v="${k}" aria-pressed="${settings.recheckModel === k}">${l}</button>`).join('')}</div></div>
      <label class="row"><input type="checkbox" id="searchtog" ${settings.search ? 'checked' : ''}> <span><b>Search live sold listings</b><br><span class="small muted">More accurate comps; a few extra cents per lookup.${settings.searchUnavailable ? ' Currently off for your API account — turn on web search at console.anthropic.com, then toggle this.' : ''}</span></span></label>

/* ---------- view events ---------- */
$('#view').addEventListener('click', async e => {
  const sortB = e.target.closest('[data-sort]'); if (sortB) { state.sort = sortB.dataset.sort; renderView(); return; }
  const ansB = e.target.closest('[data-ans]'); if (ansB) { readAns(); state.scan.ans[ansB.dataset.ans] = ansB.dataset.v; state.scan.error = ''; renderView(); if (ansB.dataset.v === 'yes') (ansB.dataset.ans === 'numbered' ? $('#a_no') : null)?.focus(); return; }
  const runB = e.target.closest('[data-run]'); if (runB) { readAns(); state.scan.ans.printRun = runB.dataset.run; renderView(); return; }
  const parB = e.target.closest('[data-par]'); if (parB) { readAns(); const a = state.scan.ans, v = parB.dataset.par; a.parWords = a.parWords.includes(v) ? a.parWords.filter(x => x !== v) : [...a.parWords, v]; renderView(); return; }
  const mpB = e.target.closest('[data-mp="r"]');
  if (mpB) {
    const s0 = state.scan, p = cur(), n = applyManual(s0.result, $('#mpin_r')?.value || '');
    if (!n) { toast('Type at least one price, like 480, 282'); return; }
    s0.result = n; renderView(); toast('Updated from your prices — rechecking sell/hold…');
    refreshRec(n, p).then(x => { if (x && state.scan.result === n) { Object.assign(n, x); renderView(); } }).catch(() => {});
    return;
  }
  const setB = e.target.closest('[data-set]'); if (setB) { settings[setB.dataset.set] = setB.dataset.v; saveSettings(); renderView(); return; }
  const row = e.target.closest('[data-card]'); if (row) { openCard(row.dataset.card); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'newprofile') openQuiz(null);
  else if (a === 'retake') openQuiz(b.dataset.id);
  else if (a === 'use') useProfile(b.dataset.id);
  else if (a === 'gotoscan') setTab('scan');
  else if (a === 'rescan') { state.scan = { status: 'idle' }; renderView(); }
  else if (a === 'stopscan') state.scan.ctl?.abort();
  else if (a === 'reprice') repriceFromForm();
  else if (a === 'deeper') repriceFromForm(true);

// Progress bar driven by real events from Claude's stream. Each stage has a floor and ceiling;
// within a stage the bar creeps slowly toward the ceiling so it never looks frozen.
function startWorking(thumb, maxSearch = 4) {
  const ctl = new AbortController();
  const pr = { pct: 3, floor: 3, ceil: 12, label: thumb ? 'Sending your photo…' : 'Sending to Claude…', detail: '', searches: 0 };
  state.scan = { status: 'working', thumb, ctl, pr }; renderView(); window.scrollTo(0, 0);
  const paint = () => {
    const bar = $('#progbar'), lab = $('#proglabel'), det = $('#progdetail'), pc = $('#progpct');
    if (bar) bar.style.width = pr.pct.toFixed(1) + '%';
    if (lab) lab.textContent = pr.label;
    if (det) det.textContent = pr.detail;
    if (pc) pc.textContent = Math.round(pr.pct) + '%';
  };
  const stage = (floor, ceil, label, detail) => { pr.floor = Math.max(pr.floor, floor); pr.ceil = Math.max(pr.ceil, ceil); pr.pct = Math.max(pr.pct, pr.floor); if (label) pr.label = label; if (detail != null) pr.detail = detail; paint(); };
  const tick = setInterval(() => { pr.pct += (pr.ceil - pr.pct) * 0.04; paint(); }, 250);
  const searchSpan = 55 / Math.max(1, maxSearch);
  const onProgress = ev => {
    if (ev.type === 'sent') stage(12, 22, thumb ? 'Reading the card…' : 'Looking up the card…');
    else if (ev.type === 'start') stage(18, 28, thumb ? 'Reading the card…' : 'Looking up the card…');
    else if (ev.type === 'search') { pr.searches++; const f = 25 + (pr.searches - 1) * searchSpan; stage(Math.min(f, 78), Math.min(f + searchSpan * .7, 80), `Searching sold listings (${pr.searches})…`, ''); }
    else if (ev.type === 'query') stage(pr.floor, pr.ceil, null, '“' + ev.query + '”');
    else if (ev.type === 'results') stage(Math.min(25 + pr.searches * searchSpan, 80), Math.min(25 + pr.searches * searchSpan + 4, 82), `Found ${ev.count} results — checking prices…`);
    else if (ev.type === 'text') { const f = 82 + Math.min(1, ev.chars / 1100) * 16; stage(f, Math.min(f + 2, 99), 'Writing up the comp…', ''); }
    else if (ev.type === 'done') { pr.pct = 100; stage(100, 100, 'Done!', ''); }
  };
  return { ctl, onProgress, stop: () => clearInterval(tick) };
}

async function recheckAll() {
  if (state.recheck || !hasKey()) return;
  const groups = state.profiles.map(p => ({ p, cards: cardsOf(p.id).filter(c => c.player) })).filter(g => g.cards.length);
  const total = groups.reduce((s, g) => s + g.cards.length, 0);
  const ctl = new AbortController();
  state.recheck = { done: 0, total, ctl }; renderView();
  let updated = 0, sells = 0, err = null;
  try {
    for (const g of groups) {
      for (let i = 0; i < g.cards.length; i += 4) {
        const chunk = g.cards.slice(i, i + 4);
        const lines = chunk.map(c => ({ id: c.id, list: c.list === 'pc' ? 'personal collection' : 'to-sell list', card: cardDesc(c), lastValue: c.mid }));
        const r = await askClaude({ prompt: recheckPrompt(g.p, lines), model: settings.recheckModel, maxSearch: Math.min(8, chunk.length * 2), signal: ctl.signal });
        const arr = Array.isArray(r.json) ? r.json : [];
        for (const x of arr) {
          const c = state.cards.find(y => y.id === x.id); if (!c) continue;
          const mid = num(x.mid); if (mid == null) continue;

          updated++; if (rec === 'SELL') sells++;

      }
    }
  } catch (e) { if (!(e && e.name === 'AbortError')) err = errCopy(e); }
  state.recheck = null; renderChrome(); renderView();
  toast(err || `Rechecked ${updated} card${updated === 1 ? '' : 's'}${sells ? ` · ${sells} now say SELL` : ''}`, 4500);
}

  const a = b.dataset.sact;
  if (a === 'close') closeSheet();
  else if (a === 'move') { putCard({ ...c, list: b.dataset.list }); toast(b.dataset.list === 'pc' ? 'Moved to PC' : 'Moved to Sell list'); renderChrome(); renderView(); renderSheet(); }
  else if (a === 'give') { const to = state.profiles.find(p => p.id === b.dataset.id); putCard({ ...c, profileId: to.id }); toast('Given to ' + to.name); closeSheet(); renderChrome(); renderView(); }
  else if (a === 'edit') { sh.editing = true; renderSheet(); }
  else if (a === 'canceledit') { sh.editing = false; renderSheet(); }
  else if (a === 'saveedit') { const n = readFields($('#editbox'), { ...c }); if (n.mid !== c.mid && n.mid != null) n.history = [...(c.history || []), { t: Date.now(), mid: n.mid }].slice(-20); putCard(n); sh.editing = false; renderSheet(); renderView(); }
  else if (a === 'del') { sh.confirm = true; renderSheet(); }
  else if (a === 'nodel') { sh.confirm = false; renderSheet(); }
  else if (a === 'yesdel') { delCard(c.id); closeSheet(); renderChrome(); renderView(); toast('Card deleted'); }
  else if (a === 'reprice' || a === 'deeper') {
    const deeper = a === 'deeper';
    sh.busy = true; renderSheet(); toast(deeper ? 'Digging deeper — this can take a minute…' : 'Re-pricing…', 6000);
    const p = state.profiles.find(x => x.id === c.profileId) || cur();
    try {
      const r = await askClaude({ prompt: textPrompt(p, cardDesc(c)) + (deeper ? '\n' + deeperNote(c) : ''), model: deeper ? 'best' : settings.model, maxSearch: deeper ? 8 : 4 });
      const n = { ...normalize(r.json || {}, c), searched: r.searched, searches: r.searches }; delete n.notFound;
      const now = Date.now(); if (n.mid != null) { n.checkedAt = now; n.history = [...(c.history || []), { t: now, mid: n.mid }].slice(-20); }
      putCard(n); toast('Updated: ' + money(n.mid));
    } catch (err) { toast(errCopy(err), 4500); }
    if (state.sheet) { state.sheet.busy = false; renderSheet(); } renderView();
  }
});

/* ---------- profile switcher ---------- */
function openSwitcher() {
  state.sheet = null; document.body.style.overflow = 'hidden';
  $('#overlay').innerHTML = `<div class="overlay" data-close><div class="sheet" role="dialog" aria-modal="true" aria-label="Switch profile">
    <div class="sheet-head"><h2>Who’s scanning?</h2><button class="x" data-pick="close" aria-label="Close">${ICON_X}</button></div>
    <div class="stack">${state.profiles.map(p => `<button class="opt" data-pick="${p.id}" aria-pressed="${p.id === state.current}">${avatar(p, 40)}<span><b>${esc(p.name)}</b><span class="small muted">${esc(collectorType(p))} · ${cardsOf(p.id).length} cards</span></span></button>`).join('')}
    <button class="btn block" data-pick="new">+ Add a profile</button></div></div></div>`;
}

/* ---------- quiz ---------- */
const QSTEPS = ['who', 'sports', 'teams', 'players', 'goal', 'risk', 'done'];
function openQuiz(editId, required = false) {
  const p = editId ? state.profiles.find(x => x.id === editId) : null;
  state.sheet = null;
  state.quiz = { step: 0, required, editId, filter: '', d: p ? clean(p) : { name: '', kid: false, sports: [], teams: [], players: [], goal: '', risk: '', color: COLORS[state.profiles.length % COLORS.length] } };
  renderQuiz();
}
function renderQuiz() {
  const q = state.quiz, d = q.d, step = QSTEPS[q.step], kid = d.kid;
  document.body.style.overflow = 'hidden';
  let body = '', canNext = true, title = '';
  const inputStyle = 'flex:1;min-width:0;min-height:48px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:8px 12px';
  if (step === 'who') {
    title = q.editId ? 'Retake the quiz' : 'New collector'; canNext = !!d.name.trim();
    body = `<div class="field"><label for="q_name">First name</label><input id="q_name" autocomplete="off" value="${esc(d.name)}" placeholder="First name"></div>
      <div class="eyebrow">This profile is for…</div>
      <button class="opt" data-q="kid" data-v="0" aria-pressed="${!kid}"><span class="dot"></span><span><b>A grown-up collector</b><span class="small muted">Straight-talk recommendations.</span></span></button>
      <button class="opt" data-q="kid" data-v="1" aria-pressed="${kid}"><span class="dot"></span><span><b>A kid collector</b><span class="small muted">Friendly explanations in simple words.</span></span></button>
      <div class="eyebrow">Profile color</div><div class="chips">${COLORS.map(c => `<button class="av" data-q="color" data-v="${c}" aria-label="Color" style="background:${c};width:38px;height:38px;border:3px solid ${d.color === c ? 'var(--ink)' : 'transparent'}"></button>`).join('')}</div>
      ${q.required ? `<div class="note stack" style="gap:8px"><b style="color:var(--ink)">Set up Slab Happy before?</b><span>Restore your profiles and cards from a backup instead.</span><label class="btn sm" for="restorefile" style="position:relative;overflow:hidden;align-self:flex-start">Restore from backup<input id="restorefile" type="file" accept="application/json,.json,text/plain" style="position:absolute;inset:0;opacity:0"></label></div>` : ''}`;
  } else if (step === 'sports') {
    title = kid ? 'What sports do you love?' : 'Which sports do you collect?'; canNext = d.sports.length > 0;
    body = `<p class="muted">Pick all that apply.</p><div class="chips">${SPORTS.map(s => `<button class="chip" data-q="sport" data-v="${s.k}" aria-pressed="${d.sports.includes(s.k)}">${s.k}</button>`).join('')}</div>`;
  } else if (step === 'teams') {
    title = kid ? 'Who are your teams?' : 'Favorite teams';
    const f = q.filter.toLowerCase();
    const lists = SPORTS.filter(s => d.sports.includes(s.k) && s.teams).map(s => {
      const ts = s.teams.split('|').filter(t => !f || t.toLowerCase().includes(f));
      return ts.length ? `<div class="eyebrow">${s.lg}</div><div class="chips">${ts.map(t => { const v = `${t} (${s.lg})`; return `<button class="chip" data-q="team" data-v="${esc(v)}" aria-pressed="${d.teams.includes(v)}">${esc(t)}</button>`; }).join('')}</div>` : '';
    }).join('');
    body = `<p class="muted">Tap your favorites, or add college and other teams below.</p>
      ${d.teams.length ? `<div class="chips">${d.teams.map(t => `<button class="chip" aria-pressed="true" data-q="team" data-v="${esc(t)}">${esc(t)} ✕</button>`).join('')}</div>` : ''}
      <div class="field"><label for="q_filter">Find a team</label><input id="q_filter" autocomplete="off" value="${esc(q.filter)}" placeholder="Type to filter…"></div>
      <div class="teamgrid stack" style="gap:10px">${lists || '<span class="muted small">No matching pro teams — add it below.</span>'}</div>
      <div class="row" style="flex-wrap:nowrap"><input id="q_team" style="${inputStyle}" placeholder="Add another team (e.g. Oregon Ducks)"><button class="btn sm" data-q="addteam">Add</button></div>`;
  } else if (step === 'players') {
    title = kid ? 'Who are your favorite players?' : 'Favorite players';
    body = `<p class="muted">${kid ? 'Add as many as you want!' : 'Their cards lean toward Keep unless the price is too good.'}</p>
      <div class="row" style="flex-wrap:nowrap"><input id="q_player" style="${inputStyle}" placeholder="Player name" autocomplete="off"><button class="btn primary" data-q="addplayer">Add</button></div>
      <div class="chips">${d.players.map(pl => `<button class="chip" aria-pressed="true" data-q="rmplayer" data-v="${esc(pl)}">${esc(pl)} ✕</button>`).join('') || '<span class="muted small">No players yet.</span>'}</div>`;
  } else if (step === 'goal') {
    title = kid ? 'Why do you collect cards?' : 'Why do you collect?'; canNext = !!d.goal;
    body = Object.entries(GOALS).map(([k, g]) => `<button class="opt" data-q="goal" data-v="${k}" aria-pressed="${d.goal === k}"><span class="dot"></span><span><b>${g.t}</b><span class="small muted">${g.d}</span></span></button>`).join('');
  } else if (step === 'risk') {
    title = kid ? 'Your card’s price shoots way up. What do you do?' : 'A card’s price spikes. You…'; canNext = !!d.risk;
    body = Object.entries(RISK).map(([k, g]) => `<button class="opt" data-q="risk" data-v="${k}" aria-pressed="${d.risk === k}"><span class="dot"></span><span><b>${g.t}</b><span class="small muted">${g.d}</span></span></button>`).join('');
  } else {
    title = `${esc(d.name)}, you’re a…`;
    body = `<div class="label"><div class="label-top"><span>Collector profile</span><span>${new Date().getFullYear()}</span></div><div class="label-body"><div class="l1">${esc(d.sports.join(' · '))}</div><div class="l2">${esc(collectorType(d))}</div><div class="l3">${esc(GOALS[d.goal].t)}</div><div class="grade">${avatar(d, 48)}</div></div></div>
      <p>${esc(RISK[d.risk].t)}. Slab Happy will use your ${d.teams.length} team${d.teams.length === 1 ? '' : 's'} and ${d.players.length} player${d.players.length === 1 ? '' : 's'} when it says sell, hold, or keep.</p>`;
  }
  const last = step === 'done';
  $('#overlay').innerHTML = `<div class="overlay" data-close><div class="sheet" role="dialog" aria-modal="true" aria-label="Collector quiz">
    <div class="qprog">${QSTEPS.map((_, i) => `<i class="${i <= q.step ? 'on' : ''}"></i>`).join('')}</div>
    <div class="sheet-head"><h2>${title}</h2>${q.required ? '' : `<button class="x" data-q="close" aria-label="Close">${ICON_X}</button>`}</div>
    <div class="stack">${body}
      <div class="grid2" style="margin-top:6px">${q.step > 0 ? '<button class="btn" data-q="back">Back</button>' : '<span></span>'}
        <button class="btn primary" data-q="${last ? 'finish' : 'next'}" ${canNext ? '' : 'disabled'}>${last ? 'Let’s go' : 'Next'}</button></div>
    </div></div></div>`;
}
function quizClick(e) {
  const b = e.target.closest('[data-q]'); if (!b) return;
  const q = state.quiz, d = q.d, a = b.dataset.q, v = b.dataset.v;
  const tog = (arr, x) => arr.includes(x) ? arr.filter(y => y !== x) : [...arr, x];
  const nameEl = $('#q_name'); if (nameEl) d.name = nameEl.value.trim();
  if (a === 'close') { closeSheet(); return; }
  if (a === 'kid') d.kid = v === '1';
  else if (a === 'color') d.color = v;
  else if (a === 'sport') d.sports = tog(d.sports, v);
  else if (a === 'team') d.teams = tog(d.teams, v);
  else if (a === 'addteam') { const t = $('#q_team').value.trim(); if (t && !d.teams.includes(t)) d.teams.push(t); }
  else if (a === 'addplayer') { const t = $('#q_player').value.trim(); if (t && !d.players.includes(t)) d.players.push(t); renderQuiz(); $('#q_player')?.focus(); return; }
  else if (a === 'rmplayer') d.players = d.players.filter(x => x !== v);
  else if (a === 'goal') d.goal = v;
  else if (a === 'risk') d.risk = v;
  else if (a === 'back') { q.step--; q.filter = ''; }
  else if (a === 'next') { const pl = $('#q_player'); if (pl && pl.value.trim() && !d.players.includes(pl.value.trim())) d.players.push(pl.value.trim()); q.step++; q.filter = ''; }
  else if (a === 'finish') { finishQuiz(); return; }
  renderQuiz();
}
$('#overlay').addEventListener('change', e => { if (e.target.id === 'restorefile') { const f = e.target.files && e.target.files[0]; if (f) importData(f); } });
$('#overlay').addEventListener('input', e => {
  if (!state.quiz) return;
  if (e.target.id === 'q_name') { state.quiz.d.name = e.target.value; const nb = document.querySelector('[data-q="next"]'); if (nb) nb.disabled = !e.target.value.trim(); }
  if (e.target.id === 'q_filter') { state.quiz.filter = e.target.value; const pos = e.target.selectionStart; renderQuiz(); const f = $('#q_filter'); f.focus(); f.setSelectionRange(pos, pos); }
});
$('#overlay').addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !state.quiz) return;
  const click = sel => { e.preventDefault(); document.querySelector(sel)?.click(); };
  if (e.target.id === 'q_player') click('[data-q="addplayer"]');
  if (e.target.id === 'q_team') click('[data-q="addteam"]');
  if (e.target.id === 'q_name' && e.target.value.trim()) click('[data-q="next"]');
});
function finishQuiz() {
  const q = state.quiz, d = q.d;
  const p = { ...d, name: d.name.trim(), id: q.editId || uid(), createdAt: d.createdAt || Date.now(), updatedAt: Date.now() };
  putProfile(p); closeSheet();
  state.current = p.id; lsSet('cc_current', p.id);
  if (!q.editId) { state.tab = 'scan'; lsSet('cc_tab', 'scan'); }
  state.scan = { status: 'idle' };
  renderChrome(); renderView();
  toast(q.editId ? 'Profile updated' : `Welcome, ${p.name}!`);
}

/* ---------- update check ----------
   Home-screen apps can hang on to an old copy. On open (and whenever the app comes back to the
   foreground) fetch the live file, bypassing caches, and compare its APP_VERSION with ours. */
let updateShown = false;
async function checkForUpdate() {
  if (updateShown || location.protocol === 'file:') return;
  try {
    const resp = await fetch(location.pathname + '?check=' + Date.now(), { cache: 'no-store' });
    if (!resp.ok) return;
    const m = (await resp.text()).match(/const APP_VERSION = '([^']+)'/);
    if (!m || m[1] <= APP_VERSION) return;
    updateShown = true;
    const bar = document.createElement('button');
    bar.className = 'updatebar'; bar.type = 'button';
    bar.innerHTML = `<b>New version ready</b><span>Tap to update to ${esc(m[1])}</span>`;
    bar.onclick = () => location.replace(location.pathname + '?v=' + encodeURIComponent(m[1]));
    document.body.appendChild(bar); document.body.classList.add('has-update');
  } catch (e) { /* offline — try again next time */ }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkForUpdate(); });

/* ---------- boot ---------- */
(async function boot() {
  await IDB.open(); await IDB.loadAll();
  if (state.profiles.length && !state.profiles.some(p => p.id === state.current)) { state.current = state.profiles[0].id; lsSet('cc_current', state.current); }
  renderChrome(); renderView();
  if (!state.profiles.length) openQuiz(null, true);
  const lastV = lsGet('cc_lastVersion');
  if (lastV && lastV !== APP_VERSION) toast('Updated to version ' + APP_VERSION + ' 🎉', 4000);
  lsSet('cc_lastVersion', APP_VERSION);
  const vt = document.getElementById('vtag'); if (vt) vt.textContent = 'v' + APP_VERSION;
  if (location.search.includes('v=')) history.replaceState(null, '', location.pathname);
  checkForUpdate();
})();
</script>
