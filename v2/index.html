<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="GleefulHabit">
<meta name="theme-color" content="#ffffff">
<title>GleefulHabit 2.0</title>
<!--@@ICONS-->
<style>
:root{
  --green:#1F5F3A; --tint:#EEF3EF; --g2:#8DBE9C; --text:#1d1d1f; --muted:#6E6E73; --track:#E8E8ED; --line:#E8E8ED;
  --bad:#B3402F;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;background:#fff;color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{height:100dvh;overflow:hidden;position:fixed;inset:0;width:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea{font:inherit;color:inherit}
.num{font-family:ui-rounded,"SF Pro Rounded",-apple-system,sans-serif;font-variant-numeric:tabular-nums}

#app{height:100%;display:flex;flex-direction:column;padding-top:var(--sat);padding-bottom:calc(var(--sab) + 2px)}
#pagerWrap{flex:1;min-height:0;overflow:hidden;position:relative}
#pager{display:flex;width:200%;height:100%;transition:transform .28s cubic-bezier(.3,.7,.2,1)}
.page{width:50%;height:100%;padding:0 16px;display:flex;flex-direction:column;gap:7px;min-height:0}
.page.scrolly{overflow-y:auto;-webkit-overflow-scrolling:touch}
.dots{display:flex;justify-content:center;gap:8px;height:22px;align-items:center}
.dots button{width:44px;height:22px;display:flex;align-items:center;justify-content:center}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--track);display:block;transition:all .2s}
.dots button.on i{background:var(--green);width:18px;border-radius:4px}

.top{display:flex;align-items:center;justify-content:space-between;height:44px;flex-shrink:0}
.top h1{margin:0;font-size:21px;font-weight:700;letter-spacing:-.4px}
.top h1 span{color:var(--green)}
.icon-btn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;margin-right:-10px;border-radius:12px;color:var(--green)}
.icon-btn svg{width:24px;height:24px}

.balance{text-align:center;flex-shrink:0;padding:2px 0 0}
.balance .big{font-size:50px;font-weight:700;letter-spacing:-1.5px;color:var(--green);line-height:1.05}
.balance .lbl{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-top:1px}
.balance .sub{font-size:12.5px;color:var(--muted);margin-top:3px}

.bars{display:grid;grid-template-columns:1fr 1fr;gap:14px;flex-shrink:0}
.bar .bl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:4px}
.bar .bl b{color:var(--text);font-weight:600}
.track{height:6px;background:var(--track);border-radius:3px;overflow:hidden}
.track i{display:block;height:100%;background:var(--green);border-radius:3px;transition:width .3s}
.bar.bonus .track i{background:var(--g2)}

.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex-shrink:0}
.btn{height:44px;border-radius:12px;background:var(--tint);color:var(--green);font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:4px}
.btn:active{opacity:.7}
.btn.primary{background:var(--green);color:#fff}
.btn.quiet{background:#f4f4f6;color:var(--muted)}
.btn.danger{background:#fbeeec;color:var(--bad)}
.btn[disabled]{opacity:.4;pointer-events:none}

.habits{display:flex;flex-direction:column;gap:5px;flex-shrink:0}
.hrow{display:flex;align-items:center;gap:10px;min-height:50px;padding:3px 4px 3px 10px;border-radius:14px;background:#fafafb;border:1px solid var(--line);text-align:left;width:100%}
.hrow:active{background:var(--tint)}
.hrow .ic{width:34px;height:34px;border-radius:10px;background:var(--tint);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.hrow .mid{flex:1;min-width:0}
.hrow .nm{font-size:16px;font-weight:600;line-height:1.2}
.hrow .sb{font-size:12.5px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .st{width:30px;height:30px;flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-right:6px}
.hrow .pz{min-width:52px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;font-weight:600;flex-shrink:0;padding:0 4px}
.hrow.paused .pz{color:var(--green)}
.lg{display:inline-flex;align-items:center;gap:4px;margin-left:8px}
.lg i{width:9px;height:9px;border-radius:3px;display:inline-block}
.hrow.paused{background:#f3f3f5;color:var(--muted)}
.hrow.paused .ic{background:#e9e9ec;filter:grayscale(1);opacity:.6}
.hrow.paused .nm{color:var(--muted)}
.hrow .wb{color:var(--green);font-weight:600}
.chk{width:26px;height:26px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center}
.chk svg{width:15px;height:15px}

.cal{flex:1;min-height:0;display:flex;flex-direction:column}
.cal .ch{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px}
.cal .ch b{font-size:15px;font-weight:700}
.cal .ch span{font-size:11.5px;color:var(--muted)}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;flex:1;min-height:0;grid-auto-rows:minmax(0,1fr);max-height:240px}
.cgrid .wd{font-size:10.5px;color:var(--muted);text-align:center;font-weight:600;align-self:end;line-height:1.5}
.cgrid .c{border-radius:6px;font-size:11.5px;display:flex;align-items:center;justify-content:center;color:var(--muted);min-height:0}
.cgrid .c.full{background:var(--green);color:#fff}
.cgrid .c.part{background:var(--g2);color:#0f3320}
.cgrid .c.miss{background:var(--track);color:var(--muted)}
.cgrid .c.fut{color:#b8b8bd}
.cgrid .c.today{outline:2px solid var(--green);outline-offset:-2px;font-weight:700}
.cgrid .c.free{background:#fff;outline:1.5px dashed var(--g2);outline-offset:-1.5px}

.winsrow{flex-shrink:0;display:flex;align-items:center;gap:8px;min-height:30px;font-size:12.5px;color:var(--muted)}
.winsrow b{color:var(--text);font-weight:600;white-space:nowrap}
.winsrow .chips{display:flex;gap:5px;overflow:hidden;flex:1;min-width:0}
.winsrow .w{background:var(--tint);color:var(--green);border-radius:10px;padding:3px 8px;white-space:nowrap;font-size:12px;font-weight:600}

/* sheets + overlays */
#sheetRoot .scrim{position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:40;animation:fade .18s}
#sheetRoot .sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:#fff;border-radius:22px 22px 0 0;padding:8px 16px calc(var(--sab) + 16px);max-height:92dvh;overflow-y:auto;animation:up .24s cubic-bezier(.3,.8,.3,1)}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--track);margin:0 auto 10px}
.sheet h2{margin:0 0 4px;font-size:21px;letter-spacing:-.3px}
.sheet .hint{font-size:13px;color:var(--muted);margin:0 0 10px}
.sheet .q{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 7px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border-radius:22px;background:#f4f4f6;font-size:15px;font-weight:500;display:flex;align-items:center;justify-content:center}
.chip.on{background:var(--green);color:#fff}
.chip.sm{min-height:36px;padding:0 12px;font-size:14px}
.field{width:100%;height:48px;border-radius:12px;border:1.5px solid var(--line);padding:0 14px;font-size:17px;background:#fff;outline:none}
.field:focus{border-color:var(--green)}
textarea.field{height:76px;padding:10px 14px;resize:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sheet .btn{margin-top:14px;width:100%}
.over .body>.btn,.over .card .btn{width:100%;margin-top:10px}
.seg{display:flex;background:#f1f1f3;border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;height:36px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button[disabled]{opacity:.35}
.winsgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.winsgrid .chip{border-radius:14px;min-height:50px;font-size:14px;text-align:center;line-height:1.2;padding:6px 8px}

.over{position:fixed;inset:0;z-index:30;background:#fff;display:flex;flex-direction:column;padding-top:var(--sat);animation:slide .26s cubic-bezier(.3,.8,.3,1)}
.over .bar2{display:flex;align-items:center;height:48px;padding:0 6px;flex-shrink:0}
.over .bar2 .back{height:44px;padding:0 10px;color:var(--green);font-size:16px;font-weight:600;display:flex;align-items:center;gap:2px}
.over .bar2 h2{margin:0;flex:1;text-align:center;font-size:17px;margin-right:60px}
.over .body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 16px calc(var(--sab) + 24px)}
.card{background:#fafafb;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:15px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.keyhead{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:44px;font-size:15px}
.frow{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.frow .fa{position:absolute;right:0;top:0;bottom:0;display:flex}
.frow .fab{width:70px;color:#fff;font-weight:600;font-size:15px}
.frow .fab.e{background:var(--g2);color:#0f3320}
.frow .fab.d{background:var(--bad)}
.frow .fc{position:relative;background:#fff;transition:transform .2s;padding:10px 2px;min-height:54px}
.frow.open .fc{transform:translateX(-140px)}
.fl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fn{font-size:16px;font-weight:600}
.fv{font-size:13px;color:var(--muted);margin-top:2px}
.fv b{color:var(--text)}
.tagp{background:var(--tint);color:var(--green);border-radius:8px;padding:2px 7px;font-size:11px;font-weight:700}
.cgrid .c.fr{outline:1.5px dashed var(--g2);outline-offset:-1.5px}
.cgrid .c.today.fr{outline:2px solid var(--green)}

#toast{position:fixed;left:50%;top:calc(var(--sat) + 8px);transform:translate(-50%,-90px);background:#1d1d1f;color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;font-weight:500;z-index:99;max-width:88%;text-align:center;transition:transform .25s}
#toast.show{transform:translate(-50%,0)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
@keyframes slide{from{transform:translateX(30px);opacity:.5}to{transform:none;opacity:1}}
</style>

<body>
<div id="app"></div>
<div id="overRoot"></div>
<div id="sheetRoot"></div>
<div id="toast"></div>
<script>
/* ============================================================
   GleefulHabit 2.0 — single file, localStorage only (key: gh2).
   v1 lives at the site root and is never read-modified here.
   ============================================================ */

/* ── Constants ── */
const SCHEMA = 2;
const STORE_KEY = 'gh2';
const V1_KEY = 'habitflow';
const APP_VERSION = '2026-10-24.2300';
const HABITS = ['workout','protein','wind','sugar'];
const HABIT_META = {
  workout:{name:'Workout',icon:'🏋️'},
  protein:{name:'Protein',icon:'🍗'},
  wind:{name:'Wind down',icon:'🌙'},
  sugar:{name:'Less sugar',icon:'🍬'},
};
const PAUSABLE = ['workout','wind','sugar'];   // Protein only pauses via Sick day

/* ── Dates (all keys are local YYYY-MM-DD) ── */
const pad = n => String(n).padStart(2,'0');
const dkOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseDk = dk => { const [y,m,d] = dk.split('-').map(Number); return new Date(y, m-1, d); };
const todayKey = () => dkOf(new Date());
const addDays = (dk, n) => { const d = parseDk(dk); d.setDate(d.getDate()+n); return dkOf(d); };
const diffDays = (a, b) => Math.round((parseDk(b) - parseDk(a)) / 86400000);
const ymOf = dk => dk.slice(0,7);
const dim = ym => { const [y,m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); };
const addMonths = (ym, n) => { const [y,m] = ym.split('-').map(Number); const d = new Date(y, m-1+n, 1); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; };
const weekStart = dk => { const d = parseDk(dk); const dow = d.getDay(); d.setDate(d.getDate() + (dow === 0 ? -6 : 1 - dow)); return dkOf(d); };
const weekDays = dk => { const s = weekStart(dk); return Array.from({length:7}, (_, i) => addDays(s, i)); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

/* Logging window: today any time; yesterday until noon, then it locks. */
function canLog(dk) {
  const t = todayKey();
  if (dk === t) return true;
  if (dk === addDays(t, -1)) return new Date().getHours() < 12;
  return false;
}

/* ── State ── */
function blankState() {
  return {
    schema: SCHEMA,
    startDate: null,
    settings: { monthly:200, drip:100, pool:50, proteinGoal:150, sugarBudget:25, workoutWeek:3, freeDaysPerYear:10 },
    days: {},        // dk -> { workout, windDown, foods:[] }
    pauses: [],      // { id, habit, from, to|null, why, expect, planned, back, sick, sickId }
    freeDays: [],    // ['YYYY-MM-DD', ...] set in advance only
    spends: [],      // { id, dk, cents, cat }
    wins: [],        // { id, dk, label, other }
    weight: { unit:'lbs', goal:null, logs:{} },
    months: {},      // 'YYYY-MM' -> frozen month-close snapshot
    comeback: null,  // { from, gapDays, firstLog }
    imported: null,  // { at, from:'v1', counts }
    ui: { lastVersion:null, v1Offer:'none' },
  };
}

/* Every new field gets a default here. Shared by normal load and backup import. */
function migrateState(raw) {
  const b = blankState();
  if (!raw || typeof raw !== 'object') return b;
  const s = Object.assign(b, raw);
  s.schema = SCHEMA;
  s.settings = Object.assign(blankState().settings, raw.settings || {});
  for (const k of ['days','months']) if (!s[k] || typeof s[k] !== 'object') s[k] = {};
  for (const k of ['pauses','freeDays','spends','wins']) if (!Array.isArray(s[k])) s[k] = [];
  if (!s.weight || typeof s.weight !== 'object') s.weight = { unit:'lbs', goal:null, logs:{} };
  if (!s.weight.logs) s.weight.logs = {};
  if (!s.weight.unit) s.weight.unit = 'lbs';
  if (s.weight.goal === undefined) s.weight.goal = null;
  s.ui = Object.assign({ lastVersion:null, v1Offer:'none' }, raw.ui || {});
  if (s.comeback === undefined) s.comeback = null;
  if (s.imported === undefined) s.imported = null;
  for (const dk of Object.keys(s.days)) {
    const d = s.days[dk];
    if (!Array.isArray(d.foods)) d.foods = [];
    if (d.workout === undefined) d.workout = null;
    if (d.windDown === undefined) d.windDown = null;
  }
  return s;
}

function loadState() {
  let raw = null;
  try { raw = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch (e) { console.error('GleefulHabit: load failed', e); }
  if (raw) return migrateState(raw);
  const s = blankState();
  s.startDate = todayKey();
  try { if (localStorage.getItem(V1_KEY)) s.ui.v1Offer = 'pending'; } catch (e) {}
  return s;
}
let S = loadState();
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) {} }
function dayOf(dk) {
  if (!S.days[dk]) S.days[dk] = { workout:null, windDown:null, foods:[] };
  return S.days[dk];
}

/* ── v1 history import (optional, one time, history only — money starts fresh) ── */
function readV1() {
  try { return JSON.parse(localStorage.getItem(V1_KEY) || 'null'); } catch (e) { return null; }
}
function v1Summary(v1) {
  if (!v1 || !v1.habits) return null;
  const dks = new Set();
  for (const k of Object.keys(v1.logs || {})) dks.add(k);
  const w = Object.keys((v1.weight && v1.weight.logs) || {}).length;
  return { days: dks.size, weights: w };
}
/* Converts v1 data into `into`. Only days before 2.0's startDate are brought over. */
function importV1(v1, into) {
  const counts = { workouts:0, foods:0, weights:0, wins:0, pauses:0 };
  if (!v1 || !Array.isArray(v1.habits)) return counts;
  const start = into.startDate || todayKey();
  const hW = v1.habits.find(h => h.type !== 'numeric' && /work\s*out/i.test(h.name));
  const hP = v1.habits.find(h => h.type === 'numeric' && /protein/i.test(h.name));
  const hS = v1.habits.find(h => h.type !== 'numeric' && /sugar/i.test(h.name));
  const logs = v1.logs || {}, ents = v1.logEntries || {}, rest = v1.restDayLogs || {};
  const extras = v1.workoutExtras || {}, circuits = v1.customWorkoutLogs || {};
  const keys = new Set([...Object.keys(logs), ...Object.keys(rest), ...Object.keys(extras), ...Object.keys(circuits)]);
  let last = null;
  const dayFor = dk => { if (!into.days[dk]) into.days[dk] = { workout:null, windDown:null, foods:[] }; return into.days[dk]; };
  for (const dk of keys) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(dk) || dk >= start) continue;
    try {
      const day = dayFor(dk);
      const ex = extras[dk] || {}, circ = circuits[dk] || {};
      const hasCircuit = Object.values(circ).some(c => c && c.rounds > 0);
      const manual = hW && (logs[dk] || {})[hW.id] === true;
      if (!day.workout && (manual || ex.cycle || ex.kids || hasCircuit)) {
        day.workout = { kind:'workout', what: hasCircuit ? 'Circuit' : ex.cycle ? 'Bike' : 'Imported', imp:true };
        counts.workouts++;
      } else if (!day.workout && hW && (rest[dk] || {})[hW.id]) {
        day.workout = { kind:'rest', imp:true };
      }
      if (hP && !day.foods.length) {
        const list = (ents[dk] || {})[hP.id] || [];
        for (const e of list) {
          if (typeof e === 'number') day.foods.push({ id:uid(), label:'Manual entry', protein:e, sugar:0, src:'manual', imp:true });
          else if (e && typeof e === 'object') day.foods.push({ id:uid(), label:e.label || 'Food', protein:+e.amt || 0, sugar:+e.sugar || 0, src:'ai', imp:true });
        }
        const total = (logs[dk] || {})[hP.id];
        if (!day.foods.length && typeof total === 'number' && total > 0) day.foods.push({ id:uid(), label:'Imported total', protein:total, sugar:0, src:'manual', imp:true });
        counts.foods += day.foods.length;
      }
      if ((day.workout || day.foods.length) && (!last || dk > last)) last = dk;
    } catch (e) { console.error('v1 import: skipped', dk, e); }
  }
  const wl = (v1.weight && v1.weight.logs) || {};
  for (const [dk, val] of Object.entries(wl)) {
    if (dk < start && typeof val === 'number') { into.weight.logs[dk] = val; counts.weights++; }
  }
  if (v1.weight) {
    if (v1.weight.unit) into.weight.unit = v1.weight.unit;
    if (v1.weight.goal != null && into.weight.goal == null) into.weight.goal = v1.weight.goal;
  }
  for (const w of (v1.littleWins || [])) {
    if (w && w.dateKey && w.dateKey < start && w.text) { into.wins.push({ id:uid(), dk:w.dateKey, label:String(w.text).slice(0,80), other:true, imp:true }); counts.wins++; }
  }
  const byId = {}; if (hW) byId[hW.id] = 'workout'; if (hS) byId[hS.id] = 'sugar';
  const dayBefore = addDays(start, -1);
  for (const [hid, rs] of Object.entries(v1.habitPauseRanges || {})) {
    if (!byId[hid]) continue;
    for (const r of (rs || [])) if (r && r.from && r.to && r.from < start) { into.pauses.push({ id:uid(), habit:byId[hid], from:r.from, to:r.to < start ? r.to : dayBefore, why:'Imported', imp:true }); counts.pauses++; }
  }
  for (const [hid, p] of Object.entries(v1.habitPauses || {})) {
    if (byId[hid] && p && p.since && p.since < start) { into.pauses.push({ id:uid(), habit:byId[hid], from:p.since, to:dayBefore, why:'Imported', imp:true }); counts.pauses++; }
  }
  if (last) into.comeback = { from:last, gapDays:Math.max(0, diffDays(last, start) - 1), firstLog:null };
  into.imported = { at:todayKey(), from:'v1', counts };
  return counts;
}
function doV1Import() {
  const v1 = readV1();
  const counts = importV1(v1, S);
  S.ui.v1Offer = 'done';
  save();
  return counts;
}
function skipV1Import() { S.ui.v1Offer = 'done'; save(); }

/* ── Habit engine: one function says what a habit's day looks like ── */

      <div class="sub">${money(m.unlockedC)} of $150 unlocked · ${money(m.spentC)} spent</div></div>
    <div class="bars">
      <div class="bar"><div class="bl"><span>Daily</span><b class="num">${money(m.dripC)} / $100</b></div><div class="track"><i style="width:${Math.min(100, m.dripC / m.dripPotC * 100)}%"></i></div></div>
      <div class="bar bonus"><div class="bl"><span>Bonus</span><b class="num">${money(m.bonusC)} / $50</b></div><div class="track"><i style="width:${Math.min(100, m.bonusC / m.poolC * 100)}%"></i></div></div>

function weightHTML() {

let OV = null;   // which full-screen page is open: 'protein' | 'history' | null
function render() {

function refresh() {

function onHabitTap(id) {
  const s = habitState(id, todayKey());
  if (s.st === 'paused') return onPauseTap(id);

/* ── Sheets ── */
let SH = null;
function openSheet(inner, inPlace) {
  const root = $('sheetRoot');
  const sh = inPlace && root.querySelector ? root.querySelector('.sheet') : null;
  if (sh) { sh.innerHTML = `<div class="grab"></div>${inner}`; return; }
  root.innerHTML = `<div class="scrim" onclick="closeSheet()"></div><div class="sheet"><div class="grab"></div>${inner}</div>`;
}
function closeSheet() { SH = null; $('sheetRoot').innerHTML = ''; }
function daySeg(dk, fn) {
  const t = todayKey(), y = addDays(t, -1), yok = canLog(y);
  return `<div class="seg"><button class="${dk === t ? 'on' : ''}" onclick="${fn}('${t}')">Today</button><button class="${dk === y ? 'on' : ''}" ${yok ? '' : 'disabled'} onclick="${fn}('${y}')">Yesterday${yok ? '' : ' · locked'}</button></div>`;
}
function chipsHTML(opts, sel, fn, multi) {
  return `<div class="chips">${opts.map((o, i) => {
    const on = multi ? sel.includes(o) : sel === o;
    return `<button class="chip ${on ? 'on' : ''}" onclick="${fn}(${i})">${esc(o)}</button>`;
  }).join('')}</div>`;
}

const WORKOUT_WHAT = ['Circuit','Kettlebell','Bike','Slack board','Yoga','Walk/Run'];
const WORKOUT_LEN = ['<20m','20–40','40–60','60+'];

function wkPick_len(i) { SH.len = WORKOUT_LEN[i]; renderWorkoutSheet(true); }
function wkPick_hard(i) { SH.hard = WORKOUT_HARD[i]; renderWorkoutSheet(true); }

const WIND_WHAT = ['Reading','Phone puzzle','Meditation','Plan tomorrow','LEGO','Puzzle with wife'];

function wdPick_what(i) { const v = WIND_WHAT[i], a = SH.what, k = a.indexOf(v); if (k >= 0) a.splice(k, 1); else a.push(v); renderWindSheet(true); }

function wdSave() { if (SH.what.length && SH.len && SH.lights && logWind(SH.dk, { what:SH.what, len:SH.len, lights:SH.lights })) { closeSheet(); toast('Wind-down logged' + earnedTxt()); } }

/* ── Protein page ── */
let protDay = null, aiMode = null, aiPhoto = null, keyOpen = false;
function openProtein() { OV = 'protein'; protDay = todayKey(); aiMode = null; aiPhoto = null; renderProteinOver(); }
function closeOver() { OV = null; $('overRoot').innerHTML = ''; }
function protDaySet(dk) { protDay = dk; renderProteinOver(); }
function foodRowHTML(f) {
  const tag = isHPLS(f) ? `<span class="tagp">High protein, low sugar</span>` : '';
  return `<div class="frow"><div class="fa"><button class="fab e" onclick="openFoodEdit('${f.id}')">Edit</button><button class="fab d" onclick="delFood('${f.id}')">Delete</button></div>
    <div class="fc" ontouchstart="fsStart(event)" ontouchmove="fsMove(event)" ontouchend="fsEnd(event,this)" onclick="fsTap(this,'${f.id}')">
      <div class="fl"><div class="fn">${esc(f.label)}</div>${tag}</div>
      <div class="fv num"><b>${f.protein} g</b> protein<span> · ${f.sugar || 0} g added sugar</span></div></div></div>`;
}
let _fsx = 0, _fsMoved = false;
function fsStart(e) { _fsx = e.touches[0].clientX; _fsMoved = false; }
function fsMove(e) { if (Math.abs(e.touches[0].clientX - _fsx) > 8) _fsMoved = true; }
function fsEnd(e, el) { const dx = e.changedTouches[0].clientX - _fsx; if (dx < -50) el.parentNode.classList.add('open'); else if (dx > 30) el.parentNode.classList.remove('open'); }
function fsTap(el, id) { if (_fsMoved) { _fsMoved = false; return; } if (el.parentNode.classList.contains('open')) { el.parentNode.classList.remove('open'); return; } openFoodEdit(id); }
function keyCardHTML() {
  const has = !!localStorage.getItem('gh_ai_key');
  return `<div class="card"><button class="keyhead" onclick="toggleKey()"><b>AI key</b><span class="muted small">${has ? 'Set' : 'Not set'} ${keyOpen ? '▲' : '▼'}</span></button>${keyOpen ? `
    <input class="field" id="keyInput" type="password" placeholder="Anthropic API key" autocomplete="off" style="margin-top:8px">
    <button class="btn" onclick="saveKey()">Save key</button>${has ? `<button class="btn quiet" onclick="clearKey()">Remove key</button>` : ''}
    <p class="small muted" style="margin:10px 0 0">Stays on this device only — never in backups. Uses your own Anthropic billing.</p>` : ''}</div>`;
}
function toggleKey() { keyOpen = !keyOpen; renderProteinOver(); }
function saveKey() { const v = ($('keyInput').value || '').trim(); if (!v) return; localStorage.setItem('gh_ai_key', v); keyOpen = false; renderProteinOver(); toast('Key saved'); }
function clearKey() { localStorage.removeItem('gh_ai_key'); renderProteinOver(); toast('Key removed'); }
function proteinOverHTML() {
  const dk = protDay, g = S.settings.proteinGoal, n = proteinOn(dk), st = habitState('protein', dk);
  const sg = sugarOn(dk), b = S.settings.sugarBudget, can = canLog(dk), foods = foodsOn(dk);
  const col = n >= g ? '#1F5F3A' : n >= smallAt() ? '#8DBE9C' : '#1F5F3A';
  const chips = quickChips(8);
  const note = n >= g ? 'Goal reached' : n >= smallAt() ? `Small win · ${round1(g - n)} g to full` : `Small at ${smallAt()} g · full at ${g} g`;
  return `<div class="bar2"><button class="back" onclick="closeOver()">‹ Today</button><h2>Protein</h2></div>
  <div class="body">
    ${daySeg(dk, 'protDaySet')}
    ${st.st === 'paused' ? `<div class="card" style="margin-top:12px"><b>Protein is paused</b><div class="small muted">Sick day. Log anything and it resumes.</div></div>` : ''}
    <div style="display:flex;flex-direction:column;align-items:center;margin:14px 0 6px;position:relative">
      <div style="position:relative;width:176px;height:176px">${ringSVG(Math.min(1, n / g), 176, 15, col, '#E8E8ED')}
        <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center"><div class="num" style="font-size:46px;font-weight:700;color:var(--green);line-height:1">${n}</div><div class="muted small">of ${g} g</div></div></div>
      <div class="small muted" style="margin-top:6px">${note}</div>
    </div>
    <div class="card" style="padding:10px 14px"><div style="display:flex;justify-content:space-between" class="small"><b>Added sugar</b><span class="num" style="color:${sg > b ? 'var(--bad)' : 'var(--muted)'}">${sg} / ${b} g</span></div>
      <div class="track" style="margin-top:6px"><i style="width:${Math.min(100, sg / b * 100)}%;background:${sg > b ? 'var(--bad)' : 'var(--g2)'}"></i></div></div>
    ${can ? `
    <div class="row2">
      <label class="btn primary" style="margin:0">Snap meal<input type="file" accept="image/*" id="snapFile" style="display:none" onchange="onSnap(event)"></label>
      <button class="btn primary" style="margin:0" onclick="onSayIt()">Say it</button>
    </div>
    ${aiMode ? `<div class="card" style="margin-top:10px">
      ${aiPhoto ? `<img src="${aiPhoto.url}" alt="" style="width:100%;max-height:150px;object-fit:cover;border-radius:12px;margin-bottom:8px">` : ''}
      <textarea class="field" id="aiText" placeholder="Say or type what you ate. Tip: tap the mic on your keyboard to dictate."></textarea>
      <button class="btn primary" id="aiBtn" onclick="analyzeMeal()">Estimate protein + sugar</button>
      <div class="small muted" id="aiStatus" style="margin-top:8px;min-height:16px"></div></div>` : ''}
    <div class="q" style="font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:16px 0 7px">Add</div>
    ${chips.length ? `<div class="chips" style="margin-bottom:10px">${chips.map((c, i) => `<button class="chip sm" onclick="quickAdd(${i})">${esc(c.label)} · ${c.protein}g</button>`).join('')}</div>` : ''}
    <input class="field" id="fLabel" placeholder="What was it? (optional)" style="margin-bottom:8px">
    <div class="row2"><input class="field num" id="fProt" type="number" inputmode="decimal" placeholder="Protein g"><input class="field num" id="fSugar" type="number" inputmode="decimal" placeholder="Added sugar g"></div>
    <button class="btn primary" onclick="manualAdd()">Add</button>` : `<p class="muted small" style="text-align:center">This day is locked.</p>`}
    <div class="q" style="font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:18px 0 6px">Food ${dk === todayKey() ? 'today' : 'yesterday'}</div>
    ${foods.length ? foods.map(foodRowHTML).join('') : `<p class="muted small">Nothing logged yet.</p>`}
    <div style="height:14px"></div>${keyCardHTML()}
  </div>`;
}
function renderProteinOver() { $('overRoot').innerHTML = `<div class="over">${proteinOverHTML()}</div>`; }
function quickAdd(i) { const c = quickChips(8)[i]; if (c && addFood(protDay, { label:c.label, protein:c.protein, sugar:c.sugar, src:'chip' })) toast(`+${c.protein} g · ${c.label}${earnedTxt()}`); }
function manualAdd() {
  const p = parseFloat($('fProt').value), sg = parseFloat($('fSugar').value) || 0;
  if (!(p > 0)) { toast('Enter the protein grams'); return; }
  if (addFood(protDay, { label:$('fLabel').value.trim() || 'Manual entry', protein:p, sugar:sg, src:'manual' })) toast(`+${p} g protein${earnedTxt()}`);
}
function delFood(id) { if (deleteFood(protDay, id)) toast('Entry deleted'); }
function openFoodEdit(id) {
  const f = foodsOn(protDay).find(x => x.id === id); if (!f) return;
  SH = { kind:'food', id };
  openSheet(`<h2>Edit entry</h2>
    <div class="q">Name</div><input class="field" id="eLabel" value="${esc(f.label)}">
    <div class="row2"><div><div class="q">Protein g</div><input class="field num" id="eProt" type="number" inputmode="decimal" value="${f.protein}"></div>
    <div><div class="q">Added sugar g</div><input class="field num" id="eSugar" type="number" inputmode="decimal" value="${f.sugar || 0}"></div></div>
    <button class="btn primary" onclick="saveFoodEdit()">Save</button>
    <button class="btn danger" onclick="delFoodFromSheet()">Delete entry</button>`);
}
function saveFoodEdit() {
  const p = parseFloat($('eProt').value);
  if (!(p > 0)) { toast('Protein must be above 0'); return; }
  if (updateFood(protDay, SH.id, { label:$('eLabel').value.trim(), protein:p, sugar:parseFloat($('eSugar').value) || 0 })) { closeSheet(); toast('Saved'); }
}
function delFoodFromSheet() { const id = SH.id; closeSheet(); delFood(id); }

/* AI meal estimate: photo and/or description -> Claude Haiku with the user's own key.
   It only fills the fields for review; it never adds anything on its own. */
function onSayIt() { aiMode = 'say'; renderProteinOver(); setTimeout(() => { const t = $('aiText'); if (t) t.focus(); }, 60); }
function fileToJpeg(file, max) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = reject;
    fr.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const sc = Math.min(1, (max || 1280) / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        const url = c.toDataURL('image/jpeg', .82);
        resolve({ b64:url.split(',')[1], type:'image/jpeg', url });
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
async function onSnap(ev) {
  const file = ev.target.files && ev.target.files[0]; if (!file) return;
  try { aiPhoto = await fileToJpeg(file, 1280); aiMode = 'snap'; renderProteinOver(); }
  catch (e) { toast("Couldn't read that photo"); }
}
const AI_SYSTEM = 'You are a nutrition estimator inside a habit tracking app. Given a text description and/or photo of a food or meal, estimate its protein in grams and its ADDED sugar in grams (the FDA nutrition-label "Added Sugars" line: sugar or syrup added during processing, NOT total sugars; naturally occurring sugar such as lactose in plain milk or yogurt and fructose in whole fruit counts as 0 unless the product is also sweetened). Respond ONLY with a JSON object, no markdown fences, no other text: {"food":"short name","grams_protein":number,"added_sugar_g":number,"confidence":"low"|"medium"|"high"}. If several items are shown, sum them and name the meal generically.';
async function analyzeMeal() {
  const key = localStorage.getItem('gh_ai_key'), st = $('aiStatus'), btn = $('aiBtn');
  if (!key) { st.textContent = 'Add your Anthropic API key below first.'; return; }
  const desc = ($('aiText').value || '').trim();
  if (!desc && !aiPhoto) { st.textContent = 'Say or type what you ate, or snap a photo first.'; return; }
  btn.disabled = true; st.textContent = 'Estimating…';
  try {
    const content = [];
    if (aiPhoto) content.push({ type:'image', source:{ type:'base64', media_type:aiPhoto.type, data:aiPhoto.b64 } });
    content.push({ type:'text', text:desc ? `Food description: ${desc}` : 'Estimate the protein and added sugar of the food in this photo.' });
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{ 'content-type':'application/json', 'x-api-key':key, 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true' },
      body:JSON.stringify({ model:'claude-haiku-4-5-20251001', max_tokens:300, system:AI_SYSTEM, messages:[{ role:'user', content }] }),
    });
    if (!resp.ok) { st.textContent = resp.status === 401 ? 'API key rejected — check it below.' : `Request failed (${resp.status}). Try again.`; btn.disabled = false; return; }
    const data = await resp.json();
    const block = (data.content || []).find(b => b.type === 'text');
    if (!block) { st.textContent = 'No answer came back — try again.'; btn.disabled = false; return; }
    let parsed; try { parsed = JSON.parse(block.text.replace(/```json|```/g, '').trim()); } catch (e) { st.textContent = "Couldn't read that estimate — try rephrasing."; btn.disabled = false; return; }
    const prot = round1(+parsed.grams_protein || 0);
    if (!(prot > 0)) { st.textContent = "Couldn't estimate protein for that — add more detail."; btn.disabled = false; return; }
    $('fLabel').value = String(parsed.food || '').slice(0, 60);
    $('fProt').value = prot;
    $('fSugar').value = round1(Math.max(0, +parsed.added_sugar_g || 0));
    st.textContent = `Estimate (${parsed.confidence || 'medium'} confidence). Check the numbers below, then tap Add.`;
    btn.disabled = false;
  } catch (e) {
    st.textContent = 'Network problem — check your connection and try again.'; btn.disabled = false;
  }
}
