<style>
:root{
  --green:#1F5F3A; --tint:#EEF3EF; --g2:#8DBE9C; --text:#1d1d1f; --muted:#6E6E73; --track:#E8E8ED; --line:#E8E8ED;
  --bad:#B3402F;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;background:#fff;color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{height:100dvh;overflow:hidden;position:fixed;inset:0;width:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea{font:inherit;color:inherit}
.num{font-family:ui-rounded,"SF Pro Rounded",-apple-system,sans-serif;font-variant-numeric:tabular-nums}

#app{height:100%;display:flex;flex-direction:column;padding-top:var(--sat);padding-bottom:calc(var(--sab) + 2px)}
#pagerWrap{flex:1;min-height:0;overflow:hidden;position:relative}
#pager{display:flex;width:200%;height:100%;transition:transform .28s cubic-bezier(.3,.7,.2,1)}
.page{width:50%;height:100%;padding:0 16px;display:flex;flex-direction:column;gap:7px;min-height:0}
.page.scrolly{overflow-y:auto;-webkit-overflow-scrolling:touch}
.dots{display:flex;justify-content:center;gap:8px;height:44px;align-items:center}
.dots button{width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--track);display:block;transition:all .2s}
.dots button.on i{background:var(--green);width:18px;border-radius:4px}

.top{display:flex;align-items:center;justify-content:space-between;height:44px;flex-shrink:0}
.top h1{margin:0;font-size:21px;font-weight:700;letter-spacing:-.4px}
.top h1 span{color:var(--green)}
.icon-btn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;margin-right:-10px;border-radius:12px;color:var(--green)}
.icon-btn svg{width:24px;height:24px}

.balance{text-align:center;flex-shrink:0;padding:2px 0 0}
.balance .big{font-size:50px;font-weight:700;letter-spacing:-1.5px;color:var(--green);line-height:1.05}
.balance .lbl{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-top:1px}
.balance .sub{font-size:12.5px;color:var(--muted);margin-top:3px}

.bars{display:grid;grid-template-columns:1fr 1fr;gap:14px;flex-shrink:0}
.bar .bl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:4px}
.bar .bl b{color:var(--text);font-weight:600}
.track{height:6px;background:var(--track);border-radius:3px;overflow:hidden}
.track i{display:block;height:100%;background:var(--green);border-radius:3px;transition:width .3s}
.bar.bonus .track i{background:var(--g2)}

.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex-shrink:0}
.btn{height:44px;border-radius:12px;background:var(--tint);color:var(--green);font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:4px}
.btn:active{opacity:.7}
.btn.primary{background:var(--green);color:#fff}
.btn.quiet{background:#f4f4f6;color:var(--muted)}
.btn.danger{background:#fbeeec;color:var(--bad)}
.btn[disabled]{opacity:.4;pointer-events:none}

.habits{display:flex;flex-direction:column;gap:5px;flex-shrink:0}
.hrow{display:flex;align-items:center;gap:10px;min-height:50px;padding:3px 4px 3px 10px;border-radius:14px;background:#fafafb;border:1px solid var(--line);text-align:left;width:100%}
.hrow:active{background:var(--tint)}
.hrow .ic{width:34px;height:34px;border-radius:10px;background:var(--tint);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.hrow .mid{flex:1;min-width:0}
.hrow .nm{font-size:16px;font-weight:600;line-height:1.2}
.hrow .sb{font-size:12.5px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .st{width:30px;height:30px;flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-right:6px}
.hrow .pz{min-width:52px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;font-weight:600;flex-shrink:0;padding:0 4px}
.hrow.paused .pz{color:var(--green)}
.lg{display:inline-flex;align-items:center;gap:4px;margin-left:8px}
.lg i{width:9px;height:9px;border-radius:3px;display:inline-block}
.hrow.paused{background:#f3f3f5;color:var(--muted)}
.hrow.paused .ic{background:#e9e9ec;filter:grayscale(1);opacity:.6}
.hrow.paused .nm{color:var(--muted)}
.hrow .wb{color:var(--green);font-weight:600}
.chk{width:26px;height:26px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center}
.chk svg{width:15px;height:15px}

.cal{flex:1;min-height:0;display:flex;flex-direction:column}
.cal .ch{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px}
.cal .ch b{font-size:15px;font-weight:700}
.cal .ch span{font-size:11.5px;color:var(--muted)}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;flex:1;min-height:0;grid-auto-rows:minmax(0,1fr);max-height:240px}
.cgrid .wd{font-size:10.5px;color:var(--muted);text-align:center;font-weight:600;align-self:end;line-height:1.5}
.cgrid .c{border-radius:6px;font-size:11.5px;display:flex;align-items:center;justify-content:center;color:var(--muted);min-height:0}
.cgrid .c.full{background:var(--green);color:#fff}
.cgrid .c.part{background:var(--g2);color:#0f3320}
.cgrid .c.miss{background:var(--track);color:var(--muted)}
.cgrid .c.pz{background:var(--tint);color:var(--muted);box-shadow:inset 0 0 0 1px #d9e6dd}
.cgrid .c.fut{color:#b8b8bd}
.cgrid .c.today{outline:2px solid var(--green);outline-offset:1px;font-weight:700}
.cgrid .c.free{background:#fff;outline:1.5px dashed var(--g2);outline-offset:-1.5px}

.winsrow{flex-shrink:0;display:flex;align-items:center;gap:8px;min-height:30px;font-size:12.5px;color:var(--muted)}
.winsrow b{color:var(--text);font-weight:600;white-space:nowrap}
.winsrow .chips{display:flex;flex-wrap:nowrap;gap:5px;overflow:hidden;flex:1;min-width:0}

<body>
<div id="app"></div>
<div id="overRoot"></div>
<div id="sheetRoot"></div>
<div id="toast"></div>
<script>
/* ============================================================
   GleefulHabit 2.0 — single file, localStorage only (key: gh2).
   v1 lives at the site root and is never read-modified here.
   ============================================================ */

/* ── Constants ── */
const SCHEMA = 2;
const STORE_KEY = 'gh2';
const V1_KEY = 'habitflow';
const APP_VERSION = '2026-10-27.1545';
const HABITS = ['workout','protein','wind','sugar'];
const SUGAR_CUTOFF_HOUR = 22;   // Less sugar settles (shows checked, pays) at 10pm instead of waiting for midnight
const HABIT_META = {
  workout:{name:'Workout',icon:'🏋️'},
  protein:{name:'Protein',icon:'🍗'},
  wind:{name:'Wind down',icon:'🌙'},
  sugar:{name:'Less sugar',icon:'🍬'},
};
const PAUSABLE = ['workout','wind','sugar'];   // Protein only pauses via Sick day

/* ── Dates (all keys are local YYYY-MM-DD) ── */
const pad = n => String(n).padStart(2,'0');
const dkOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseDk = dk => { const [y,m,d] = dk.split('-').map(Number); return new Date(y, m-1, d); };
const todayKey = () => dkOf(new Date());
const addDays = (dk, n) => { const d = parseDk(dk); d.setDate(d.getDate()+n); return dkOf(d); };
const diffDays = (a, b) => Math.round((parseDk(b) - parseDk(a)) / 86400000);
const ymOf = dk => dk.slice(0,7);
const dim = ym => { const [y,m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); };
const addMonths = (ym, n) => { const [y,m] = ym.split('-').map(Number); const d = new Date(y, m-1+n, 1); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; };
const weekStart = dk => { const d = parseDk(dk); const dow = d.getDay(); d.setDate(d.getDate() + (dow === 0 ? -6 : 1 - dow)); return dkOf(d); };
const weekDays = dk => { const s = weekStart(dk); return Array.from({length:7}, (_, i) => addDays(s, i)); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

/* Logging window: today any time; yesterday until noon, then it locks. */
function canLog(dk) {
  const t = todayKey();
  if (dk === t) return true;
  if (dk === addDays(t, -1)) return new Date().getHours() < 12;
  return false;
}

/* ── State ── */
/* Grocery aisles (store order). Defined up here because migrateState runs before the rest of the script. */
const AISLES = ['Produce', 'Protein', 'Dairy', 'Grains & bread', 'Canned & dry', 'Frozen', 'Other'];
const GROCERY_MAX = 150;
let _groceryDirty = false;   // the list changed inside a sheet: redraw the Weight page card when the sheet closes
/* Cached "Why rough?" fixes: only valid dates from the last 14 days, text trimmed, at most 2 fixes a day. */
function cleanInsights(raw) {
  const out = {}; if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return out;
  const cut = addDays(todayKey(), -14);
  for (const dk of Object.keys(raw)) {
    const e = raw[dk];
    if (!/^\d{4}-\d{2}-\d{2}$/.test(dk) || dk < cut || !e || typeof e !== 'object' || !Array.isArray(e.fixes)) continue;
    const fixes = e.fixes.map(f => f && typeof f === 'object' && typeof f.text === 'string' && f.text.trim() ? { text:f.text.trim().slice(0, 160), savedMealId:typeof f.savedMealId === 'string' && f.savedMealId ? f.savedMealId.slice(0, 40) : null } : null).filter(Boolean).slice(0, 2);
    if (fixes.length) out[dk] = { fixes, generatedAt:+e.generatedAt || 0 };
  }
  return out;
}
function cleanAisle(a) { const x = String(a == null ? '' : a).trim().toLowerCase(); return AISLES.find(n => n.toLowerCase() === x) || null; }
/* The seeded saved meal starts unscored (result:null); the first tap scores it once and caches it. */
function seedMeals() {
  return [{ id:'seed-breakfast', name:'Usual breakfast', desc:'2 eggs, ½ cup egg whites, 2 tbsp cottage cheese, scrambled with olive oil spray', result:null, uses:0, lastUsed:null }];
}
function blankState() {
  return {
    schema: SCHEMA,
    startDate: null,
    settings: { monthly:200, drip:100, pool:50, proteinGoal:150, sugarBudget:25, workoutWeek:3, freeDaysPerYear:10, fiberGoal:30, satFatGoal:18, satFatV:1 },
    days: {},        // dk -> { workout, windDown, foods:[] }
    pauses: [],      // { id, habit, from, to|null, why, expect, planned, back, sick, sickId }
    freeDays: [],    // ['YYYY-MM-DD', ...] set in advance only
    spends: [],      // { id, dk, cents, cat }
    wins: [],        // { id, dk, label, other }
    savedMeals: seedMeals(),   // Meal Check: { id, name, desc?, result|null, uses, lastUsed }
    groceryList: [],  // { id, item, amount, aisle, count, checked, addedTs } (Weight page + Meal Check + Meal ideas)
    recentSuggestions: [],   // Meal ideas shown in the last 7 days: { name, ts }
    dayInsights: {},         // 'Why was my day rough?' fixes cached per day (last 14 days): { 'YYYY-MM-DD': { fixes:[{text, savedMealId|null}], generatedAt } }
    mealChecks: [],  // Meal Check history (last 365 days): { id, date, ts, mealName, verdict, protein_g, added_sugar_g, fiber_g, sat_fat_g, logged }
    weight: { unit:'lbs', goal:null, logs:{} },
    months: {},      // 'YYYY-MM' -> frozen month-close snapshot
    comeback: null,  // { from, gapDays, firstLog }
    imported: null,  // { at, from:'v1', counts }
    ui: { lastVersion:null, v1Offer:'none' },
  };
}

/* Every new field gets a default here. Shared by normal load and backup import. */
function migrateState(raw) {
  const b = blankState();
  if (!raw || typeof raw !== 'object') return b;
  const s = Object.assign(b, raw);
  s.schema = SCHEMA;
  s.settings = Object.assign(blankState().settings, raw.settings || {});
  for (const k of ['days','months']) if (!s[k] || typeof s[k] !== 'object') s[k] = {};
  for (const k of ['pauses','freeDays','spends','wins']) if (!Array.isArray(s[k])) s[k] = [];
  if (!s.weight || typeof s.weight !== 'object') s.weight = { unit:'lbs', goal:null, logs:{} };
  if (!s.weight.logs) s.weight.logs = {};
  if (!s.weight.unit) s.weight.unit = 'lbs';
  if (s.weight.goal === undefined) s.weight.goal = null;
  s.ui = Object.assign({ lastVersion:null, v1Offer:'none' }, raw.ui || {});
  if (s.comeback === undefined) s.comeback = null;
  if (s.imported === undefined) s.imported = null;
  for (const k of ['fiberGoal', 'satFatGoal']) if (!(+s.settings[k] > 0)) s.settings[k] = blankState().settings[k];
  if (!(raw.settings && raw.settings.satFatV)) { if (+s.settings.satFatGoal === 13) s.settings.satFatGoal = 18; s.settings.satFatV = 1; }   // the old 13 g default became 18 g, once; a limit you set yourself is kept
  s.savedMeals = Array.isArray(raw.savedMeals) ? raw.savedMeals.filter(m => m && typeof m === 'object' && m.id && typeof m.name === 'string')
    : seedMeals();                                   // an old save gets the seeded meal; a deliberately emptied list stays empty
  s.savedMeals.forEach(m => { m.uses = +m.uses || 0; if (m.result === undefined) m.result = null; });
  if (!Array.isArray(s.mealChecks)) s.mealChecks = [];
  if (!Array.isArray(raw.groceryList) && Array.isArray(raw.shoppingList)) s.groceryList = raw.shoppingList.map(x => x && typeof x === 'object' && x.id && typeof x.text === 'string' ? { id:x.id, item:x.text, amount:'', aisle:'Other', count:1, checked:!!x.done, addedTs:+x.added || 0 } : null);   // the first flat list becomes the aisle list
  delete s.shoppingList;
  s.groceryList = (Array.isArray(s.groceryList) ? s.groceryList : []).filter(x => x && typeof x === 'object' && x.id && typeof x.item === 'string' && x.item.trim())
    .map(x => ({ id:String(x.id), item:x.item.trim().slice(0, 60), amount:typeof x.amount === 'string' ? x.amount.slice(0, 30) : '', aisle:cleanAisle(x.aisle) || 'Other', count:Math.min(99, Math.max(1, Math.round(+x.count) || 1)), checked:!!x.checked, addedTs:+x.addedTs || 0 })).slice(-GROCERY_MAX);
  { const cut = Date.now() - 7 * 864e5; s.recentSuggestions = (Array.isArray(s.recentSuggestions) ? s.recentSuggestions : []).filter(x => x && typeof x.name === 'string' && x.name && +x.ts >= cut).map(x => ({ name:x.name.slice(0, 60), ts:+x.ts })).slice(-60); }
  s.dayInsights = cleanInsights(s.dayInsights);
  { const cut = addDays(todayKey(), -365); s.mealChecks = s.mealChecks.filter(c => c && typeof c === 'object' && c.date >= cut); }
  for (const dk of Object.keys(s.days)) {
    const d = s.days[dk];
    if (!Array.isArray(d.foods)) d.foods = [];
    for (const f of d.foods) if (f && typeof f === 'object') for (const k of ['fiber', 'satFat']) if (k in f && !(typeof f[k] === 'number' && isFinite(f[k]) && f[k] >= 0)) delete f[k];
    if (d.workout === undefined) d.workout = null;
    if (d.windDown === undefined) d.windDown = null;
  }
  return s;
}

function loadState() {
  let raw = null;
  try { raw = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch (e) { console.error('GleefulHabit: load failed', e); }
  if (raw) return migrateState(raw);
  const s = blankState();
  s.startDate = todayKey();
  try { if (localStorage.getItem(V1_KEY)) s.ui.v1Offer = 'pending'; } catch (e) {}
  return s;
}
let S = loadState();
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) {} }
function dayOf(dk) {
  if (!S.days[dk]) S.days[dk] = { workout:null, windDown:null, foods:[] };
  return S.days[dk];
}

/* ── v1 history import (optional, one time, history only — money starts fresh) ── */
function readV1() {
  try { return JSON.parse(localStorage.getItem(V1_KEY) || 'null'); } catch (e) { return null; }
}
function v1Summary(v1) {

/* AI meal estimate: photo and/or description -> Claude Haiku with the user's own key.

function onSayIt() { aiMode = 'say'; renderProteinOver(); setTimeout(() => { const t = $('aiText'); if (t) t.focus(); }, 60); }
function fileToJpeg(file, max, quality) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = reject;
    fr.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const sc = Math.min(1, (max || 1280) / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        const url = c.toDataURL('image/jpeg', quality || .82);
        resolve({ b64:url.split(',')[1], type:'image/jpeg', url });
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
async function onSnap(ev) {
  const file = ev.target.files && ev.target.files[0]; if (!file) return;
  try { aiPhoto = await fileToJpeg(file, 1280); aiMode = 'snap'; renderProteinOver(); }
  catch (e) { toast("Couldn't read that photo"); }
}
const AI_SYSTEM = 'You are a nutrition estimator inside a habit tracking app. Given a text description and/or photo of a food or meal, estimate its protein in grams, its ADDED sugar in grams (the FDA nutrition-label "Added Sugars" line: sugar or syrup added during processing, NOT total sugars; naturally occurring sugar such as lactose in plain milk or yogurt and fructose in whole fruit counts as 0 unless the product is also sweetened), its dietary fiber in grams, and its saturated fat in grams. Respond ONLY with a JSON object, no markdown fences, no other text: {"food":"short name","grams_protein":number,"added_sugar_g":number,"fiber_g":number,"sat_fat_g":number,"confidence":"low"|"medium"|"high"}. If you cannot estimate fiber or saturated fat, use null for that field rather than 0. If several items are shown, sum them and name the meal generically.';
async function analyzeMeal() {
  const st = $('aiStatus'), btn = $('aiBtn');
  if (!localStorage.getItem('gh_ai_key')) { st.textContent = 'Add your Anthropic API key below first.'; return; }
  const desc = ($('aiText').value || '').trim();
  if (!desc && !aiPhoto) { st.textContent = 'Say or type what you ate, or snap a photo first.'; return; }
  btn.disabled = true; st.textContent = 'Estimating…';
  const content = [];
  if (aiPhoto) content.push({ type:'image', source:{ type:'base64', media_type:aiPhoto.type, data:aiPhoto.b64 } });
  content.push({ type:'text', text:desc ? `Food description: ${desc}` : 'Estimate the protein, added sugar, fiber and saturated fat of the food in this photo.' });
  const r = await callClaude({ system:AI_SYSTEM, content, max_tokens:300 });
  btn.disabled = false;
  if (r.err) { st.textContent = aiErrText(r); return; }
  let parsed; try { parsed = JSON.parse(r.text.replace(/```json|```/g, '').trim()); } catch (e) { st.textContent = "Couldn't read that estimate — try rephrasing."; return; }
  const prot = round1(+parsed.grams_protein || 0);
  if (!(prot > 0)) { st.textContent = "Couldn't estimate protein for that — add more detail."; return; }
  $('fLabel').value = String(parsed.food || '').slice(0, 60);
  $('fProt').value = prot;
  $('fSugar').value = round1(Math.max(0, +parsed.added_sugar_g || 0));
  const fb = optNum(parsed.fiber_g), sf = optNum(parsed.sat_fat_g);   // null / missing stays blank = unknown, never 0
  $('fFiber').value = fb === undefined ? '' : fb; $('fSat').value = sf === undefined ? '' : sf;
  st.textContent = `Estimate (${parsed.confidence || 'medium'} confidence). Check the numbers below, then tap Add.`;
}

async function mcRun() {

  else content = [{ type:'text', text:`Meal: ${(me.source === 'saved' ? me.desc : me.text).trim()}` }];

  me.busy = false;

function onPauseTap(id) {
  const s = habitState(id, todayKey());
  if (s.st === 'paused') { const offer = welcomeOfferC(id); resumeHabit(id); toast(offer ? `Resumed — log it to claim +${money(offer)}` : `${HABIT_META[id].name} resumed`); return; }
  if (!PAUSABLE.includes(id)) return;
  if (s.st === 'free') { toast('Today is a free day'); return; }
  if (s.logged) { toast(`${HABIT_META[id].name} is already logged today`); return; }

      <button class="chip ${SH.other ? 'on' : ''}" onclick="winOther()">Other…</button></div>
    ${SH.other ? `<input class="field" id="winText" maxlength="80" placeholder="What was it?" style="margin-top:10px" value="${esc(keep)}"><button class="btn primary" onclick="winSaveOther()">Add win</button>` : ''}`, inPlace);
}
function winDaySet(dk) { SH.dk = dk; renderWinSheet(true); }
function winPick(i) { if (addWin(SH.dk, WIN_PRESETS[i], false)) { closeSheet(); toast('Win logged'); } }
function winOther() { SH.other = true; renderWinSheet(true); setTimeout(() => { const t = $('winText'); if (t) t.focus(); }, 60); }
function winSaveOther() { if (addWin(SH.dk, $('winText').value, true)) { closeSheet(); toast('Win logged'); } }

/* ── Weight page (left of Today) ── */
const fmtShort = dk => parseDk(dk).toLocaleDateString('en-US', { month:'short', day:'numeric' });
const monthName = ym => { const [y, m] = ym.split('-').map(Number); return new Date(y, m - 1, 1).toLocaleDateString('en-US', { month:'long', year:'numeric' }); };
function weightChartHTML() {
  const wk = weekAverages(12), pts = wk.map((w, i) => ({ i, avg:w.avg, ws:w.ws })).filter(p => p.avg != null);
  if (pts.length < 2) return `<p class="muted small" style="margin:6px 0">Log your weight in two or more different weeks to see the trend.</p>`;
  const W = 340, H = 150, pl = 36, pr = 10, pt = 10, pb = 24;
  const vals = pts.map(p => p.avg);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (hi - lo < 2) { lo -= 1; hi += 1; }
  const padv = (hi - lo) * .15; lo -= padv; hi += padv;
  const x = i => pl + (W - pl - pr) * i / 11, y = v => pt + (H - pt - pb) * (1 - (v - lo) / (hi - lo));
  let segs = '';
  for (let k = 1; k < pts.length; k++) {
    const a = pts[k - 1], b = pts[k], gap = b.i - a.i > 1;
    segs += `<line x1="${x(a.i).toFixed(1)}" y1="${y(a.avg).toFixed(1)}" x2="${x(b.i).toFixed(1)}" y2="${y(b.avg).toFixed(1)}" stroke="#1F5F3A" stroke-width="2.5" stroke-linecap="round"${gap ? ' stroke-dasharray="2 6" opacity=".75"' : ''}/>`;
  }
  const dots = pts.map(p => `<circle cx="${x(p.i).toFixed(1)}" cy="${y(p.avg).toFixed(1)}" r="3.6" fill="#1F5F3A"/>`).join('');
  const ticks = [hi - padv, (hi + lo) / 2, lo + padv].map(v => `<text x="${pl - 6}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end" font-size="10.5" fill="#6E6E73">${Math.round(v)}</text><line x1="${pl}" x2="${W - pr}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="#E8E8ED"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Weekly average weight, last 12 weeks">${ticks}${segs}${dots}
    <text x="${pl}" y="${H - 6}" font-size="10.5" fill="#6E6E73">${fmtShort(wk[0].ws)}</text><text x="${W - pr}" y="${H - 6}" text-anchor="end" font-size="10.5" fill="#6E6E73">this week</text></svg>
    <div class="small muted" style="margin-top:2px">Weekly averages · dashed = weeks with no weigh-in</div>`;
}
let wDay = null;
function weightHTML() {
  const t = todayKey(), dk = wDay && canLog(wDay) ? wDay : t, u = S.weight.unit || 'lbs';
  const cur = S.weight.logs[dk], last = latestWeight(), months = monthAverages(6);
  let delta = '';
  if (last && last.dk !== last.firstDk) { const d = round1(last.val - last.first); delta = `${d > 0 ? '+' : ''}${d} ${u} since ${fmtShort(last.firstDk)}`; }
  return `<section class="page weight scrolly"><header class="top"><h1>Weight</h1></header>
    <div class="balance" style="padding-bottom:4px"><div class="big num" style="font-size:44px">${last ? last.val : '—'}<span style="font-size:18px;color:var(--muted);font-weight:600"> ${last ? u : ''}</span></div>
      <div class="sub">${last ? `last weigh-in ${fmtShort(last.dk)}${delta ? ' · ' + delta : ''}` : 'No weigh-ins yet'}</div></div>
    ${daySeg(dk, 'wDaySet')}
    <div style="display:flex;gap:8px"><input class="field num" id="wIn" type="number" inputmode="decimal" step="0.1" placeholder="${dk === t ? "Today's" : "Yesterday's"} weight (${u})" value="${cur != null ? cur : ''}" style="flex:1"><button class="btn primary" style="width:96px;margin:0" onclick="wSave()">${cur != null ? 'Update' : 'Save'}</button></div>
    <div class="card" style="margin-top:6px"><h3>Last 12 weeks</h3>${weightChartHTML()}</div>
    <div class="card"><h3>Monthly averages</h3>${months.length ? months.map((m, i) => { const prev = months[i + 1], d = prev ? round1(m.avg - prev.avg) : null;
      return `<div style="display:flex;justify-content:space-between;padding:6px 0;border-top:${i ? '1px solid var(--line)' : '0'}"><span>${monthName(m.ym)}</span><span class="num"><b>${m.avg}</b> ${u}${d != null ? ` <span class="muted small">${d > 0 ? '+' : ''}${d}</span>` : ''} <span class="muted small">· ${m.n} weigh-in${m.n === 1 ? '' : 's'}</span></span></div>`; }).join('') : '<p class="muted small">Nothing yet.</p>'}</div>
    ${groceryCardHTML()}
    ${goalsCardHTML()}
    <p class="small muted" style="text-align:center;margin:0 0 14px">Weight never earns or costs anything. It's just a number.</p>
  </section>`;
}
function wDaySet(dk) { wDay = dk; refresh(); }
function wSave() {
  const dk = wDay && canLog(wDay) ? wDay : todayKey();
  const v = parseFloat($('wIn').value);
  if (logWeight(dk, v)) toast('Weight saved');
}

/* ── History ── */
let histYm = null, histSel = null, freeErr = '';
function openHistory() { OV = 'history'; histYm = ymOf(todayKey()); histSel = null; freeErr = ''; renderHistoryOver(true); }
function renderHistoryOver(first) { setOver(historyHTML(), first); }
function histNav(n) { histYm = addMonths(histYm, n); histSel = null; renderHistoryOver(); }
function histPick(dk) { histSel = histSel === dk ? null : dk; renderHistoryOver(); }
function habitSummary(h, dk) {
  const s = habitState(h, dk), d = S.days[dk] || {};
  if (s.st === 'paused') return `Paused${s.pause.why ? ' · ' + esc(s.pause.why) : ''}`;
  if (h === 'workout') return s.st === 'done' ? (d.workout.what ? `${esc(d.workout.what)}${d.workout.len ? ' · ' + esc(d.workout.len) : ''}${d.workout.hard ? ' · ' + esc(d.workout.hard) : ''}` : 'Workout') : s.st === 'rest' ? 'Rest day' : 'Not logged';
  if (h === 'protein') return s.logged ? `${proteinOn(dk)} g of ${S.settings.proteinGoal}` : 'Not logged';
  if (h === 'wind') return d.windDown ? `${esc(d.windDown.what.join(', '))} · ${esc(d.windDown.len)} · lights out ${esc(d.windDown.lights)}` : 'Not logged';
  if (s.st === 'free') return 'Free day';
  return s.logged ? `${sugarOn(dk)} g of ${S.settings.sugarBudget}${s.st === 'over' ? ' · over' : ''}` : 'Nothing logged';
}
function dayDetailHTML(dk) {
  const wins = S.wins.filter(w => w.dk === dk);
  const comeback = S.comeback && S.comeback.firstLog === dk;
  return `<div class="card" style="margin-top:10px"><h3>${parseDk(dk).toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' })}${comeback ? ' · comeback day' : ''}</h3>
    ${HABITS.map(h => `<div style="display:flex;justify-content:space-between;gap:10px;padding:4px 0" class="small"><b>${HABIT_META[h].name}</b><span class="muted" style="text-align:right">${habitSummary(h, dk)}</span></div>`).join('')}
    ${wins.length ? `<div class="small" style="margin-top:6px"><b>Wins</b> · ${wins.map(w => esc(w.label)).join(', ')}</div>` : ''}</div>`;
}
function historyHTML() {
  const ym = histYm, [y, mo] = ym.split('-').map(Number), start = (new Date(y, mo - 1, 1).getDay() + 6) % 7;
  const cells = calendarCells(ym).map(c => { const dk = `${ym}-${pad(c.n)}`; return `<button class="c ${c.cls} ${histSel === dk ? 'sel' : ''}" onclick="histPick('${dk}')">${c.n}</button>`; }).join('');
  const wd = ['M','T','W','T','F','S','S'].map(x => `<div class="wd">${x}</div>`).join('');
  const st = pauseStats(), wi = windInsights(), cur = ymOf(todayKey());
  const monthsList = []; for (let m = cur; m >= startMonth(); m = addMonths(m, -1)) monthsList.push(m);
  const rate = st.returnRate == null ? '—' : Math.round(st.returnRate * 100) + '%';
  const spends = S.spends.slice().sort((a, b) => a.dk < b.dk ? 1 : a.dk > b.dk ? -1 : 0);
  const fy = yearOf(todayKey()), upcoming = S.freeDays.filter(d => d > todayKey()).sort();
  return `<div class="bar2"><button class="back" onclick="closeOver()">‹ Today</button><h2>History</h2></div><div class="body">
    <div class="card"><div style="display:flex;align-items:center;justify-content:space-between"><button class="icon-btn" style="margin:0" onclick="histNav(-1)" aria-label="Previous month">‹</button><h3 style="margin:0">${monthName(ym)}</h3><button class="icon-btn" style="margin:0" onclick="histNav(1)" aria-label="Next month" ${ym >= cur ? 'disabled style="opacity:.3"' : ''}>›</button></div>
      <div class="cgrid big" style="margin-top:6px">${wd}${Array.from({ length:start }, () => '<div></div>').join('')}${cells}</div>
      <div class="small muted" style="margin-top:8px"><span class="lg"><i style="background:#1F5F3A"></i>full</span><span class="lg"><i style="background:#8DBE9C"></i>partial</span><span class="lg"><i style="background:#E8E8ED"></i>missed</span><span class="lg"><i style="background:#EEF3EF;box-shadow:inset 0 0 0 1px #d9e6dd"></i>paused</span></div>
      ${S.comeback && S.imported ? `<div class="small muted" style="margin-top:6px">Gap from ${fmtShort(S.comeback.from)}: ${S.comeback.gapDays} days. ${S.comeback.firstLog ? `You came back on ${fmtShort(S.comeback.firstLog)}.` : 'Your first log here counts as a comeback.'}</div>` : ''}
      ${histSel ? dayDetailHTML(histSel) : '<div class="small muted" style="margin-top:8px">Tap a day for details.</div>'}</div>

    <div class="card"><h3>Money</h3>
      ${monthsList.map(m => { const x = moneyFor(m); return `<div style="padding:6px 0;border-top:1px solid var(--line)" class="small"><div style="display:flex;justify-content:space-between"><b>${monthName(m)}${x.closed ? '' : ' · so far'}</b><span class="num">${money(x.unlockedC)} of ${money(x.potC)}</span></div>
        <div class="muted">daily ${money(x.dripC)} · bonus ${money(x.poolC)} · spent ${money(x.spentC)}${x.closed ? ` · saved ${money(x.savingsC)}` : ''}</div></div>`; }).join('')}
      <div class="small muted" style="margin-top:8px">Savings so far: <b class="num">${money(savingsTotalC())}</b> — unearned money from closed months, not spendable here. The other $50 a month stays outside the app.</div></div>

    <div class="card"><h3>Spending</h3>${spends.length ? spends.slice(0, 30).map(sp => `<div style="display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line)"><span><b>${esc(sp.cat)}</b> <span class="muted small">· ${fmtShort(sp.dk)}</span></span><span class="num">${money(sp.cents)}${ymOf(sp.dk) === cur ? ` <button class="muted" style="margin-left:4px;min-width:44px;min-height:44px" onclick="histDelSpend('${sp.id}')" aria-label="Delete">✕</button>` : ''}</span></div>`).join('') : '<p class="muted small">Nothing spent yet.</p>'}</div>

    <div class="card"><h3>Pause trends</h3>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center"><div><div class="num" style="font-size:26px;font-weight:700;color:var(--green)">${st.count}</div><div class="small muted">pauses</div></div><div><div class="num" style="font-size:26px;font-weight:700;color:var(--green)">${st.avgLen == null ? '—' : st.avgLen}</div><div class="small muted">avg days</div></div><div><div class="num" style="font-size:26px;font-weight:700;color:var(--green)">${rate}</div><div class="small muted">came back</div></div></div>
      ${st.reasons.length ? `<div class="q" style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:12px 0 4px">Days to come back, by reason</div>${st.reasons.map(r => `<div style="display:flex;justify-content:space-between;padding:3px 0" class="small"><span>${esc(r.why)} <span class="muted">×${r.n}</span></span><span class="num">${r.avgBack == null ? '—' : r.avgBack + ' days'}</span></div>`).join('')}
      <div class="q" style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:12px 0 4px">Pauses most</div>${st.habits.map(h => `<div style="display:flex;justify-content:space-between;padding:3px 0" class="small"><span>${HABIT_META[h.h].name}</span><span class="num">${h.n}</span></div>`).join('')}` : ''}
      <p class="small" style="margin:12px 0 0">${esc(st.note)}</p></div>

    <div class="card"><h3>Wind-down and lights-out</h3>
      ${wi.items.length ? wi.items.map(i => `<div style="display:flex;justify-content:space-between;padding:3px 0" class="small"><span>${esc(i.name)} <span class="muted">×${i.n}</span></span><span class="num">${i.early} of ${i.n} by 10:00</span></div>`).join('') : ''}
      <p class="small" style="margin:10px 0 0">${esc(wi.note)}</p></div>

    <div class="card"><h3>Free days</h3>
      <p class="small muted" style="margin:0 0 8px">${freeDaysLeft(fy)} of ${S.settings.freeDaysPerYear} left in ${fy}. On a free day the sugar budget is off — it pays nothing and breaks nothing. Set them ahead of time only.</p>
      ${upcoming.length ? upcoming.map(d => `<div style="display:flex;align-items:center;justify-content:space-between;padding:4px 0" class="small"><span>${parseDk(d).toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric', year:'numeric' })}</span><button class="muted" style="min-height:44px;padding:0 10px" onclick="histRemoveFree('${d}')">Remove</button></div>`).join('') : '<p class="small muted" style="margin:0 0 8px">None coming up.</p>'}
      <div style="display:flex;gap:8px;margin-top:6px"><input class="field" id="freeIn" type="date" min="${addDays(todayKey(), 1)}" style="flex:1"><button class="btn primary" style="width:90px;margin:0" onclick="histAddFree()">Add</button></div>
      ${freeErr ? `<div class="small" style="color:var(--bad);margin-top:6px">${esc(freeErr)}</div>` : ''}</div>
    ${backupHTML()}
  </div>`;
}
function histDelSpend(id) { if (deleteSpend(id)) toast('Spend removed'); }
function histAddFree() { const e = addFreeDay($('freeIn').value); freeErr = e || ''; if (e) renderHistoryOver(); else toast('Free day added'); }
function histRemoveFree(d) { removeFreeDay(d); }
/* ── Backup / import: one JSON file with everything (never the AI key). Accepts 2.0 backups and v1 backups. ── */
function exportObject() {
  const o = JSON.parse(JSON.stringify(S));
  o.exportedAt = new Date().toISOString(); o.appVersion = APP_VERSION;
  return o;
}
async function exportData() {
  const date = todayKey(), name = `gleefulhabit2-backup-${date}.json`;
  const blob = new Blob([JSON.stringify(exportObject(), null, 2)], { type:'application/json' });
  try { localStorage.setItem('gh2_lastExport', todayKey()); } catch (e) {}
  try {
    const file = new File([blob], name, { type:'application/json' });
    if (navigator.canShare && navigator.canShare({ files:[file] })) { await navigator.share({ files:[file], title:'GleefulHabit 2.0 backup' }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function isV1Backup(o) { return !!(o && !o.schema && Array.isArray(o.habits) && o.user); }
/* Returns { ok, msg }. A 2.0 backup replaces everything; a v1 backup adds its history to what's here. */
function applyBackup(obj) {
  if (!obj || typeof obj !== 'object') return { ok:false, msg:'That file isn’t a GleefulHabit backup' };
  if (obj.schema === SCHEMA) {
    delete obj.exportedAt; delete obj.appVersion;
    S = migrateState(obj); if (!S.startDate) S.startDate = todayKey();
    save(); refresh(); return { ok:true, msg:'Backup restored' };
  }
  if (isV1Backup(obj)) {
    const c = importV1(obj, S); S.ui.v1Offer = 'done'; save(); refresh();
    return { ok:true, msg:`v1 history added: ${c.workouts} workouts, ${c.foods} food entries, ${c.weights} weigh-ins` };
  }
  return { ok:false, msg:'That file isn’t a GleefulHabit backup' };
}
function onImportFile(ev) {
  const f = ev.target.files && ev.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    let obj = null; try { obj = JSON.parse(r.result); } catch (e) {}
    const v1 = isV1Backup(obj);
    if (obj && !confirm(v1 ? 'Add this v1 backup’s history to 2.0? Days from today on are skipped and money stays at $0 for them.' : 'Replace everything on this device with this backup?')) { ev.target.value = ''; return; }
    const res = applyBackup(obj); toast(res.msg); ev.target.value = '';
  };
  r.readAsText(f);
}
function backupHTML() {
  const v1here = !!readV1() && !S.imported;
  return `<div class="card"><h3>Backup</h3>
    <p class="small muted" style="margin:0 0 8px">One file with every log, pause, spend, win and weight. The AI key is never included. iOS can clear app data, so export now and then.</p>
    <div class="row2"><button class="btn primary" style="margin:0" onclick="exportData()">Export</button>
      <label class="btn" style="margin:0">Import<input type="file" id="impFile" accept=".json,application/json" style="display:none" onchange="onImportFile(event)"></label></div>
    ${v1here ? `<button class="btn quiet" style="margin-top:10px" onclick="bringV1()">Bring over my v1 history</button>` : ''}
    <p class="small muted" style="margin:10px 0 0">GleefulHabit 2.0 · version ${APP_VERSION}</p></div>`;
}
function bringV1() {
  if (!confirm('Add your v1 history (weight, protein, workouts, wins) to 2.0? v1 itself is not changed.')) return;
  const c = doV1Import(); refresh(); toast(`Added ${c.workouts} workouts, ${c.foods} food entries, ${c.weights} weigh-ins`);
}
/* First launch with v1 data on this phone: offer to bring the history over (money always starts fresh). */
function maybeOfferV1() {
  if (S.ui.v1Offer !== 'pending') return;
  const sum = v1Summary(readV1());
  if (!sum || (!sum.days && !sum.weights)) { skipV1Import(); return; }
  SH = { kind:'v1' };
  openSheet(`<h2>Welcome to 2.0</h2>
    <p class="hint">I found your v1 data on this phone: ${sum.days} logged days${sum.weights ? ` and ${sum.weights} weigh-ins` : ''}. Want that history here?</p>
    <p class="small muted" style="margin:0 0 4px">Workouts, protein entries, weight and wins come over. XP, packs and points stay behind, and money starts fresh at $0. Your v1 app is not touched.</p>
    <button class="btn primary" onclick="v1Yes()">Bring my history</button>
    <button class="btn quiet" onclick="v1No()">Start fresh</button>`);
}
function v1Yes() { const c = doV1Import(); closeSheet(); refresh(); toast(`Added ${c.workouts} workouts, ${c.foods} food entries, ${c.weights} weigh-ins`); }
function v1No() { skipV1Import(); closeSheet(); toast('Starting fresh'); }

/* ── Start ── */
closeMonths();
render();
if (S.ui.lastVersion && S.ui.lastVersion !== APP_VERSION) setTimeout(() => toast('Updated to the latest version'), 600);
S.ui.lastVersion = APP_VERSION; save();
maybeOfferV1();
</script>
