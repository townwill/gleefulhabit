<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Prism</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;700&family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: full-bleed 3D stage; slim HUD bar and level chips on top, status and hint at the bottom. One dark world by choice. */
  color-scheme: dark;
  --stage:#03040a;
  --ink:#eef2fb;
  --ink-dim:#8f9bb5;
  --panel:rgba(10,13,24,.74);
  --line:rgba(140,170,230,.24);
  --accent:#4af0ff;
  --hot:#ff4ae0;
  --font-display:"Oxanium","Barlow Condensed",system-ui,sans-serif;
  --font-ui:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
@media (display-mode:standalone){html{min-height:calc(100% + env(safe-area-inset-top,0px))}html #stage{width:100vw;height:100vh;bottom:auto;right:auto}}
body{background:var(--stage);color:var(--ink);font-family:var(--font-ui);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.top{position:fixed;top:0;left:0;right:0;padding:calc(10px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-right,0px)) 0 calc(12px + env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;pointer-events:none}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.title{display:flex;align-items:center;gap:12px;min-width:0;height:40px}
.mark{display:flex;align-items:center;gap:7px;height:40px;font:700 17px/1 var(--font-display);letter-spacing:.2em;color:var(--ink)}
.mark svg{width:22px;height:22px;flex:none}
#lvname{font:600 17px/1 var(--font-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#b-menu{pointer-events:auto;flex:none;width:44px;height:40px;border-radius:10px;background:var(--panel);border:1px solid var(--line);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0}
#b-menu svg{width:22px;height:22px}
#b-view{position:fixed;right:12px;top:calc(60px + env(safe-area-inset-top,0px));display:none;font:600 13px/1 var(--font-ui);letter-spacing:.1em;text-transform:uppercase;padding:9px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--accent);color:var(--accent)}
#menu,#statcard{top:calc(50% + 20px);transform:translate(-50%,-50%);display:none;z-index:6;width:min(380px,calc(100% - 24px));max-height:calc(100% - 150px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;-webkit-overflow-scrolling:touch;text-align:left}
#statcard{z-index:7}
#menu h2,#statcard h2{margin:0 0 10px;font:700 22px/1.1 var(--font-display);letter-spacing:.14em;text-transform:uppercase}
#menu h3{margin:16px 0 0;font:600 14px/1 var(--font-ui);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim)}
.mrow{display:flex;gap:8px;margin:8px 0}
.mrow button{flex:1;min-width:0;font:600 15px/1.1 var(--font-ui);letter-spacing:.1em;text-transform:uppercase;padding:13px 10px;border-radius:10px;background:var(--panel);border:1px solid var(--line);color:var(--ink)}
.mrow button[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}
.mrow button[aria-pressed="false"]{color:var(--ink-dim)}
#b-erase{color:var(--ink-dim)}
#stats{display:grid;grid-template-columns:1fr auto;gap:7px 14px;margin:10px 0 14px;font:500 16px/1.2 var(--font-ui)}
#stats dt{color:var(--ink-dim)}
#stats dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
#menu .go,#statcard .go{width:100%}
#w-tabs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:14px}
#w-tabs button{font:600 14px/1 var(--font-ui);letter-spacing:.08em;text-transform:uppercase;padding:10px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--ink-dim)}
#w-tabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#04121a}
#w-tabs button.locked{opacity:.45}
.chips{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:14px 0}
.chips button:disabled{opacity:.3;cursor:default}
.chips button{min-width:0;height:54px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font:600 20px/1 var(--font-ui);color:var(--ink-dim);font-variant-numeric:tabular-nums;padding:0}
.chips button{position:relative}
.chips button.done{color:var(--accent);border-color:var(--accent)}
.chips button.first{color:#2a1c00;background:#ffd24a;border:2px solid #fff1b8;box-shadow:0 0 10px rgba(255,210,74,.65)}
.chips button.first[aria-current="true"]{color:#2a1c00;box-shadow:0 0 0 2px #05060a,0 0 0 4px var(--ink)}
.chips button.ace{color:#04121a;background:#fff;border:2px solid var(--accent);box-shadow:0 0 10px rgba(74,240,255,.55)}
.chips button[aria-current="true"]{box-shadow:0 0 0 2px var(--ink);color:var(--ink)}
.chips button.done[aria-current="true"]{color:var(--accent)}
.chips button.ace[aria-current="true"]{color:#04121a;box-shadow:0 0 0 2px #05060a,0 0 0 4px var(--ink)}
.bottom{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
#status{font:600 16px/1 var(--font-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim);font-variant-numeric:tabular-nums;padding:8px 14px;background:var(--panel);border:1px solid var(--line);border-radius:999px}
#status b{color:var(--ink);font-weight:600}

#hint{margin:0;max-width:38ch;text-align:center;font:500 17px/1.3 var(--font-ui);letter-spacing:.03em;color:var(--ink);text-wrap:balance;text-shadow:0 1px 8px #000}
.card{position:fixed;left:50%;transform:translateX(-50%);width:min(340px,calc(100% - 32px));padding:20px;text-align:center;background:rgba(6,8,18,.86);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#start{top:50%;transform:translate(-50%,-50%)}
#start h1{margin:0 0 10px}
#start h1 svg{width:100%;max-width:250px;height:auto;display:block;margin:0 auto}
.card p{margin:0 0 16px;font:500 18px/1.35 var(--font-ui);color:var(--ink-dim);text-wrap:balance}
.go{font:700 17px/1 var(--font-display);letter-spacing:.2em;text-transform:uppercase;padding:14px 26px;border-radius:12px;border:0;background:var(--accent);color:#04121a}
.ghost{font:600 15px/1 var(--font-ui);letter-spacing:.14em;text-transform:uppercase;padding:13px 16px;border-radius:12px;background:transparent;border:1px solid var(--line);color:var(--ink-dim)}
#win{bottom:16px;display:none}
#picker{top:50%;transform:translate(-50%,-50%);display:none;z-index:5;width:min(520px,calc(100% - 20px));max-height:calc(100% - 20px);overflow:auto;padding:18px 16px}
#picker .go{width:100%}
#picker h2{margin:0;font:700 19px/1.15 var(--font-display);letter-spacing:.08em;text-transform:uppercase}
#picker p{margin:8px 0 0;font-size:16px}
#modes{margin-bottom:14px}
#modes button{flex:1;padding:12px 6px;font-size:14px;line-height:1.25;color:var(--ink);border-color:rgba(74,240,255,.6)}
#modes button b{display:block;color:var(--accent);font-weight:600}
#picker #w-note{margin:0 0 14px;min-height:1.3em}
#lvname{pointer-events:auto;background:none;border:0;padding:0;margin:0;height:40px;display:flex;align-items:center;text-align:left;min-width:0;line-height:1}
#tray{pointer-events:auto;flex-wrap:wrap}
#b-deck{display:none;pointer-events:auto;font:600 15px/1 var(--font-ui);letter-spacing:.12em;text-transform:uppercase;padding:11px 16px;border-radius:999px;background:var(--panel);border:1.5px solid var(--accent);color:var(--accent)}
#tray button{touch-action:none;display:flex;flex-direction:column;align-items:center;gap:3px;width:78px;padding:6px 4px 7px;border-radius:12px;background:var(--panel);border:1.5px solid var(--line);color:var(--ink);font:600 12px/1 var(--font-ui);letter-spacing:.08em;text-transform:uppercase;cursor:grab}
#tray button svg{width:44px;height:44px;display:block;pointer-events:none}
#tray button span{pointer-events:none}
#tray button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
#tray button.placed{color:var(--ink-dim);border-style:dashed;cursor:pointer}
#tray button.placed svg{opacity:.22}
#ghost{position:fixed;width:64px;height:64px;transform:translate(-50%,-115%);pointer-events:none;display:none;z-index:9;filter:drop-shadow(0 0 8px rgba(74,240,255,.8))}
#ghost svg{width:100%;height:100%}
#win h2{margin:0 0 4px;font:700 26px/1.1 var(--font-display);letter-spacing:.14em;text-transform:uppercase}
#stars{font-size:34px;letter-spacing:.2em;padding-left:.2em;color:#ffe14a;margin:4px 0 6px;line-height:1}
#stars .off{color:rgba(255,255,255,.16)}
.row{display:flex;gap:8px;justify-content:center}
#flash{position:fixed;inset:0;background:#eaf6ff;opacity:0;pointer-events:none}
#hap{position:fixed;left:-200px;top:0;opacity:0;pointer-events:none}
#updatebar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;font:600 15px/1 var(--font-ui);letter-spacing:.08em;padding:13px 18px;border-radius:999px;border:0;background:var(--accent);color:#04121a}
#msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;font:500 20px/1.4 var(--font-ui);background:var(--stage)}
</style>
</head>
<body>

<div class="top">
  <div class="bar">
    <div class="title"><span class="mark"><svg viewBox="0 0 32 32" aria-hidden="true"><polygon points="16,2 4,16 16,13" fill="#ff3b4a"/><polygon points="16,2 28,16 16,13" fill="#3dff8a"/><polygon points="4,16 16,30 28,16 16,13" fill="#4a8cff"/><polygon points="16,13 10,16 16,22 22,16" fill="#fff" opacity=".85"/><path d="M16 2 4 16 16 30 28 16Z M16 2V13 M4 16 16 13 28 16" fill="none" stroke="#fff" stroke-width="1" stroke-linejoin="round" opacity=".9"/></svg>PRISM</span><button id="lvname" type="button" aria-haspopup="dialog"></button></div>
    <button id="b-menu" type="button" aria-label="Menu" aria-haspopup="dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5h16M4 12h16M4 17.5h16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg></button>
  </div>
</div>
<div class="bottom" id="bottom">
  <button id="b-deck" type="button"></button>
  <div class="row" id="tray"></div>
  <p id="hint"></p>
  <div id="status"></div>
</div>
<div class="card" id="win" role="status">
  <h2>Level clear</h2>
  <div id="stars"></div>
  <p id="winline"></p>
  <div class="row"><button class="ghost" id="b-again" type="button">Replay</button><button class="go" id="b-next" type="button">Next level</button></div>
</div>
<button id="b-view" type="button">Reset view</button>
<div class="card" id="menu" role="dialog" aria-label="Menu">
  <h2>Menu</h2>
  <div class="mrow"><button id="b-music" type="button" aria-pressed="true">Music</button><button id="b-sfx" type="button" aria-pressed="true">SFX</button></div>
  <div class="mrow"><button id="b-track" type="button"></button></div>
  <div class="mrow"><button id="b-reset" type="button">Restart level</button><button id="b-view2" type="button">Reset view</button></div>
  <div class="mrow"><button id="m-levels" type="button">Level select</button><button id="m-stats" type="button">Stats</button></div>
  <div class="mrow"><button id="b-erase" type="button">Erase progress</button></div>
  <button class="go" id="m-close" type="button">Close</button>
</div>
<div class="card" id="statcard" role="dialog" aria-label="Stats">
  <h2>Stats</h2>
  <dl id="stats"></dl>
  <button class="go" id="s-close" type="button">Back</button>
</div>
<div class="card" id="picker" role="dialog" aria-label="Level select">
  <div class="row" id="modes"><button class="ghost" id="b-daily" type="button"></button><button class="ghost" id="b-endless" type="button"></button></div>
  <div id="w-tabs" role="group" aria-label="Worlds"></div>
  <h2 id="w-title"></h2>
  <p id="w-stars"></p>
  <div class="chips" id="chips" role="group" aria-label="Levels"></div>
  <p id="w-note"></p>
  <button class="go" id="w-close" type="button">Close</button>
</div>
<div class="card" id="start">
  <h1 aria-label="Prism"><svg viewBox="0 0 280 150" role="img" aria-hidden="true">
    <g transform="translate(108,0) scale(2)"><polygon points="16,2 4,16 16,13" fill="#ff3b4a"/><polygon points="16,2 28,16 16,13" fill="#3dff8a"/><polygon points="4,16 16,30 28,16 16,13" fill="#4a8cff"/><polygon points="16,13 10,16 16,22 22,16" fill="#fff" opacity=".85"/><path d="M16 2 4 16 16 30 28 16Z M16 2V13 M4 16 16 13 28 16" fill="none" stroke="#fff" stroke-width="1" stroke-linejoin="round" opacity=".9"/></g>
    <text x="140" y="112" text-anchor="middle" font-family="Oxanium, sans-serif" font-weight="700" font-size="46" letter-spacing="14" fill="#eef2fb">PRISM</text>
    <line x1="24" y1="134" x2="140" y2="134" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <line x1="140" y1="134" x2="256" y2="124" stroke="#ff3b4a" stroke-width="3" stroke-linecap="round"/>
    <line x1="140" y1="134" x2="256" y2="134" stroke="#3dff8a" stroke-width="3" stroke-linecap="round"/>
    <line x1="140" y1="134" x2="256" y2="144" stroke="#4a8cff" stroke-width="3" stroke-linecap="round"/>
    <polygon points="140,126 148,134 140,142 132,134" fill="#fff"/>
  </svg></h1>
  <p>Turn the mirrors. Split the light. Fill every crystal with its color.</p>
  <button class="go" id="b-start" type="button">Start</button>
</div>
<label id="hap" aria-hidden="true"><input type="checkbox" switch tabindex="-1"></label>
<div id="ghost"></div>
<div id="flash"></div>
<div id="msg"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';

var COL={1:0xff3b4a,2:0x3dff8a,4:0x4a8cff,3:0xffe14a,5:0xff4ae0,6:0x4af0ff,7:0xffffff};

function glowTexture(){
  var c=document.createElement('canvas');c.width=c.height=128;var g=c.getContext('2d');

  var r=g.createLinearGradient(0,0,256,128);r.addColorStop(0,'#f2f8ff');r.addColorStop(.5,'#b9d2f5');r.addColorStop(1,'#7fa4e0');g.fillStyle=r;g.fillRect(0,0,256,128);

/* ---------------- cosmos ---------------- */
var perm=new Uint8Array(512);

function n3(x,y,z){
  var X=Math.floor(x),Y=Math.floor(y),Z=Math.floor(z),fx=x-X,fy=y-Y,fz=z-Z;X&=255;Y&=255;Z&=255;

function sstep(a,b,x){x=(x-a)/(b-a);x=x<0?0:x>1?1:x;return x*x*(3-2*x);}
function makeSkyCanvas(){
  var W=768,H=384,c=document.createElement('canvas');c.width=W;c.height=H;
