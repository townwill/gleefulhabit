<style>

}

.wrap{max-width:1180px;margin:0 auto;padding-block:10px 60px}

/* header */

/* card flip */
.fcard{width:var(--w);aspect-ratio:5/7;perspective:900px;cursor:pointer;position:relative;flex:none;background:none;border:0;padding:0;max-width:100%}
.fcard .inner{position:absolute;inset:0;transition:transform .5s cubic-bezier(.3,.8,.3,1);transform-style:preserve-3d}
.fcard.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:calc(var(--w) * .045);overflow:hidden;box-shadow:0 6px 16px rgba(0,0,0,.45)}
.front{transform:rotateY(180deg)}
.front canvas{width:100%;height:100%;display:block}
.cardback{
  background:
    radial-gradient(ellipse 30% 22% at 50% 50%, transparent 62%, rgba(233,226,208,.85) 64% 70%, transparent 72%),
    repeating-linear-gradient(0deg, rgba(255,255,255,.07) 0 2px, transparent 2px 8px),
    repeating-linear-gradient(90deg, rgba(0,0,0,.12) 0 2px, transparent 2px 8px),
    #34496f;
  border:calc(var(--w) * .04) solid #e8e0cc;
}
.hit.flipped .front{box-shadow:0 0 0 2px rgba(143,220,255,.8),0 0 26px rgba(143,220,255,.55)}
.big.flipped .front{box-shadow:0 0 0 2px var(--gold),0 0 34px rgba(242,194,75,.7)}
.fx::after{content:"";position:absolute;top:0;bottom:0;left:0;width:100%;pointer-events:none;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.28) 50%,transparent 70%);animation:sheen 2.8s linear infinite;will-change:transform;transform:translateX(-110%)}
.fx.refr::after{background:linear-gradient(115deg,transparent 15%,rgba(255,60,170,.22) 35%,rgba(60,220,255,.24) 50%,rgba(255,235,60,.22) 65%,transparent 85%)}
@keyframes sheen{from{transform:translateX(-110%)}to{transform:translateX(110%)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.slot{animation:pop .25s ease-out both}

.cstats{margin:0 0 14px;display:block;width:100%;flex:1 1 100%;grid-column:1/-1}.cstats summary{cursor:pointer;font-weight:700;font-size:17px;color:var(--gold);padding:8px 0;list-style:none}.cstats summary::-webkit-details-marker{display:none}.cstats summary::before{content:"▸ ";}.cstats[open] summary::before{content:"▾ "}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}.stile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stile span{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}.stile b{font-size:24px;font-variant-numeric:tabular-nums;color:var(--ink)}.stile small{font-size:13px;color:var(--muted);line-height:1.3}
.offers{display:flex;flex-direction:column;gap:8px}.offers .offer{position:relative}.offx{margin-left:auto;align-self:center}

.selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:55;width:min(900px,calc(100% - 24px));background:#0f1217;border:1px solid var(--bulb);border-radius:14px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;box-shadow:0 12px 34px rgba(0,0,0,.6)}

.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}

const SOC_ONE_NOTES={'Lionel Messi':"Messi, 2004. His first year with the big team in Barcelona. He was seventeen and smaller than everybody on the field, and nobody could take the ball off him. I knew right then.",
  'Cristiano Ronaldo':"Ronaldo, 2003. A skinny kid from Madeira with a lot of step-overs. Manchester United paid a fortune for him and everybody laughed. Nobody's laughing now.",
  'Pele':"Pele, 1958. Seventeen years old at the World Cup in Sweden. He cried on the field when Brazil won. I heard it on the radio in my dad's kitchen.",
  'Kylian Mbappe':"Mbappe, 2018. Nineteen years old and he scored in a World Cup final. The fastest player I ever saw, and I saw a lot of fast players.",
  'Diego Maradona':"Maradona, 1986. Mexico City. He dribbled past half of England for the best goal anybody ever scored. Watch the video. Then watch it again.",
  'Ronaldo Nazario':"Ronaldo, the Brazilian one. 2002. Two goals in the World Cup final and the funniest haircut in history.",
  'Mia Hamm':"Mia Hamm, 1999. Ninety thousand people at the Rose Bowl to watch women's soccer. Every little girl in America wanted to be her. A lot of little boys too.",
  'Brandi Chastain':"Brandi Chastain, 1999. The last penalty in the World Cup final. She took her shirt off and swung it over her head, and the whole country lost its mind.",
  'Alex Morgan':"Alex Morgan, 2015. World champion in Vancouver. She scored on her birthday once, too. Some people have all the luck, and she earned all of hers.",
  'Abby Wambach':"Abby Wambach, 2015. Nobody in the world ever scored more headers. She finally won her World Cup in her last try.",
  'Megan Rapinoe':"Megan Rapinoe, 2019. Arms out wide in France after every goal. Best player in the world that summer.",
  'Marta':"Marta, 2007. Brazil's number ten. Six times the best player on the planet. Pele said she was the best he'd seen. That's a lot coming from him."};

function collectTips(){const t=Math.floor((S.tips||0)*100)/100;if(t<.01)return;S.cash+=t;S.stats.earned+=t;S.tips=0;toast(`Collected ${money(t)} from the tip jar.`,'good');updateHeader();render()}

function makeTradeNight(){
  const pool=Object.keys(S.stacks).filter(k=>{const c=fromKey(k);return c.par!==6&&avail(k)-scCount(k)>0&&valueOf(c)>=.5});
  if(pool.length<3)return;const offers=[];
  for(let i=0;i<3;i++){
    const wp=()=>wpick(pool,k=>Math.sqrt(valueOf(fromKey(k))));const give=[wp()];if(Math.random()<.5){const g2=wp();if(g2!==give[0])give.push(g2)}
    const V=give.reduce((a,k)=>a+valueOf(fromKey(k)),0);const sp=P[fromKey(give[0]).pid].sport;
    let best=null;for(let t=0;t<120;t++){const c=rollCard({sport:sp,tw:[10,25,30,22,13],parMul:3});const v=valueOf(c);if(v>=V*1.15&&v<=V*2.2){best=c;break}if(!best||Math.abs(v-V*1.5)<Math.abs(valueOf(best)-V*1.5))best=c}

const WANT_KINDS=[['any','Any card'],['base','Base card'],['rc','Rookie card'],['shiny','Refractor'],['num','Numbered'],['auto','Autograph'],['relic','Jersey relic']];
const WANT_MAX=5;

function capTxt(c){return `${c.year} ${P[c.pid].name}${isRC(c)?' RC':''}${c.par?' · '+parName(c):''}${c.g?' · SH '+c.g:''}`}
function wantCard(w){
  const p=P[w.pid];let lo=p.start,hi=p.end;
  if(w.kind==='rc')lo=hi=p.start;
  if(w.kind==='num'||w.kind==='relic'){lo=Math.max(lo,w.kind==='relic'?1997:1996)}
  const year=lo+Math.floor(Math.random()*(hi-lo+1));
  let par={base:0,rc:0,shiny:2,auto:7,relic:8}[w.kind];
  if(w.kind==='num')par=wpick([3,4,5],x=>({3:60,4:30,5:10})[x]);
  if(w.kind==='any'){par=rollPar(2);if(par===6)par=2;if(par===8&&year<1997)par=1;if(par===9&&year<2000)par=7}
  if(w.kind==='rc'){par=Math.random()<.7?0:wpick([1,2,3,7],x=>({1:40,2:35,3:15,7:10})[x]);if((par===3)&&year<1996)par=2}
  return {pid:p.id,year,par};
}
function freeTradeKeys(skip){
  const out=[];for(const k in S.stacks){const c=fromKey(k);if(k===skip||isOne(c)||S.pc[k]||isSteam(c))continue;const a=avail(k)-scCount(k);for(let i=0;i<a;i++)out.push(k)}return out}
function makeWantOffer(w){
  const card=wantCard(w),V=valueOf(card),k0=key(card);
  const pool=freeTradeKeys(k0).map(k=>({k,v:valueOf(fromKey(k))})).filter(x=>x.v>=.25&&x.v<=V*1.3).sort((a,b)=>b.v-a.v);
  let give=[],sum=0;
  for(const x of pool){if(give.length>=4)break;if(sum+x.v<=V*1.6){give.push(x.k);sum+=x.v}if(sum>=V*1.25)break}
  if(sum<V*1.25)give=null;
  const who=pick(['Big Sal','Denise','Coach Pete','Mr. Okafor','Hank from the flea market','Marisol','Tyler, age 11','A guy on the forums']);
  w.offer={card,give,cash:Math.max(1,Math.ceil(V*1.45*100)/100),who};
}

function genFloor(){

  const ref=dbNS.doc('offers/'+o.id);
  try{const d=await ref.get();if(!d.exists||d.data().status!=='open'){toast('That offer is gone.');return}await ref.update({status:'accepted',doneAt:Date.now()})}
  catch(e){toast("Couldn't reach the mailbox. Try again.");return}
  markDone(o.id);o.want.forEach(k=>removeCards(k,1));o.give.forEach(k=>addCard(fromKey(k),'trade'));S.stats.trades++;addXP(15);
  mailLog(`Traded with ${o.fromName}. You got ${cardsTxt(o.give)}.`);toast(`Traded with ${o.fromName}! You got ${cardsTxt(o.give)}.`,'gold',7000);
  save('now');updateHeader();renderTabs();render()}

function floorBuy(t,i){const it=tbl(t)&&tbl(t).it[i];if(!it||it.sold||it.tradeOnly)return false;if(S.cash<it.p){toast(`You need ${money(it.p)}.`);return false}
  const wasHidden=it.hidden;S.cash-=it.p;floorGot(t,i);save(true);updateHeader();
  if(wasHidden)toast(`${tbl(t).n}: "Let's see what you got..." It's a ${cardTitle(it.c)} worth ${money(valueOf(it.c))}!`,valueOf(it.c)>=it.p?'gold':'good',6000);

// haggling: a low offer rarely works, a fair one often does; every "no" makes the dealer a little grumpier
function floorHaggle(t,i,pct){const T=tbl(t),it=T&&T.it[i];if(!it||it.sold||it.h)return;
  if(T.mood<=-2){toast(`${T.n}: "No more haggling today. Prices are prices."`);return}
  const chance=(pct<=.7?.25:.6)+T.mood*.1;
  if(Math.random()<chance){it.p=Math.max(.5,Math.round(it.p*pct*100)/100);it.h=1;toast(`${T.n}: "${pick(['Deal.','Fine, fine. You drive a hard bargain.','Okay kid, you got me.'])} ${money(it.p)}."`,'good')}
  else{it.h=2;T.mood--;toast(`${T.n}: "${pick(['Price is firm.','Nope. Not for that.','Ha! Nice try.'])}"`)}
  save(true)}
// trades: the dealer picks spare cards from your binder worth a bit more than his card
function tradeAsk(t,i){const T=tbl(t),it=T.it[i],V=valueOf(it.c)*(T.id==='tom'?rnd(1.05,1.2):rnd(1.25,1.45)),k0=key(it.c);
  const pool=freeTradeKeys(k0).map(k=>({k,v:valueOf(fromKey(k))})).filter(x=>x.v>=.25&&x.v<=V*1.2).sort((a,b)=>b.v-a.v);
  const give=[];let sum=0;for(const x of pool){if(give.length>=5)break;if(sum+x.v<=V*1.25){give.push(x.k);sum+=x.v}if(sum>=V)break}
  return sum>=V?{give,sum}:null}
function floorTrade(t,i,give){const it=tbl(t).it[i];if(!it||it.sold)return;const need={};give.forEach(k=>need[k]=(need[k]||0)+1);
  for(const k in need)if(avail(k)-scCount(k)<need[k]){toast("Some of those cards aren't free anymore.");return}
  give.forEach(k=>removeCards(k,1));floorGot(t,i);S.stats.trades++;addXP(10);toast(`Traded for ${cardTitle(it.c)}!`,'good');save(true);updateHeader()}
function bundleDeal(t){const T=tbl(t),left=T.it.map((x,i)=>i).filter(i=>!T.it[i].sold&&!T.it[i].tradeOnly);if(left.length<2)return null;
  const full=left.reduce((a,i)=>a+T.it[i].p,0);return {left,full,price:Math.round(full*.85*100)/100}}
function buyBundle(t){const b=bundleDeal(t);if(!b)return;if(S.cash<b.price){toast(`You need ${money(b.price)}.`);return}

function custInterval(){return showOn()?rnd(3500,6500):(26000-up('sign')*5500)*rnd(.6,1.4)}

    {text:`Only Hall of Fame-level guys for me.`,m:c=>P[c.pid].tier>=4},

    {text:`Graded cards only. Nothing below an 8.`,m:c=>c.g>=8},
  ];
  return pick(opts);
}
const LINE_MAX=12;
function lineFree(){const pr={};(S.line||[]).forEach(e=>e.items.forEach(x=>pr[x.k]=(pr[x.k]||0)+1));const seen={};return S.shelf.map((k,i)=>{seen[k]=(seen[k]||0)+1;return seen[k]>(pr[k]||0)?i:-1}).filter(i=>i>=0)}
function spawnCustomer(now){
  const [name,color]=pick(CUSTOMERS);const want=genWant();
  const free=up('line')?lineFree():S.shelf.map((k,i)=>i);
  const idxs=free.filter(i=>want.m(fromKey(S.shelf[i])));
  cust={name,color,want:want.text,arrived:now};
  if(idxs.length){
    idxs.sort((a,b)=>valueOf(fromKey(S.shelf[b]))-valueOf(fromKey(S.shelf[a])));
    // some collectors want everything on the shelf that fits; big spenders at the card show most of all
    const r=Math.random(),n=Math.min(idxs.length,r<(showOn()?.35:.5)?1:r<.8?2:r<.95?3:4);
    const mult=rnd(1.3,1.9)*(1+.15*S.tier)*(showOn()?1.25:1)*(n>1?.97:1);
    cust.items=idxs.slice(0,n).map(i=>({k:S.shelf[i],offer:Math.max(.05,Math.round(valueOf(fromKey(S.shelf[i]))*mult*100)/100)}));
    cust.state='offer';cust.leave=now+(showOn()?22000:45000)+(n-1)*8000;
  } else if(free.length&&Math.random()<.2){
    const k=free.map(i=>S.shelf[i]).sort((a,b)=>valueOf(fromKey(b))-valueOf(fromKey(a)))[0];cust.items=[{k,offer:Math.round(valueOf(fromKey(k))*1.05*100)/100}];cust.state='offer';cust.impulse=true;cust.leave=now+30000;
  } else {cust.state='none';cust.leave=now+8000}
  if(cust.items){cust.total=custTotal();cust.dur=cust.leave-now}
  // with the Waiting Line, anyone with an offer gets in line and the door stays open
  if(up('line')&&cust.state==='offer'){S.line=S.line||[];S.line.push({name:cust.name,color:cust.color,want:cust.impulse?'Eyeing your shelf.':cust.want,items:cust.items});cust=null;nextCust=now+custInterval();
    if(S.line.length===5)toast('5 customers are waiting in line at the Counter. Sell to all of them in one tap.','gold',9000);
    else if(tab!=='counter'&&S.line.length<5)toast(`${name} got in line at the Counter.`,'good',3500);
    save(true);renderTabs();if(tab==='counter')renderEvents();return}
  renderTabs();if(tab==='counter')renderCustomer();

}
function clerkStock(){
  if(!up('clerk')||S.level<5)return;const room=shelfCap()-S.shelf.length;if(room<=0)return;
  const cands=[];for(const k in S.stacks){const c=fromKey(k);if(isOne(c)||S.pc[k])continue;const spare=S.stacks[k]-shelfCount(k)-(S.showcase||[]).filter(x=>x===k).length-1;for(let i=0;i<spare;i++)cands.push(k)}
  if(!cands.length)return;cands.sort((a,b)=>valueOf(fromKey(b))-valueOf(fromKey(a)));
  const add=cands.slice(0,room);S.shelf.push(...add);if(tab==='counter')render();
}
function tickCounter(now){
  if(now%3000<120)clerkStock();
  if(cust&&cust.state==='offer'&&up('clerk')>=2&&now-cust.arrived>2500&&custTotal()>=1.5*cust.items.reduce((a,x)=>a+valueOf(fromKey(x.k)),0)){acceptOffer()}
  if(S.level<5)return;
  if(!cust&&S.shelf.length&&now>nextCust&&!(up('line')&&(S.line||[]).length>=LINE_MAX))spawnCustomer(now);
  if(S.line&&S.line.length&&now%1000<120)pruneLine();

}
function lineTotal(e){return Math.round(e.items.reduce((a,x)=>a+x.offer,0)*100)/100}
function pruneLine(){const before=JSON.stringify(S.line);const pr={};S.line.forEach(e=>{e.items=e.items.filter(x=>{pr[x.k]=(pr[x.k]||0)+1;return S.shelf.filter(k=>k===x.k).length>=pr[x.k]})});S.line=S.line.filter(e=>e.items.length);if(JSON.stringify(S.line)!==before){renderTabs();if(tab==='counter')renderEvents()}}

    <div class="lineq">${L.map((e,i)=>{const ini=e.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();return `<div class="lq"><span class="av" style="background:${e.color}">${esc(ini)}</span><div class="lqm"><b>${esc(e.name)}</b><span>${e.items.map(x=>esc(P[fromKey(x.k).pid].name)).join(', ')}</span></div><b class="lqv">${money(lineTotal(e))}</b><button class="btn go sm" data-lsell="${i}">Sell</button><button class="btn sm" data-lno="${i}" aria-label="Send away">×</button></div>`}).join('')}</div></div>`;

function selAct(a,opt={}){

    toast(sent?`Cracked ${sent} slab${sent>1?'s':''} and sent ${sent>1?'them':'it'} back to Slab Happy (${GTIERS[gTier(opt.tier)].name}).${gradeWaiting()?` ${gradeWaiting()} waiting in line.`:''}${broke?' Ran out of cash for the rest.':''}`:broke?'Not enough cash to resubmit.':'Nothing could be resubmitted.','good');save(true);updateHeader();renderGrader();redraw();return}
  if(a==='grade'&&!opt.tier){const raw=ks.filter(k=>!fromKey(k).g);if(!raw.length){toast('Slabs are already graded.');return}

  if(a==='shelf'){let n=0;for(const k of ks){if(S.shelf.length>=shelfCap())break;if(isOne(fromKey(k))||avail(k)<=0)continue;S.shelf.push(k);n++;sel.delete(k)}

/* the artifact-style db the game expects, backed by Firestore under apps/<APP>/ */
function makeDb(F, fs) {
  const P = p => 'apps/' + APP + '/' + p;
  const err = e => ({ code: (e && e.code === 'permission-denied') ? 'revoked' : 'unavailable', message: String((e && e.message) || e) });
  const wrapDoc = s => { const ex = s.exists(); const d = ex ? s.data() : undefined; return { id: s.id, exists: ex, data: () => d, metadata: s.metadata }; };
  const wrapQuery = q => { const docs = q.docs.map(wrapDoc); return { docs, size: docs.length, empty: !docs.length, metadata: q.metadata,
    docChanges: () => q.docChanges().map(c => ({ type: c.type, doc: wrapDoc(c.doc), oldIndex: c.oldIndex, newIndex: c.newIndex })) }; };
  function docRef(path) {
    const r = F.doc(fs, P(path));
    return { id: r.id, path,
      get: () => F.getDoc(r).then(wrapDoc),
      set: data => F.setDoc(r, data),
      update: data => F.updateDoc(r, data),
      delete: () => F.deleteDoc(r),
      onSnapshot: (next, onErr) => F.onSnapshot(r, s => next(wrapDoc(s)), e => onErr && onErr(err(e))),
      collection: sub => colRef(path + '/' + sub) };
  }
  function query(base, cons) {
    const target = () => cons.length ? F.query(base, ...cons) : base;
    return {
      where: (f, op, v) => query(base, [...cons, F.where(f, op, v)]),
      orderBy: (f, d) => query(base, [...cons, F.orderBy(f, d || 'asc')]),
      limit: n => query(base, [...cons, F.limit(n)]),
      get: () => F.getDocs(target()).then(wrapQuery),
      onSnapshot: (next, onErr) => F.onSnapshot(target(), s => next(wrapQuery(s)), e => onErr && onErr(err(e))) };
  }
  function colRef(path) {
    const q = query(F.collection(fs, P(path)), []);
    q.path = path;
    q.doc = id => docRef(path + '/' + (id || (Date.now().toString(36) + Math.random().toString(36).slice(2, 10))));
    q.add = async data => { const d = q.doc(); await d.set(data); return d; };
    return q;
  }
  return { doc: docRef, collection: colRef };
}
