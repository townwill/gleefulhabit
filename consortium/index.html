<title>Consortium</title>
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { height: 100%; }
body { margin: 0; font-size: 14px; }
.updatebar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 80;
  display: flex; flex-direction: column; align-items: center; gap: 2px; border-radius: 16px; padding: 10px 18px;
  background: #ff7448; color: #2b0f05; border: none; box-shadow: 0 12px 30px #000a; }
.updatebar span { font-weight: 400; font-size: .8rem; }
.vtag { text-align: center; color: #8b94a8; font-size: .72rem; margin: 6px 0 0; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;600;700&display=swap">
<style>
/* Layout: dark table, playing-card proportions (5:7). Trays row, deck row, 4 columns. Coral = category, mint = where a card can go. Single dark look by choice. */
:root {
  --bg: #0d1016;
  --bg-2: #171c27;
  --surface: #1b2130;
  --edge: #2c3447;
  --text: #eef1f6;
  --muted: #8b94a8;
  --card: #fbfbf9;
  --ink: #141722;
  --ink-2: #5d6578;
  --cat: #ff7448;
  --cat-2: #ff9a62;
  --cat-ink: #2b0f05;
  --focus: #5fe3cc;
  --done: #5ad38f;
  --back-1: #3b4fd0;
  --back-2: #1f2a7a;
  --f-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-ui: "Figtree", system-ui, sans-serif;
  --f-emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  --gap: 8px; --cw: 86px; --ch: 120px; --tw: 86px; --th: 120px;
  color-scheme: dark;
}
html, body { background: var(--bg); color: var(--text); }
body {
  font-family: var(--f-ui);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 32px;
  background-image: radial-gradient(120% 60% at 50% 0%, var(--bg-2), var(--bg) 70%);
  min-height: 100%;
  -webkit-tap-highlight-color: transparent;
  user-select: none; -webkit-user-select: none;
}
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
.app { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

/* Header */
header { display: flex; align-items: flex-end; gap: 12px; }
.brand { flex: 1; min-width: 0; }
h1 { font-family: var(--f-display); font-weight: 800; font-size: 1.55rem; letter-spacing: -.03em; margin: 0; line-height: 1; }
.meta { font-size: .78rem; color: var(--muted); margin-top: 5px; }
.moves { text-align: right; line-height: 1; font-variant-numeric: tabular-nums; }
.moves b { font-family: var(--f-display); font-weight: 800; font-size: 1.9rem; letter-spacing: -.03em; display: block; }
.moves span { font-size: .66rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.moves.low b { color: var(--cat); }
.toolbar { display: flex; gap: 8px; align-items: center; }
button {
  font: 600 .85rem var(--f-ui); color: var(--text); background: var(--surface);
  border: 1px solid var(--edge); border-radius: 999px; padding: 8px 15px; cursor: pointer;
  transition: border-color .15s, background .15s;
}
button:hover { border-color: var(--muted); }
button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
button:disabled { opacity: .35; cursor: default; }
button.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
.sorted { display: flex; gap: 4px; align-items: center; margin-top: 8px; }
.toolbar { flex-wrap: wrap; gap: 6px !important; }
.toolbar > button { padding: 8px 13px; }
h1 .sort { color: var(--cat); }
.brand-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
.brand-row .sorted { margin-top: 0; }
.mini-btn { padding: 3px 10px; font-size: .74rem; }
.seg { display: flex; background: var(--surface); border: 1px solid var(--edge); border-radius: 999px; padding: 3px; margin-right: auto; }
.seg button { border: none; background: transparent; padding: 5px 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--text); color: var(--bg); }
.nba .mid { font-size: calc(var(--cw) * .14); font-weight: 600; }
.emo .mid { font: calc(var(--cw) * .42) / 1 var(--f-emoji); }
.stats { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; margin: 4px 0 14px; text-align: left; }
.stats th, .stats td { padding: 7px 4px; border-bottom: 1px solid var(--edge); font-size: .88rem; }
.stats th { font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.stats td:not(:first-child), .stats th:not(:first-child) { text-align: right; }
.stats td:first-child { color: var(--muted); }
.stats td b { font-family: var(--f-display); font-size: 1.05rem; }
.toplist { list-style: none; margin: 0 0 16px; padding: 0; text-align: left; display: grid; gap: 6px; }
.toplist li { display: flex; justify-content: space-between; gap: 8px; font-size: .88rem; }
.toplist li span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }
.panel h3 { font: 700 .7rem var(--f-ui); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; text-align: left; }
.panel { max-height: calc(100% - 32px); overflow-y: auto; }
.sorted i { width: 16px; height: 5px; border-radius: 3px; background: var(--edge); transition: background .3s; }
.sorted i.on { background: var(--done); }

/* Trays */
.trays { display: flex; gap: var(--gap); }
.tray {
  width: var(--tw); height: var(--th); border-radius: calc(var(--tw) * .1);
  position: relative; flex: none; cursor: pointer; transition: box-shadow .15s, background .15s;
}
.tray.empty {
  border: 1.5px dashed var(--edge); display: flex; flex-direction: column; align-items: center; justify-content: center;
  color: var(--muted); gap: 2px;
}
.tray.empty b { font: 500 calc(var(--tw) * .3) / 1 var(--f-display); }
.tray.empty small { font-size: calc(var(--tw) * .12); letter-spacing: .08em; text-transform: uppercase; }
.tray.open {
  background: linear-gradient(165deg, var(--cat-2), var(--cat)); color: var(--cat-ink);
  box-shadow: 0 6px 18px #ff744833; padding: calc(var(--tw) * .09);
  display: flex; flex-direction: column; gap: calc(var(--tw) * .05);
}
.tname { font: 800 calc(var(--tw) * .15) / 1.05 var(--f-display); letter-spacing: -.02em; overflow-wrap: anywhere; }
.prog { height: 4px; border-radius: 2px; background: #0000002a; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--cat-ink); border-radius: 2px; transition: width .3s; }
.cnt { font: 700 calc(var(--tw) * .12) var(--f-ui); font-variant-numeric: tabular-nums; opacity: .8; }
.mini {
  position: absolute; left: 9%; right: 9%; bottom: 7%; height: 32%;
  background: var(--card); color: var(--ink); border-radius: calc(var(--tw) * .07);
  display: grid; place-items: center; text-align: center; padding: 0 4px;
  font: 700 calc(var(--tw) * .13) / 1 var(--f-display); box-shadow: 0 2px 6px #0003;
  overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
}
.mini.pic { font: calc(var(--tw) * .24) / 1 var(--f-emoji); }
.stamp {
  position: absolute; inset: 0; border-radius: inherit; background: var(--done); color: #06210f;
  display: grid; place-items: center; text-align: center; padding: 6px;
  font: 800 calc(var(--tw) * .14) / 1.1 var(--f-display); animation: stamp 1s ease forwards; pointer-events: none;
}
.stamp::before { content: "✓"; display: block; font-size: 1.8em; }
@keyframes stamp { 0% { transform: scale(1.12); opacity: 0 } 18% { transform: scale(1); opacity: 1 } 70% { opacity: 1 } 100% { opacity: 0 } }

/* Deck row */
.deck { display: flex; gap: var(--gap); align-items: center; height: var(--ch); }
.stock { width: var(--cw); height: var(--ch); position: relative; flex: none; cursor: pointer; border-radius: calc(var(--cw) * .1); }
.stock .count {
  position: absolute; right: -6px; top: -6px; z-index: 2; min-width: 22px; height: 22px; padding: 0 6px;
  border-radius: 11px; background: var(--text); color: var(--bg); font: 700 .72rem/22px var(--f-ui); text-align: center;
}
.stock.empty { border: 1.5px dashed var(--edge); display: grid; place-items: center; color: var(--muted); font-size: .75rem; text-align: center; }
.stock.empty b { display: block; font-size: 1.4rem; font-weight: 500; }
.waste { width: calc(var(--cw) + 30px); height: var(--ch); position: relative; flex: none; }
.waste .ph { position: absolute; inset: 0; right: 30px; border: 1.5px dashed var(--edge); border-radius: calc(var(--cw) * .1); opacity: .5; }
.hint { font-size: .78rem; color: var(--muted); line-height: 1.4; min-width: 0; }
.hint b { color: var(--text); font-weight: 600; }

/* Cards */
.card {
  position: absolute; left: 0; top: 0; width: var(--cw); height: var(--ch);
  border-radius: calc(var(--cw) * .1); touch-action: none; cursor: grab;
  box-shadow: 0 1px 1px #0004, 0 4px 12px #0005;
  transition: transform .14s ease, box-shadow .14s ease;
}
.tl {
  position: absolute; top: calc(var(--cw) * .075); left: calc(var(--cw) * .09); right: calc(var(--cw) * .09);
  font: 700 calc(var(--cw) * .14) / 1.15 var(--f-display); letter-spacing: -.01em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.mid {
  position: absolute; inset: 28% 8% 12%; display: grid; place-items: center; text-align: center;
  font: 500 calc(var(--cw) * .175) / 1.05 var(--f-display); letter-spacing: -.02em; overflow-wrap: anywhere;
}
.word, .pic { background: var(--card); color: var(--ink); }
.word .mid { color: var(--ink-2); }
.pic .tl { font: calc(var(--cw) * .17) / 1 var(--f-emoji); }
.pic .mid { font: calc(var(--cw) * .44) / 1 var(--f-emoji); }
.cat { background: linear-gradient(165deg, var(--cat-2), var(--cat)); color: var(--cat-ink); }
.cat .mid { font-weight: 800; font-size: calc(var(--cw) * .16); inset: 26% 8% 26%; }
.pill {
  position: absolute; left: 50%; bottom: calc(var(--cw) * .09); transform: translateX(-50%);
  font: 700 calc(var(--cw) * .092) / 1 var(--f-ui); letter-spacing: .07em; text-transform: uppercase; white-space: nowrap;
  background: #0000001f; padding: 4px 7px; border-radius: 999px;
}
.back {
  background:
    repeating-linear-gradient(45deg, #ffffff0c 0 2px, transparent 2px 7px),
    linear-gradient(150deg, var(--back-1), var(--back-2));
  box-shadow: inset 0 0 0 3px #ffffff22, 0 1px 1px #0004, 0 4px 12px #0005; cursor: default;
}
.card.sel { transform: translateY(-7px); box-shadow: 0 0 0 2.5px var(--focus), 0 14px 26px #000a; }
.card.reveal { animation: reveal .28s ease; }
@keyframes reveal { from { transform: rotateY(90deg); } to { transform: none; } }
.lift { box-shadow: 0 0 0 2px var(--focus), 0 22px 40px #000b !important; }

.tableau { display: grid; grid-template-columns: repeat(4, var(--cw)); gap: var(--gap); }
.col { position: relative; }
.col.empty::before {
  content: ""; position: absolute; left: 0; top: 0; width: var(--cw); height: var(--ch);
  border: 1.5px dashed var(--edge); border-radius: calc(var(--cw) * .1);
}
.col.target::after, .tray.target::after {
  content: ""; position: absolute; inset: -5px; border-radius: calc(var(--cw) * .14);
  border: 2px solid var(--focus); pointer-events: none; opacity: .7;
}
.col.hover::after, .tray.hover::after { opacity: 1; background: #5fe3cc1f; border-width: 3px; }

.col.hover::after, .tray.hover::after {
  content: ""; position: absolute; inset: -5px; border-radius: calc(var(--cw) * .14);
  border: 2px solid #ffffff55; background: #ffffff0d; pointer-events: none;
}
.shake { animation: shake .38s ease; }
@keyframes shake { 0%, 100% { transform: none } 20% { transform: translateX(-7px) } 40% { transform: translateX(6px) } 60% { transform: translateX(-4px) } 80% { transform: translateX(2px) } }
.moves.hit b { animation: hit .5s ease; }
@keyframes hit { 0% { color: var(--cat); transform: scale(1.25) } 100% { transform: none } }
.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 70;
  transform: translateX(-50%); background: var(--text); color: var(--bg);
  font: 700 .88rem var(--f-ui); padding: 10px 18px; border-radius: 999px; white-space: nowrap;
  box-shadow: 0 10px 30px #000a; pointer-events: none;
}
.toast.show { animation: toast 1.4s ease forwards; }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, 10px) } 12%, 80% { opacity: 1; transform: translate(-50%, 0) } 100% { opacity: 0 } }
#ghost { position: fixed; pointer-events: none; z-index: 50; }
#ghost .card { cursor: grabbing; }

.rules { font-size: .82rem; color: var(--muted); line-height: 1.55; margin: 4px 0 0; max-width: 62ch; }
.rules b { color: var(--text); font-weight: 600; }

.overlay { position: fixed; inset: 0; background: #06080ccc; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); display: grid; place-items: center; padding: 16px; z-index: 60; }
.panel { background: var(--surface); border: 1px solid var(--edge); border-radius: 18px; padding: 24px 22px 20px; max-width: 330px; width: 100%; text-align: center; box-shadow: 0 30px 60px #000c; }
.panel h2 { font-family: var(--f-display); font-weight: 800; letter-spacing: -.03em; margin: 0 0 6px; font-size: 1.6rem; }
.panel p { margin: 0 0 18px; color: var(--muted); font-size: .92rem; line-height: 1.45; }
.panel .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

@media (prefers-reduced-motion: reduce) { .card, .stamp, .card.reveal { animation: none !important; transition: none !important; } }
</style>

</head>
<body>
<div class="app" id="app">
  <header>
    <div class="brand">
      <h1 aria-label="Consortium">Con<span class="sort">sort</span>ium</h1>
      <div class="meta" id="meta"></div>
      <div class="brand-row"><div class="sorted" id="sorted" aria-label="Categories sorted"></div><button id="statsbtn" class="mini-btn" type="button">Stats</button></div>
    </div>
    <div class="moves" id="moves"></div>
  </header>
  <div class="toolbar">
    <div class="seg" role="group" aria-label="Game mode">
      <button id="m-classic" type="button" data-mode="classic">Classic</button>
      <button id="m-nba" type="button" data-mode="nba">NBA</button>
    </div>
    <button id="undo" type="button">Undo</button>
    <button id="newdeal" type="button">New deal</button>
  </div>

  <div id="board" style="display:flex;flex-direction:column;gap:16px">
    <section class="trays" id="trays" aria-label="Trays"></section>
    <section class="deck">
      <div class="stock" id="stock" data-stock role="button" aria-label="Draw a card"></div>
      <div class="waste" id="waste"></div>
      <div class="hint">Drawing is <b>free</b>. Drag a card, or tap it then tap where it goes.</div>
    </section>
    <section class="tableau" id="tableau"></section>
  </div>


  <div class="toast" id="toast" role="status" hidden></div>
  <div class="overlay" id="overlay" hidden>
    <div class="panel">
      <h2 id="ovTitle"></h2>
      <p id="ovText"></p>
      <div id="ovBody"></div>
      <div class="row" id="ovBtns"></div>
    </div>
  </div>
</div>

<script>

/* ---------- version + update check (home-screen apps can hold on to an old copy) ---------- */

    if (!resp.ok) return;
    const m = (await resp.text()).match(/const APP_VERSION = '([^']+)'/);
    if (!m || m[1] <= APP_VERSION) return;
    updateShown = true;
    const bar = document.createElement('button');
    bar.className = 'updatebar'; bar.type = 'button';
    bar.innerHTML = '<b>New version ready</b><span>Tap to update</span>';
    bar.onclick = () => location.replace(location.pathname + '?v=' + encodeURIComponent(m[1]));
    document.body.appendChild(bar);
  } catch (e) { /* offline: try again next time */ }
}
